    function onTransferFromChange(fromId) {
      state.transferFromId = fromId;
      // Reset TO if it now equals FROM
      if (state.transferToId === fromId) {
        const alt = LOCATIONS.find((l) => l.id !== fromId);
        state.transferToId = alt ? alt.id : null;
      }
      // Reset quantity/units — the availability changed
      state.transferQty = "";
      state.transferSelectedUnits = [];
      // Re-seed if individual
      const product = getInvProduct(state.inventoryProductId);
      if (product && product.trackingType === "Individual") {
        const avail = getTransferableStock(product.id, fromId);
        if (avail > 0) {
          state.transferQty = String(Math.min(1, avail));
          state.transferSelectedUnits = getTransferCandidates(product.id, fromId, 1);
        }
      }
      render();
    }


    function onTransferToChange(toId) {
      state.transferToId = toId;
      render();
    }

    function onTransferBatchChange(batchId) {
      state.transferBatchId = batchId;
      // Re-clamp the quantity input if it now exceeds the batch's availability
      const product = getInvProduct(state.inventoryProductId);
      if (product && product.trackingType === "StockQuantity") {
        const batches = getBatchesAtLocation(product.id, state.transferFromId);
        const selectedBatch = batches.find((b) => b.batchId === batchId);
        const maxQty = selectedBatch ? selectedBatch.available : 0;
        const currentQty = parseInt(state.transferQty, 10) || 0;
        if (currentQty > maxQty) {
          state.transferQty = String(maxQty);
        }
      }
      render();
    }

    function onTransferQtyChange(rawValue) {
      const qty = Math.max(0, parseInt(rawValue, 10) || 0);
      state.transferQty = rawValue;
      // Changing qty invalidates any manual unit selection — re-seed FIFO
      state.transferChangingUnitsFor = false;
      const product = getInvProduct(state.inventoryProductId);
      if (product && product.trackingType === "Individual") {
        const available = getTransferableStock(product.id, state.transferFromId);
        const cappedQty = Math.min(qty, available);
        state.transferSelectedUnits = getTransferCandidates(
          product.id,
          state.transferFromId,
          cappedQty
        );
      }
      render();
    }



    function commitTransferStock() {
      const productId = state.inventoryProductId;
      const fromId = state.transferFromId;
      const toId = state.transferToId;
      const qty = parseInt(state.transferQty, 10) || 0;
      const notes = (state.transferNotes || "").trim();

      if (fromId === toId) return alert("From and To locations must be different.");

      const product = getInvProduct(productId);

      // Validate quantity — either against total available, or against batch available
      if (product.trackingType === "StockQuantity") {
        if (!state.transferBatchId) return alert("Select a batch to transfer from.");
        const batches = getBatchesAtLocation(productId, fromId);
        const selectedBatch = batches.find((b) => b.batchId === state.transferBatchId);
        if (!selectedBatch) return alert("Batch not found at this location.");
        if (qty <= 0 || qty > selectedBatch.available) {
          return alert(`Invalid quantity. Available in this batch: ${selectedBatch.available}.`);
        }
      } else {
        const available = getTransferableStock(productId, fromId);
        if (qty <= 0 || qty > available) return alert("Invalid quantity.");
        const selectedUnitIds = state.transferSelectedUnits || [];
        if (selectedUnitIds.length !== qty) {
          return alert(`Select exactly ${qty} units to transfer.`);
        }
      }

      const selectedUnitIds =
        product.trackingType === "Individual" ? state.transferSelectedUnits : [];

      executeTransfer(productId, fromId, toId, qty, selectedUnitIds, notes, state.transferBatchId);

      closeTransferStockModal();
    }

    /* ============================================================

    // Auto-pick N units of a product from a location (FIFO by receivedDate, then tag)
    // Respects soft-reservations belonging to this order
    function autoPickUnits(productId, locationId, qty, orderNumber) {
      const candidates = UNITS.filter(
        (u) =>
          u.productId === productId &&
          u.locationId === locationId &&
          u.status === "Available" &&
          (!u.softReservedFor || u.softReservedFor === orderNumber),
      );
      // Sort FIFO: oldest receivedDate first, then by tag alphabetically
      candidates.sort((a, b) => {
        if (a.receivedDate !== b.receivedDate)
          return a.receivedDate < b.receivedDate ? -1 : 1;
        return a.tag < b.tag ? -1 : 1;
      });
      return candidates.slice(0, qty).map((u) => u.id);
    }

    // Reset the dispatch wizard state
    function resetDispatchWizard() {
      state.dispatchWizard = {
        step: 1,
        deliveryMode: "", // '' | 'Company Fleet' | 'Courier'
        driver: "",
        vehicle: "",
        courier: "",
        trackingNumber: "",
        dispatchDate: todayISO(),
        dispatchNotes: "",
        dispatchLocationId:
          LOCATIONS.find((l) => l.isDefaultDispatch)?.id || LOCATIONS[0].id,
        changingUnitsFor: null,
        unitSearch: "",
        unitSelections: {},
      };
    }

    // Initialize the wizard from the current order (pre-populate with auto-picks)
    function initDispatchWizard() {
      resetDispatchWizard();
      const w = state.dispatchWizard;
      const o = state.order;

      // Prefer the order's pickup location if it's a pickup order —
      // that's where the outstanding stock physically lives.
      if (o.fulfillment === "Pickup" && o.pickupLocation) {
        const pickupLoc = LOCATIONS.find((l) => l.name === o.pickupLocation);
        if (pickupLoc) w.dispatchLocationId = pickupLoc.id;
      }
      // Pre-select driver/vehicle if there's only one available
      const availableDrivers = DRIVERS.filter(
        (d) => d.status === "Available",
      );
      if (availableDrivers.length === 1) w.driver = availableDrivers[0].name;

      const availableVehicles = VEHICLES.filter(
        (v) => v.status === "Available",
      );
      if (availableVehicles.length === 1)
        w.vehicle = availableVehicles[0].plate;

      // Auto-pick units for each outstanding individual-item line.
      // Dispatch operates on outstanding quantities, not ordered ones.
      calcOutstandingLines(o).forEach((line) => {
        const product = getInvProduct(line.productId);
        if (!product) return;

        if (product.trackingType === "Individual") {
          w.unitSelections[line.productId] = autoPickUnits(
            line.productId,
            w.dispatchLocationId,
            line.outstanding,
            o.orderNumber,
          );
        }
      });
    }

    // When the location changes, re-run auto-picks for all individual items
    function resetAutoPicksForLocation(locationId) {
      const w = state.dispatchWizard;
      const o = state.order;
      w.dispatchLocationId = locationId;
      w.unitSelections = {};

      calcOutstandingLines(o).forEach((line) => {
        const product = getInvProduct(line.productId);
        if (!product) return;

        if (product.trackingType === "Individual") {
          w.unitSelections[line.productId] = autoPickUnits(
            line.productId,
            locationId,
            line.outstanding,
            o.orderNumber,
          );
        }
      });
    }

    // ===== PICKUP STOCK HELPERS =====

    // Reserve stock at the pickup location when the order is marked Ready for Pickup.
    // - Individual items: flip N Available units → Reserved
    // - Stock quantity: increment `reserved` on the stock row
    function reserveStockForPickup(order) {
      const locationId = LOCATIONS.find(
        (l) => l.name === order.pickupLocation,
      )?.id;
      if (!locationId) return;

      order.items.forEach((item) => {
        const product = getInvProduct(item.productId);
        if (!product) return;

        if (product.trackingType === "Individual") {
          const units = UNITS.filter(
            (u) =>
              u.productId === item.productId &&
              u.locationId === locationId &&
              u.status === "Available",
          ).slice(0, item.qty);

          units.forEach((u) => {
            u.status = "Reserved";
            u.reservedForOrder = order.orderNumber;
          });

          if (units.length < item.qty) {
            logTimeline(
              `⚠ Only ${units.length} of ${item.qty} units could be reserved for ${product.name}.`,
            );
          }

          logMovement(
            item.productId,
            locationId,
            "reservation",
            units.length,
            order.orderNumber,
          );
        } else {
          let remaining = item.qty;
          const rows = getFIFOStockRows(item.productId, locationId);

          rows.forEach((row) => {
            if (remaining <= 0) return;
            const available = Math.max(0, row.onHand - (row.reserved || 0));
            const reserveQty = Math.min(available, remaining);
            row.reserved = (row.reserved || 0) + reserveQty;
            remaining -= reserveQty;
          });

          const reservedTotal = item.qty - remaining;
          if (reservedTotal < item.qty) {
            logTimeline(
              `⚠ Only ${reservedTotal} of ${item.qty} units could be reserved for ${product.name}.`,
            );
          }

          logMovement(
            item.productId,
            locationId,
            "reservation",
            reservedTotal,
            order.orderNumber,
          );
        }
      });

      logTimeline("Stock reserved for pickup.");
    }

    // Deduct reserved stock when the order is collected.
    // - Individual items: flip N Reserved units (belonging to this order) → Sold
    // - Stock quantity: decrement `reserved` and `onHand`
    function finalizePickupStock(order) {
      order.items.forEach((item) => {
        const product = getInvProduct(item.productId);
        if (!product) return;

        if (product.trackingType === "Individual") {
          UNITS.forEach((u) => {
            if (
              u.reservedForOrder === order.orderNumber &&
              u.status === "Reserved"
            ) {
              u.status = "Sold";
              u.reservedForOrder = null;
            }
          });
          logMovement(
            item.productId,
            null,
            "check_out",
            item.qty,
            order.orderNumber,
          );
        } else {
          const locationId = LOCATIONS.find(
            (l) => l.name === order.pickupLocation,
          )?.id;
          let remaining = item.qty;

          STOCK.filter(
            (s) =>
              s.productId === item.productId &&
              (!locationId || s.locationId === locationId) &&
              s.reserved > 0,
          ).forEach((row) => {
            if (remaining <= 0) return;
            const toDeduct = Math.min(row.reserved, remaining);
            row.reserved -= toDeduct;
            row.onHand -= toDeduct;
            remaining -= toDeduct;

            // Log per-batch depletion
            const batch = row.batchId ? getBatch(row.batchId) : null;
            const batchLabel = batch ? `${batch.batchNumber} (${batch.supplier})` : "unknown batch";
            logMovement(
              item.productId,
              row.locationId,
              "check_out",
              toDeduct,
              `${order.orderNumber} · ${batchLabel}`,
            );
          });
        }
      });
    }

    // Release stock reserved for a Pickup order that is being cancelled.
    function releasePickupReservation(order) {
      order.items.forEach((item) => {
        const product = getInvProduct(item.productId);
        if (!product) return;

        if (product.trackingType === "Individual") {
          UNITS.forEach((u) => {
            if (
              u.reservedForOrder === order.orderNumber &&
              u.status === "Reserved"
            ) {
              u.status = "Available";
              u.reservedForOrder = null;
            }
          });
          logMovement(
            item.productId,
            null,
            "reservation_release",
            item.qty,
            order.orderNumber,
          );
        } else {
          const locationId = LOCATIONS.find(
            (l) => l.name === order.pickupLocation,
          )?.id;
          let remaining = item.qty;

          STOCK.filter(
            (s) =>
              s.productId === item.productId &&
              (!locationId || s.locationId === locationId) &&
              s.reserved > 0,
          ).forEach((row) => {
            if (remaining <= 0) return;
            const toRelease = Math.min(row.reserved, remaining);
            row.reserved -= toRelease;
            remaining -= toRelease;
          });

          logMovement(
            item.productId,
            locationId,
            "reservation_release",
            item.qty,
            order.orderNumber,
          );
        }
      });

      logTimeline("Pickup reservation released.");
    }

    // Release stock that was hard-reserved for a Delivery order being cancelled
    // while Out for Delivery. Also frees any assigned driver/vehicle.
    function releaseDeliveryReservation(order) {
      order.items.forEach((item) => {
        const product = getInvProduct(item.productId);
        if (!product) return;

        if (product.trackingType === "Individual") {
          // Units reserved for this order → back to Available.
          // Location is preserved — they never actually left the warehouse
          // in the demo (the trip hasn't been completed).
          UNITS.forEach((u) => {
            if (
              u.reservedForOrder === order.orderNumber &&
              u.status === "Reserved"
            ) {
              u.status = "Available";
              u.reservedForOrder = null;
              u.softReservedFor = null;
            }
          });
          logMovement(
            item.productId,
            null,
            "reservation_release",
            item.qty,
            order.orderNumber,
          );
        } else {
          // Stock quantity: decrement reserved on every stock row that has some.
          let remaining = item.qty;
          STOCK.filter(
            (s) => s.productId === item.productId && s.reserved > 0,
          ).forEach((row) => {
            if (remaining <= 0) return;
            const toRelease = Math.min(row.reserved, remaining);
            row.reserved -= toRelease;
            remaining -= toRelease;
          });
          logMovement(
            item.productId,
            null,
            "reservation_release",
            item.qty,
            order.orderNumber,
          );
        }
      });

      // Free the driver/vehicle that was assigned to this order.
      if (order.dispatchInfo) {
        const { driver, vehicle } = order.dispatchInfo;
        if (driver) {
          const d = DRIVERS.find((x) => x.name === driver);
          if (d && d.status === "On Trip") {
            // Only mark Available if no other in-transit order uses this driver.
            const stillAssigned = state.inTransitOrders.some(
              (o) =>
                o.orderNumber !== order.orderNumber &&
                o.dispatchInfo &&
                o.dispatchInfo.driver === driver,
            );
            if (!stillAssigned) d.status = "Available";
          }
        }
        if (vehicle) {
          const v = VEHICLES.find((x) => x.plate === vehicle);
          if (v && v.status === "On Trip") {
            const stillAssigned = state.inTransitOrders.some(
              (o) =>
                o.orderNumber !== order.orderNumber &&
                o.dispatchInfo &&
                o.dispatchInfo.vehicle === vehicle,
            );
            if (!stillAssigned) v.status = "Available";
          }
        }
      }

      // Remove from in-transit if present
      state.inTransitOrders = state.inTransitOrders.filter(
        (x) => x.orderNumber !== order.orderNumber,
      );

      logTimeline("Delivery reservation released. Driver/vehicle freed.");
    }

    // Walk-in path: no reservation step happened.
    // Flip N Available units → Sold, and decrement onHand for stock quantities.
    function deductStockDirectlyForPickup(order) {
      const locationId = LOCATIONS.find(
        (l) => l.name === order.pickupLocation,
      )?.id;
      if (!locationId) return;

      order.items.forEach((item) => {
        const product = getInvProduct(item.productId);
        if (!product) return;

        if (product.trackingType === "Individual") {
          const units = UNITS.filter(
            (u) =>
              u.productId === item.productId &&
              u.locationId === locationId &&
              u.status === "Available",
          ).slice(0, item.qty);

          units.forEach((u) => (u.status = "Sold"));

          logMovement(
            item.productId,
            locationId,
            "check_out",
            units.length,
            order.orderNumber,
          );
        } else {
          let remaining = item.qty;
          const rows = getFIFOStockRows(item.productId, locationId);
          rows.forEach((row) => {
            if (remaining <= 0) return;
            const deduct = Math.min(row.onHand, remaining);
            row.onHand -= deduct;
            remaining -= deduct;

            // Log per-batch depletion
            const batch = row.batchId ? getBatch(row.batchId) : null;
            const batchLabel = batch ? `${batch.batchNumber} (${batch.supplier})` : "unknown batch";
            logMovement(
              item.productId,
              locationId,
              "check_out",
              deduct,
              `${order.orderNumber} · ${batchLabel}`,
            );
          });
        }
      });

      logTimeline("Stock deducted (walk-in pickup).");
    }

    // ===== SOFT RESERVATION =====
    // Called when an order becomes fully paid.
    // Increments the reserved counter on each stock row (stock quantity products)
    // and marks the appropriate number of units as "soft reserved" (individual items).
    // For now, we only track this on the order (as `softReservation` object).
    // The specific unit assignment happens at dispatch.
    function applySoftReservation(order) {
      if (order.softReservation) return; // already applied

      order.softReservation = {
        appliedAt: new Date().toISOString(),
        items: [],
      };

      order.items.forEach((i) => {
        const product = getInvProduct(i.productId);
        if (!product) return;

        if (product.trackingType === "StockQuantity") {
          const defaultLoc =
            LOCATIONS.find((l) => l.isDefaultDispatch)?.id || LOCATIONS[0].id;

          let remaining = i.qty;
          const rows = getFIFOStockRows(i.productId, defaultLoc);

          rows.forEach((row) => {
            if (remaining <= 0) return;
            const available = Math.max(0, row.onHand - (row.reserved || 0));
            const reserveQty = Math.min(available, remaining);
            row.reserved = (row.reserved || 0) + reserveQty;
            remaining -= reserveQty;
          });

          const reservedTotal = i.qty - remaining;
          if (reservedTotal < i.qty) {
            logTimeline(
              `⚠ Only ${reservedTotal} of ${i.qty} could be reserved for ${product.name}. Insufficient stock.`,
            );
          }

          order.softReservation.items.push({
            productId: i.productId,
            qty: i.qty,
            trackingType: "StockQuantity",
            locationId: defaultLoc,
          });
        } else {
          const available = UNITS.filter(
            (u) => u.productId === i.productId && u.status === "Available",
          ).slice(0, i.qty);
          available.forEach((u) => {
            u.softReservedFor = order.orderNumber;
          });
          // Log if fewer than needed
          if (available.length < i.qty) {
            logTimeline(
              `⚠ Only ${available.length} of ${i.qty} units could be reserved for ${product.name}. Insufficient stock.`,
            );
          }
          order.softReservation.items.push({
            productId: i.productId,
            qty: i.qty,
            trackingType: "Individual",
            reservedUnits: available.map((u) => u.id),
          });
        }
      });

      logTimeline(`Stock soft-reserved for this order.`);
    }

    function releaseSoftReservation(order) {
      if (!order.softReservation) return;

      order.softReservation.items.forEach((item) => {
        if (item.trackingType === "StockQuantity") {
          const row = STOCK.find(
            (s) =>
              s.productId === item.productId &&
              s.locationId === item.locationId,
          );
          if (row) {
            row.reserved = Math.max(0, (row.reserved || 0) - item.qty);
          }
        } else {
          // Clear the softReservedFor marker
          (item.reservedUnits || []).forEach((uid) => {
            const unit = UNITS.find((u) => u.id === uid);
            if (unit) unit.softReservedFor = null;
          });
        }
      });

      order.softReservation = null;
      logTimeline("Stock reservation released.");
    }

        <div class="card">

    function onTripModeChange(value) {

    /* ---------- Add Orders Picker (used from within the trip wizard) ---------- */

    function renderAddOrdersPicker() {
      const trip = state.trip;
      if (!trip) return "";

      // Eligible: Fleet orders in the pool that aren't already in the trip.
      const tripNumbers = new Set(trip.orders.map((o) => o.orderNumber));
      const eligible = state.dispatchPool.filter(
        (o) =>
          o.deliveryMode === "Company Fleet" &&
          !tripNumbers.has(o.orderNumber),
      );

      const selectedCount = Object.values(state.addOrdersSelected).filter(
        Boolean,
      ).length;

      return `
    <div class="modal-overlay" onclick="if(event.target===this)closeAddOrdersPicker()">
      <div class="modal">
        <div class="modal-header">Add Orders to Trip <button class="close-x" onclick="closeAddOrdersPicker()">×</button></div>
        <div class="modal-body">
          ${eligible.length === 0
          ? `<div class="empty-state">No other fleet orders are available to add.</div>`
          : `
            <p style="font-size:12px; color:#555;">
              Select orders to include in this trip.
            </p>
            <div style="max-height:320px; overflow-y:auto; border:2px solid #1a1a1a; border-radius:4px; padding:8px; margin-top:8px;">
              ${eligible
            .map((o) => {
              const customer = getCustomer(o.customerId);

              return `
                    <label style="display:flex; gap:8px; align-items:flex-start; padding:8px 4px; border-bottom:1px dashed #ddd; font-size:12px; cursor:pointer;">
                      <input type="checkbox" ${checked ? "checked" : ""} style="width:auto; margin-top:2px;"
                        onchange="toggleAddOrderSelection('${o.orderNumber}')">
                      <span style="flex:1;">
                        <strong>${o.orderNumber}</strong>
                        <div style="color:#555;">${customer?.name || "—"} · ${itemCount} item${itemCount === 1 ? "" : "s"}</div>

                  `;
            })
            .join("")}
            </div>
          `
        }
        </div>
        <div class="modal-footer">
          <button onclick="closeAddOrdersPicker()">Cancel</button>
          <button class="btn-primary" onclick="confirmAddOrders()" ${selectedCount === 0 ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : ""}>Add ${selectedCount > 0 ? selectedCount + " " : ""}Order${selectedCount === 1 ? "" : "s"}</button>

    function openAddOrdersPicker() {
      state.addOrdersPickerOpen = true;
      state.addOrdersSelected = {};
      render();
    }

    function closeAddOrdersPicker() {
      state.addOrdersPickerOpen = false;
      state.addOrdersSelected = {};
      render();
    }

    function toggleAddOrderSelection(orderNumber) {
      state.addOrdersSelected[orderNumber] =
        !state.addOrdersSelected[orderNumber];
      render();
    }

    function confirmAddOrders() {
      const trip = state.trip;
      if (!trip) return;

      const toAdd = Object.keys(state.addOrdersSelected).filter(
        (k) => state.addOrdersSelected[k],
      );
      if (toAdd.length === 0) return;

      // Deep-copy each selected pool order into the trip
      toAdd.forEach((orderNumber) => {
        const order = state.dispatchPool.find(
          (o) => o.orderNumber === orderNumber,
        );
        if (!order) return;

        // Deep copy, then clear selection flag on the copy
        const copy = JSON.parse(JSON.stringify(order));
        copy._selected = false;
        trip.orders.push(copy);

        // Clear the flag on the pool order too
        order._selected = false;
      });

      // Auto-pick units for outstanding individual-item lines of newly
      // added orders
      trip.orders.forEach((order) => {
        calcOutstandingLines(order).forEach((line) => {
          const product = getInvProduct(line.productId);
          if (!product || product.trackingType !== "Individual") return;

          const key = order.orderNumber + "|" + line.productId;
          if (!trip.orderUnitSelections[key]) {
            trip.orderUnitSelections[key] = autoPickUnitsForTrip(
              line.productId,
              trip.dispatchLocationId,
              line.outstanding,
              trip,
            );
          }
        });
      });

      // Reset picker state
      state.addOrdersPickerOpen = false;
      state.addOrdersSelected = {};

      render();
    }

    /* ---------- Trip Step 2: Assign Inventory ---------- */
    function renderTripStep2() {
      const trip = state.trip;
      const loc = getLocation(trip.dispatchLocationId);

      // Count of orders that pass / fail
      let passingCount = 0;
      let failingCount = 0;
      trip.orders.forEach((order) => {

    // Remove an order from the trip (used when validation fails)
    function removeOrderFromTrip(orderNumber) {
      const trip = state.trip;
      if (!trip) return;

      if (!confirm(`Remove ${orderNumber} from this trip?`)) return;

      // Remove the order
      trip.orders = trip.orders.filter((o) => o.orderNumber !== orderNumber);

      // Clean up its unit selections
      Object.keys(trip.orderUnitSelections).forEach((key) => {
        if (key.startsWith(orderNumber + "|")) {
          delete trip.orderUnitSelections[key];
        }
      });

      // Re-run validation
      runTripValidation();

      // If no orders remain, go back to dashboard
      if (trip.orders.length === 0) {
        state.trip = null;
        render();
        return;
      }

      render();
    }

    // Location change handler for trip
    function onTripLocationChange(locationId) {
      const trip = state.trip;
      const hasCustomPicks = Object.values(trip.orderUnitSelections).some(
        (arr) => arr && arr.length > 0,
      );
      if (hasCustomPicks) {
        if (
          !confirm(
            "Changing the location will reset all unit selections. Continue?",
          )
        ) {
          render();
          return;
        }
      }
      trip.dispatchLocationId = locationId;
      autoPickAllUnits();
      render();
    }

    // Run stock validation for all orders in the trip.
    // Populates trip.validation with { [orderNumber]: { ok, reasons } }.
    function runTripValidation() {
      const trip = state.trip;
      if (!trip) return;

      trip.validation = {};

      trip.orders.forEach((order) => {
        const reasons = [];

        // Check if the order's Scheduled Date differs from the trip's
        // (For the demo, we don't enforce dates. Just stock.)

        calcOutstandingLines(order).forEach((line) => {
          const product = getInvProduct(line.productId);
          if (!product) return;
          const qty = line.outstanding;

          if (product.trackingType === "Individual") {
            // Check that N units are selected for this order/product
            const key = order.orderNumber + "|" + line.productId;
            const selected = trip.orderUnitSelections[key] || [];
            if (selected.length !== qty) {
              reasons.push(
                `${product.name}: ${selected.length} of ${qty} units selected`,
              );
            }
          } else {
            // Stock quantity: check available at the trip's dispatch location
            const s = getStockSummary(
              line.productId,
              trip.dispatchLocationId,
            );
            if (s.available < qty) {
              reasons.push(
                `${product.name}: only ${s.available} available at ${getLocation(trip.dispatchLocationId)?.name}, need ${qty}`,
              );
            }
          }
        });

        trip.validation[order.orderNumber] = {
          ok: reasons.length === 0,
          reasons,
        };
      });
    }

    // The Trip Page currently uses inline handlers for all interactive elements,
    // so there's nothing to wire up here yet.
    function attachTripHandlers() {

    // ----- Driver/Vehicle cross-population (Anchor and Suggest) -----
    // Used by the Trip page (batch dispatch)
    function onTripDriverChange(driverName) {
      state.trip.driver = driverName;
      const driver = DRIVERS.find((d) => d.name === driverName);
      if (driver && driver.defaultVehicleId) {
        const vehicle = VEHICLES.find((v) => v.id === driver.defaultVehicleId);
        if (vehicle) state.trip.vehicle = vehicle.plate;
      }
      render();
    }

    function onTripVehicleChange(vehiclePlate) {
      state.trip.vehicle = vehiclePlate;
      const vehicle = VEHICLES.find((v) => v.plate === vehiclePlate);
      if (vehicle && vehicle.defaultDriverId) {
        const driver = DRIVERS.find((d) => d.id === vehicle.defaultDriverId);
        if (driver) state.trip.driver = driver.name;
      }
      render();
    }

    // Confirm and dispatch the trip.
    // - Reserves stock for every order
    // - Marks every order Out for Delivery
    // - Sets driver/vehicle to On Trip
    // - Removes orders from the dispatch pool
    function confirmTrip() {
      const trip = state.trip;
      if (!trip) return;

      const failing = trip.orders.filter(
        (o) => !trip.validation[o.orderNumber]?.ok,
      );
      if (failing.length > 0) {
        alert(
          "Some orders failed validation. Remove them before confirming.",
        );
        return;
      }

      // 1. Reserve stock for every order in the trip (outstanding only)
      trip.orders.forEach((order) => {
        calcOutstandingLines(order).forEach((line) => {
          const product = getInvProduct(line.productId);
          if (!product) return;
          const qty = line.outstanding;

          if (product.trackingType === "Individual") {
            // Mark selected units as Reserved
            const key = order.orderNumber + "|" + line.productId;
            const selectedUnitIds = trip.orderUnitSelections[key] || [];
            selectedUnitIds.forEach((uid) => {
              const unit = UNITS.find((u) => u.id === uid);
              if (unit) {
                unit.status = "Reserved";
                unit.softReservedFor = null;
                unit.reservedForOrder = order.orderNumber;
              }
            });
            logMovement(
              line.productId,
              trip.dispatchLocationId,
              "reservation",
              qty,
              order.orderNumber,
            );
          } else {
            // Increment reserved on the stock row
            let row = STOCK.find(
              (s) =>
                s.productId === line.productId &&
                s.locationId === trip.dispatchLocationId,
            );
            if (row) {
              row.reserved = (row.reserved || 0) + qty;
            }
            logMovement(
              line.productId,
              trip.dispatchLocationId,
              "reservation",
              qty,
              order.orderNumber,
            );
          }
        });

        // Mark order Out for Delivery
        order.state = "out-for-delivery";
        order.deliveryMode = trip.mode;
        order.dispatchInfo = {
          driver: trip.mode === "Company Fleet" ? trip.driver : undefined,
          vehicle: trip.mode === "Company Fleet" ? trip.vehicle : undefined,
          courier: trip.mode === "Courier" ? trip.courier : undefined,
          trackingNumber:
            trip.mode === "Courier" ? trip.trackingNumber : undefined,
          dispatchDate: trip.dispatchDate,
          notes: trip.dispatchNotes,
        };

        // Record the fulfilment event (physical handover to driver/courier)
        {
          const items = [];
          calcOutstandingLines(order).forEach((line) => {
            const product = getInvProduct(line.productId);
            if (!product) return;
            const key = order.orderNumber + "|" + line.productId;
            const selectedIds = trip.orderUnitSelections[key] || [];
            const tags = selectedIds
              .map((uid) => UNITS.find((u) => u.id === uid)?.tag)
              .filter(Boolean);
            items.push({
              productId: line.productId,
              name: product.name,
              qty: line.outstanding,
              tags,
              trackingType: product.trackingType,
            });
          });

          recordFulfilmentEvent(order, {
            type: "Delivery",
            handler: trip.mode === "Company Fleet"
              ? { driver: trip.driver, vehicle: trip.vehicle }
              : { courier: trip.courier, trackingNumber: trip.trackingNumber },
            items,
          });
        }


        order.timeline = order.timeline || [];
        order.timeline.push({
          time: new Date().toISOString(),
          event: `Dispatch mode: ${trip.mode}`,
        });
        order.timeline.push({
          time: new Date().toISOString(),
          event: `Dispatched via ${trip.mode} trip`,
        });
      });

      // 2. Update driver/vehicle status to On Trip (Fleet only)
      if (trip.mode === "Company Fleet") {
        const driver = DRIVERS.find((d) => d.name === trip.driver);
        if (driver) driver.status = "On Trip";

        const vehicle = VEHICLES.find((v) => v.plate === trip.vehicle);
        if (vehicle) vehicle.status = "On Trip";
      }

      // 3. Remove dispatched orders from the dispatch pool
      const dispatchedNumbers = new Set(
        trip.orders.map((o) => o.orderNumber),
      );
      state.dispatchPool = state.dispatchPool.filter(
        (o) => !dispatchedNumbers.has(o.orderNumber),
      );

      // 3b. Move them to in-transit
      trip.orders.forEach((o) => {
        // Clear any checkbox selection carried over from the dashboard.
        o._selected = false;

        // Avoid duplicates
        if (
          !state.inTransitOrders.find((x) => x.orderNumber === o.orderNumber)
        ) {
          state.inTransitOrders.push(o);
        }
      });

      // 4. Save a record of the trip (for auditing / future Trip List)
      const tripRecord = {
        tripNumber: genNum("TRP"),
        mode: trip.mode,
        driver: trip.driver,
        vehicle: trip.vehicle,
        courier: trip.courier,
        trackingNumber: trip.trackingNumber,
        dispatchDate: trip.dispatchDate,
        dispatchLocationId: trip.dispatchLocationId,
        orders: trip.orders.map((o) => o.orderNumber),
        dispatchNotes: trip.dispatchNotes,
        dispatchedAt: new Date().toISOString(),
      };

      console.log("[Trip] Dispatched:", tripRecord);

      // 5. Clear trip state
      state.trip = null;
      state.addOrdersPickerOpen = false;
      state.addOrdersSelected = {};

      // 6. Show success (simple alert for now)
      alert(
        `✅ Trip dispatched.\n\n` +
        `Trip Number: ${tripRecord.tripNumber}\n` +
        `Mode: ${tripRecord.mode}\n` +
        `Orders: ${tripRecord.orders.length}\n\n` +
        `Orders have been marked Out for Delivery.`,
      );

      render();
    }

    // Dispatch exactly one selected order from the Dispatch Dashboard.
    // The mode is chosen inside the wizard (Step 1).
    function dispatchSelectedFromDashboard() {
      const selected = state.dispatchPool.filter((o) => o._selected);
      if (selected.length !== 1) return;

      const order = selected[0];
      state.order = order;
      state.dispatchReturnTo = "dashboard";

      // Single-order context: no trip object.
      state.trip = null;
      state.dispatchContext = "single";

      initDispatchWizard();
      state.activeModal = "dispatch";
      render();

    function confirmSingleDelivery(orderNumber) {
      const order = state.inTransitOrders.find(
        (o) => o.orderNumber === orderNumber,

      if (!order) return;

      state.pendingDeliveryOrderNumber = orderNumber;
      state.deliveryFeeAction = "pay";
      state.deliveryFeeMethod = "Cash";
      state.deliveryFeeReference = "";
      state.deliveryFeeWaiveReason = "";

      render();

    function closeConfirmDelivery() {
      state.pendingDeliveryOrderNumber = null;
      state.deliveryFeeAction = "pay";
      state.deliveryFeeMethod = "Cash";
      state.deliveryFeeReference = "";
      state.deliveryFeeWaiveReason = "";
      state.activeModal = null;
      render();
    }

    function commitConfirmDelivery() {
      const orderNumber = state.pendingDeliveryOrderNumber;
      const order = state.inTransitOrders.find(
        (o) => o.orderNumber === orderNumber,
      );
      if (!order) {
        closeConfirmDelivery();
        return;
      }

      const feeOutstanding =
        order.deliveryFee > 0 && !order.deliveryFeePaid;

      if (feeOutstanding) {
        const action = state.deliveryFeeAction;

        if (action === "pay") {
          const method = state.deliveryFeeMethod;
          const reference =
            method === "Cash"
              ? genNum("CASH")
              : (state.deliveryFeeReference || "").trim();

          if (method !== "Cash" && !reference) {
            return alert("Enter a reference.");
          }

          order.payments = order.payments || [];
          order.payments.push({
            id: "pay-" + Date.now(),
            date: todayISO(),
            amount: order.deliveryFee,
            method,
            reference,
            receiptNumber: genNum("RCT"),
            status: "recorded",
          });
          order.deliveryFeePaid = true;
          order.timeline.push({
            time: new Date().toISOString(),
            event: `Delivery fee paid: ${money(order.deliveryFee)} via ${method}`,
          });
        } else {
          // Waive.
          const reason = (state.deliveryFeeWaiveReason || "").trim();
          if (!reason) {
            return alert("Enter a reason for waiving the fee.");
          }

          order.deliveryFeePaid = true;
          order.waivedFees = (order.waivedFees || 0) + order.deliveryFee;
          order.timeline.push({
            time: new Date().toISOString(),
            event: `Delivery fee of ${money(order.deliveryFee)} waived: ${reason}`,
          });
        }
      }

      // Now finalize the delivery.
      finalizeDelivery(order);
      state.inTransitOrders = state.inTransitOrders.filter(
        (o) => o.orderNumber !== orderNumber,
      );

      // Clear working state.
      state.pendingDeliveryOrderNumber = null;
      state.deliveryFeeAction = "pay";
      state.deliveryFeeMethod = "Cash";
      state.deliveryFeeReference = "";
      state.deliveryFeeWaiveReason = "";
      state.activeModal = null;

      render();
    }

    function confirmDeliveryFromSelection() {

    // Confirm multiple selected orders' deliveries
    function confirmBulkDelivery() {

      if (selected.length === 0) return alert("Select at least one order.");

    // Performs the state change: delivered → completed, Reserved → Sold
    function finalizeDelivery(order) {
      // 1. Flip reserved units / stock quantities to Sold.
      //    Uses outstanding lines — the same set that was dispatched.
      calcOutstandingLines(order).forEach((line) => {
        const product = getInvProduct(line.productId);
        if (!product) return;
        const qty = line.outstanding;

        if (product.trackingType === "Individual") {
          // Find units reserved for this order and flip to Sold
          UNITS.forEach((u) => {
            if (
              u.reservedForOrder === order.orderNumber &&
              u.status === "Reserved" &&
              u.productId === line.productId
            ) {
              u.status = "Sold";
              u.reservedForOrder = null;
            }
          });
          logMovement(
            line.productId,
            null,
            "check_out",
            qty,
            order.orderNumber,
          );
        } else {
          // Stock quantity: decrement both onHand and reserved, FIFO
          let remaining = qty;
          const rows = getFIFOStockRows(line.productId, null).filter((r) => r.reserved > 0);
          rows.forEach((row) => {
            if (remaining <= 0) return;
            const toDeduct = Math.min(row.reserved, remaining);
            row.reserved -= toDeduct;
            row.onHand -= toDeduct;
            remaining -= toDeduct;

            // Log per-batch depletion
            const batch = row.batchId ? getBatch(row.batchId) : null;
            const batchLabel = batch ? `${batch.batchNumber} (${batch.supplier})` : "unknown batch";
            logMovement(
              line.productId,
              row.locationId,
              "check_out",
              toDeduct,
              `${order.orderNumber} · ${batchLabel}`,
            );
          });
        }

        // Increment fulfilment now that the customer has received goods.
        const fl = getFulfilmentLine(order, line.productId);
        if (fl) fl.fulfilled += qty;
      });

      // Recompute fulfilment status now that lines have moved.
      recomputeFulfilmentStatus(order);
      // 2. Update order state
      order.state = "completed";
      order.actualDeliveryDate = todayISO();
      order.timeline = order.timeline || [];
      order.timeline.push({
        time: new Date().toISOString(),
        event: "Delivery confirmed. Order completed.",
      });

      // 3. If all orders for a driver/vehicle are delivered, release them
      releaseDriverVehicleIfIdle(order);
    }

    // If no other orders are still out for delivery on the same driver/vehicle,
    // set them back to Available.
    function releaseDriverVehicleIfIdle(order) {
      if (!order.dispatchInfo) return;
      const { driver, vehicle, courier } = order.dispatchInfo;

      if (driver || vehicle) {
        const stillOnTrip = state.inTransitOrders.some(
          (o) =>
            o.orderNumber !== order.orderNumber &&
            o.dispatchInfo &&
            (o.dispatchInfo.driver === driver ||
              o.dispatchInfo.vehicle === vehicle),
        );
        if (!stillOnTrip) {
          if (driver) {
            const d = DRIVERS.find((x) => x.name === driver);
            if (d) d.status = "Available";
          }
          if (vehicle) {
            const v = VEHICLES.find((x) => x.plate === vehicle);
            if (v) v.status = "Available";
          }
        }
      }
      // Couriers have no status — nothing to release
    }

    // Auto-pick units for every individual item in every order in the trip
    function autoPickAllUnits() {
      const trip = state.trip;
      if (!trip) return;

      trip.orderUnitSelections = {};

      trip.orders.forEach((order) => {
        calcOutstandingLines(order).forEach((line) => {
          const product = getInvProduct(line.productId);
          if (!product || product.trackingType !== "Individual") return;

          const key = order.orderNumber + "|" + line.productId;
          trip.orderUnitSelections[key] = autoPickUnitsForTrip(
            line.productId,
            trip.dispatchLocationId,
            line.outstanding,
            trip,
          );
        });
      });
    }

    // Auto-pick N available units for a trip, excluding units already
    // reserved for another order in the same trip
    function autoPickUnitsForTrip(productId, locationId, qty, trip) {
      // Collect unit IDs already picked for OTHER orders in this trip
      const alreadyPicked = new Set();
      Object.keys(trip.orderUnitSelections).forEach((key) => {
        (trip.orderUnitSelections[key] || []).forEach((uid) =>
          alreadyPicked.add(uid),
        );
      });

      const candidates = UNITS.filter(
        (u) =>
          u.productId === productId &&
          u.locationId === locationId &&
          u.status === "Available" &&
          !alreadyPicked.has(u.id),
      );

      candidates.sort((a, b) => {
        if (a.receivedDate !== b.receivedDate)
          return a.receivedDate < b.receivedDate ? -1 : 1;
        return a.tag < b.tag ? -1 : 1;
      });

      return candidates.slice(0, qty).map((u) => u.id);
    }

    function discardTrip() {

      state.addOrdersSelected = {};

    // Move to the next step in the trip wizard
    function tripNext() {
      const trip = state.trip;
      if (!trip) return;

      if (trip.step === 1) {
        const mode = state.dispatchWizard.deliveryMode;
        if (!mode) return alert("Select a delivery mode.");

        if (mode === "Company Fleet") {
          if (!trip.driver) return alert("Select a driver.");
          if (!trip.vehicle) return alert("Select a vehicle.");
        } else if (mode === "Courier") {
          if (trip.orders.length >= 2) {
            return alert(
              "Courier cannot be used for a trip with more than one order. Switch to Company Fleet, or dispatch the orders individually.",
            );
          }
          if (!trip.courier) return alert("Select a courier.");
          if (!trip.trackingNumber || !trip.trackingNumber.trim())
            return alert("Enter tracking number.");
        }

        if (!trip.dispatchDate) return alert("Select dispatch date.");

        // Persist mode onto the trip so Step 2 can read it for the Add-button rule.
        trip.mode = mode;

        trip.step = 2;
        render();
      } else if (trip.step === 2) {
        // Validation is already up to date (run on every render).
        // Block progression if any order fails.
        const failing = trip.orders.filter(
          (o) => !trip.validation[o.orderNumber]?.ok,
        );

        if (failing.length > 0) {
          alert(
            `Cannot proceed to Review.\n\n` +
            `${failing.length} order${failing.length === 1 ? "" : "s"} cannot be dispatched. ` +
            `Remove or fix the highlighted orders first.`,
          );
          return;
        }

        trip.step = 3;
        render();
      }
    }

    function tripBack() {
      const trip = state.trip;
      if (!trip) return;
      if (trip.changingUnitsFor) {
        trip.changingUnitsFor = null;
        render();
        return;
      }
      if (trip.step > 1) trip.step--;
      render();
    }

    // Open the Change Units modal for a specific (order, product) pair
    function openTripChangeUnits(orderNumber, productId) {
      state.trip.changingUnitsFor = { orderNumber, productId };
      state.trip.unitSearch = "";
      render();
    }

    function closeTripChangeUnits() {
      state.trip.changingUnitsFor = null;
      render();
    }

    function toggleTripUnitSelection(orderNumber, productId, unitId, maxQty) {
      const trip = state.trip;
      const key = orderNumber + "|" + productId;
      let selected = trip.orderUnitSelections[key] || [];

      if (selected.includes(unitId)) {
        selected = selected.filter((id) => id !== unitId);
      } else {
        if (selected.length >= maxQty) {
          alert(`You can select up to ${maxQty} units. Deselect one first.`);
          return;
        }
        selected.push(unitId);
      }

      trip.orderUnitSelections[key] = selected;
      render();
    }

    function confirmTripChangeUnits() {
      const trip = state.trip;
      if (!trip.changingUnitsFor) return;
      const { orderNumber, productId } = trip.changingUnitsFor;
      const order = trip.orders.find((o) => o.orderNumber === orderNumber);
      const line = order
        ? calcOutstandingLines(order).find((l) => l.productId === productId)
        : null;
      if (!line) return;
      const qty = line.outstanding;

      const key = orderNumber + "|" + productId;
      const selected = trip.orderUnitSelections[key] || [];
      if (selected.length !== qty) {
        return alert(`Select exactly ${qty} units.`);
      }

      trip.changingUnitsFor = null;
      render();
    }

    /* ============ RESET & BOOTSTRAP ============ */
    function resetDemo() {
      state.customerPortal = {
        step: "email",
        email: "",
        otp: null,
        verified: false,
        customerId: null,
        error: null,
      };
      initScenario(document.getElementById("scenarioSelect").value);
      render();
    }

    window.addEventListener("DOMContentLoaded", () => {
      document
        .getElementById("scenarioSelect")
        ?.addEventListener("change", (e) => {
          state.customerPortal = {
            step: "email",
            email: "",
            otp: null,
            verified: false,
            customerId: null,
            error: null,
          };
          initScenario(e.target.value);
          render();
        });

      document.querySelectorAll("[data-tab]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.activeTab = btn.dataset.tab;
          document
            .querySelectorAll("[data-tab]")
            .forEach((b) =>
              b.classList.toggle("active", b.dataset.tab === state.activeTab),
            );

          // Reset view state when entering a tab
          if (state.activeTab === "inventory") {
            state.inventoryView = "list";
            state.inventoryProductId = null;
          }
          if (state.activeTab === "dispatch") {
            // Don't reset if a trip is in progress
            if (!state.trip) {
              state.dispatchView = "dashboard";
            }
          }
          if (state.activeTab === "customer-portal") {
            // Reset the portal to the email step each time the tab is opened.
            state.customerPortal = {
              step: "email",
              email: "",
              otp: null,
              verified: false,
              customerId: null,
              error: null,
            };
          }

          render();
        });
      });

      initScenario("walkin");
      render();
    });
  </script>
</body>

</html>

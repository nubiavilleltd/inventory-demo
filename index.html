<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Order Lifecycle Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Comic Sans MS", "Segoe Print", cursive;
      background: #fdfdfd;
      color: #1a1a1a;
      padding: 16px;
      padding-bottom: 60px;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .topbar,
    #mainContent {
      width: 100%;
      max-width: 1000px;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 12px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #1a1a1a;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    .card {
      border: 2px solid #1a1a1a;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
      background: #fff;
    }

    .card-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .col {
      flex: 1;
      min-width: 200px;
    }

    label {
      display: block;
      font-size: 12px;
      margin-bottom: 2px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 6px 8px;
      border: 2px solid #1a1a1a;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      background: #fff;
    }

    textarea {
      min-height: 50px;
    }

    button {
      padding: 6px 14px;
      border: 2px solid #1a1a1a;
      border-radius: 4px;
      background: #fff;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      margin-right: 4px;
    }

    button:hover {
      background: #f0f0f0;
    }

    .btn-primary {
      background: #dbeafe;
    }

    .btn-primary:hover {
      background: #bfdbfe;
    }

    .btn-danger {
      background: #fee2e2;
    }

    .btn-danger:hover {
      background: #fecaca;
    }

    .btn-secondary {
      background: #fff;
    }

    .toggle-group {
      display: inline-flex;
      gap: 4px;
    }

    .toggle-btn.active {
      background: #dbeafe;
      font-weight: bold;
    }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border: 2px solid #1a1a1a;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
    }

    .badge-draft {
      background: #f3f4f6;
    }

    .badge-unpaid {
      background: #fef3c7;
    }

    .badge-partial {
      background: #fed7aa;
    }

    .badge-paid {
      background: #dcfce7;
    }

    .badge-cancelled {
      background: #fee2e2;
    }

    .badge-ready {
      background: #dbeafe;
    }

    .badge-removed {
      background: #f3f4f6;
      color: #6b7280;
    }

    .badge-condition-new {
      background: #dcfce7;
      color: #166534;
    }

    .badge-condition-used {
      background: #fed7aa;
      color: #9a3412;
    }

    .badge-condition-refurbished {
      background: #dbeafe;
      color: #1e40af;
    }

    .badge-condition-damaged {
      background: #fee2e2;
      color: #991b1b;
    }

    .badge-condition-returned {
      background: #fef3c7;
      color: #92400e;
    }

    .summary-box {
      border: 2px dashed #1a1a1a;
      border-radius: 4px;
      padding: 10px;
      margin-top: 10px;
      background: #fdfdfd;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 13px;
    }

    .summary-row.total {
      border-top: 2px solid #1a1a1a;
      padding-top: 6px;
      font-weight: bold;
    }

    .green {
      color: #166534;
    }

    .red {
      color: #991b1b;
    }

    .scenario-banner {
      border: 2px solid #1a1a1a;
      border-radius: 4px;
      background: #fef3c7;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .scenario-banner strong {
      display: block;
      margin-bottom: 4px;
    }

    .status-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1a1a1a;
      color: #fff;
      padding: 8px 16px;
      display: flex;
      gap: 24px;
      font-size: 12px;
      font-family: "Comic Sans MS", "Segoe Print", cursive;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal {
      background: #fff;
      border: 3px solid #1a1a1a;
      border-radius: 8px;
      max-width: 520px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      padding: 12px;
      border-bottom: 2px solid #1a1a1a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 16px;
    }

    .modal-body {
      padding: 12px;
    }

    .modal-footer {
      padding: 12px;
      border-top: 2px solid #1a1a1a;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .close-x {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      padding: 0 8px;
      font-family: inherit;
    }

    .invoice-summary {
      display: flex;
      gap: 16px;
      border: 2px dashed #1a1a1a;
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 12px;
    }

    .invoice-summary-item {
      flex: 1;
    }

    .invoice-summary-item .label {
      font-size: 11px;
      color: #555;
    }

    .invoice-summary-item .value {
      font-size: 15px;
      font-weight: bold;
    }

    .credit-card {
      border: 2px solid #166534;
      background: #dcfce7;
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 12px;
    }

    .credit-card-label {
      font-size: 11px;
    }

    .credit-card-value {
      font-size: 20px;
      font-weight: bold;
      color: #166534;
    }

    .empty-state {
      text-align: center;
      padding: 20px;
      color: #888;
    }

    .success-screen {
      text-align: center;
      padding: 24px;
    }

    .success-icon {
      font-size: 40px;
    }

    .success-title {
      font-size: 18px;
      font-weight: bold;
      color: #166534;
      margin: 8px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      text-align: left;
      padding: 6px;
      border-bottom: 1px solid #ccc;
    }

    th {
      font-size: 11px;
      color: #555;
    }

    .timeline-item {
      padding: 4px 0;
      border-bottom: 1px dashed #ddd;
      font-size: 12px;
    }

    .hidden {
      display: none;
    }

    .mt-8 {
      margin-top: 8px;
    }

    .mt-12 {
      margin-top: 12px;
    }

    .file-upload {
      border: 2px dashed #1a1a1a;
      border-radius: 4px;
      padding: 12px;
      text-align: center;
      background: #fdfdfd;
      cursor: pointer;
    }

    /* Combobox */
    .combobox {
      position: relative;
    }

    .combobox-input {
      display: flex;
      align-items: center;
      border: 2px solid #1a1a1a;
      border-radius: 4px;
      background: #fff;
      padding: 0;
      height: 34px;
      cursor: text;
    }

    .combobox-input input {
      flex: 1;
      border: none;
      outline: none;
      padding: 6px 8px;
      font-family: inherit;
      font-size: 13px;
      background: transparent;
      height: 100%;
    }

    .combobox-caret {
      padding: 0 10px;
      font-size: 10px;
      color: #666;
      user-select: none;
      cursor: pointer;
    }

    .combobox-panel {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #fff;
      border: 2px solid #1a1a1a;
      border-radius: 4px;
      margin-top: 2px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 50;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .combobox-item {
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
    }

    .combobox-item:hover,
    .combobox-item.active {
      background: #dbeafe;
    }

    .combobox-item.create-new {
      border-top: 1px dashed #ccc;
      color: #166534;
      font-style: italic;
    }

    .combobox-empty {
      padding: 8px 10px;
      font-size: 12px;
      color: #888;
      font-style: italic;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <h1>Order Lifecycle Demo</h1>
    <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap">
      <div class="toggle-group" id="tabNav">
        <button class="toggle-btn active" data-tab="orders">
          Orders
        </button>
        <button class="toggle-btn" data-tab="inventory">
          Inventory
        </button>
        <button class="toggle-btn" data-tab="dispatch">
          Dispatch
        </button>
        <button class="toggle-btn" data-tab="customer-portal">
          Customer Portal
        </button>
      </div>
        <select id="scenarioSelect" class="hidden">
        <option value="walkin">1. Walk-in Retail</option>
        <option value="scheduled">2. Scheduled Pickup</option>
        <option value="cancelcredit">3. Cancellation → Credit</option>
        <option value="deliveryfleet">4. Delivery (Company Fleet)</option>
        <option value="deliverycourier">5. Delivery (Courier)</option>
        <option value="partialpay">6. Partial Payment</option>
        <option value="withcredit">7. Customer With Credit</option>
        <option value="insufficient">
          8. Insufficient Stock (Hard Block)
        </option>
        <option value="multiunit">9. Multi-Unit Individual Items</option>
      </select>
      <button class="hidden" onclick="resetDemo()">Reset</button>
    </div>
  </div>

  <div id="mainContent"></div>
  <div id="modalContainer"></div>

  <div class="status-bar">
    <span>Order: <strong id="statusOrderState">—</strong></span>
    <span>Payment: <strong id="statusPayment">—</strong></span>
    <span>Credit: <strong id="statusCredit">₦0</strong></span>
  </div>

    const CREDIT_VALIDITY_DAYS = 60;

      { productId: "p4", locationId: "loc3", batchId: "b5", onHand: 15, reserved: 0 },
    ];

    // Stock movement log
    const MOVEMENTS = [];

    // Transfer records — each transfer is a physical shipment between locations.
    // Status lifecycle:
    //   "In Transit"  → goods left source, not yet received at destination
    //   "Received"    → confirmed at destination
    //   "Cancelled"   → goods returned to source (future)
    const TRANSFERS = [];

    // Helper: get a product from the inventory catalogue
    // (we keep the old getProduct for order-related code, but this is for inventory)
    const getInvProduct = (id) => PRODUCTS_INV.find((p) => p.id === id);
    const getLocation = (id) => LOCATIONS.find((l) => l.id === id);
    const getBatch = (id) => BATCHES.find((b) => b.id === id);

    // Get all batches for a product at a specific location, with their stock.
    // Returns [{ batchId, batchNumber, supplier, onHand, reserved, available }]
    function getBatchesAtLocation(productId, locationId) {
      const product = getInvProduct(productId);
      if (!product || product.trackingType !== "StockQuantity") return [];

      const rows = STOCK.filter(
        (s) => s.productId === productId && s.locationId === locationId && s.onHand > 0
      );

      return rows.map((r) => {
        const batch = r.batchId ? getBatch(r.batchId) : null;
        return {
          batchId: r.batchId,
          batchNumber: batch?.batchNumber || "—",
          supplier: batch?.supplier || "—",
          receivedDate: batch?.receivedDate || null,
          onHand: r.onHand,
          reserved: r.reserved || 0,
          available: Math.max(0, r.onHand - (r.reserved || 0)),
        };
      });
    }


    // Returns stock rows for a product at a location, sorted by FIFO 
    // (oldest batch received date first). Only rows with onHand > 0.
    function getFIFOStockRows(productId, locationId) {
      return STOCK.filter(
        (s) =>
          s.productId === productId &&
          (!locationId || s.locationId === locationId) &&
          s.onHand > 0
      ).sort((a, b) => {
        const batchA = getBatch(a.batchId);
        const batchB = getBatch(b.batchId);
        const dateA = batchA ? batchA.receivedDate : "9999-12-31";
        const dateB = batchB ? batchB.receivedDate : "9999-12-31";
        if (dateA !== dateB) return dateA < dateB ? -1 : 1;
        // Tiebreaker: batch id
        return (a.batchId || "") < (b.batchId || "") ? -1 : 1;
      });
    }

    // Get the total quantity of a product that is in transit for a location.
    //   - If locationId is the FROM location, the qty is "outgoing" (left but not arrived).
    //   - If locationId is the TO location, the qty is "incoming" (on its way here).
    //   - If locationId is null, returns the global in-transit total.
    // Status "In Transit" only. Received/Cancelled transfers are excluded.
    function getInTransitStock(productId, locationId) {
      return TRANSFERS
        .filter((t) =>
          t.productId === productId &&
          t.status === "In Transit" &&
          (!locationId ||
            t.fromLocationId === locationId ||
            t.toLocationId === locationId)
        )
        .reduce((sum, t) => sum + (t.qty || 0), 0);
    }

    // Get the in-transit qty for a specific batch.
    function getInTransitQuantityForBatch(productId, locationId, batchId) {
      return TRANSFERS
        .filter((t) =>
          t.productId === productId &&
          t.batchId === batchId &&
          t.status === "In Transit" &&
          (!locationId ||
            t.fromLocationId === locationId ||
            t.toLocationId === locationId)
        )
        .reduce((sum, t) => sum + (t.qty || 0), 0);
    }

    // Compute stock for any product (Individual or StockQuantity)
    function getStockSummary(productId, locationId) {
      const product = getInvProduct(productId);
      if (!product) return { total: 0, available: 0, reserved: 0, sold: 0 };

      if (product.trackingType === "Individual") {
        const allUnits = UNITS.filter(
          (u) =>
            u.productId === productId &&
            (!locationId || u.locationId === locationId),
        );
        const liveUnits = allUnits.filter((u) => u.status !== "Removed");
        const softReservedUnits = liveUnits.filter(
          (u) => u.status === "Available" && u.softReservedFor,
        );
        return {
          total: liveUnits.length,
          available: liveUnits.filter(
            (u) => u.status === "Available" && !u.softReservedFor,
          ).length,
          reserved:
            liveUnits.filter((u) => u.status === "Reserved").length +
            softReservedUnits.length,
          sold: liveUnits.filter((u) => u.status === "Sold").length,
          removed: allUnits.filter((u) => u.status === "Removed").length,
        };
      } else {
        const rows = STOCK.filter(
          (s) =>
            s.productId === productId &&
            (!locationId || s.locationId === locationId),
        );
        const onHand = rows.reduce((a, r) => a + r.onHand, 0);
        const reserved = rows.reduce((a, r) => a + r.reserved, 0);
        return {
          total: onHand,
          available: onHand - reserved,
          reserved,
          sold: 0, // sold for stock quantity is derived elsewhere
        };
      }
    }

    // Stock status label
    function getStockStatus(productId, locationId) {
      const product = getInvProduct(productId);
      if (!product) return "Not Stocked";
      const s = getStockSummary(productId, locationId);
      if (s.total === 0) return "Not Stocked";
      if (s.available === 0) return "Out of Stock";
      if (s.available <= (product.minimumStock || 0)) return "Low Stock";
      return "OK";
    }

    // Check if any location has enough stock for a given quantity
    // Returns: { ok: boolean, bestLocation: id, bestAvailable: number, totalAvailable: number }
    function checkStockAvailability(productId, qty) {
      const product = getInvProduct(productId);
      if (!product)
        return {
          ok: false,
          bestLocation: null,
          bestAvailable: 0,
          totalAvailable: 0,
        };

      let bestLocation = null;
      let bestAvailable = 0;
      let totalAvailable = 0;

      LOCATIONS.forEach((loc) => {
        const s = getStockSummary(productId, loc.id);
        totalAvailable += s.available;
        if (s.available > bestAvailable) {
          bestAvailable = s.available;
          bestLocation = loc.id;
        }
      });

      return {
        ok: bestAvailable >= qty,
        bestLocation,
        bestAvailable,
        totalAvailable,
      };
    }

    function getStockStatusBadge(status) {
      const map = {
        OK: "badge-paid",
        "Low Stock": "badge-partial",
        "Out of Stock": "badge-cancelled",
        "Not Stocked": "badge-draft",
      };
      return map[status] || "badge-draft";
    }

    // Log a movement
    function logMovement(productId, locationId, type, quantity, reference, unitId = null, batchId = null, operator = "You") {
      MOVEMENTS.push({

        type,

        reference: reference || null,
        unitId: unitId,
        batchId: batchId,

    }

    const SCENARIOS = {

    /* ============ STATE ============ */
    let state = {

    /* ============ HELPERS ============ */

    const money = (n) => "₦" + (n || 0).toLocaleString("en-NG");
    const getProduct = (id) => PRODUCTS_INV.find((p) => p.id === id);
    const getCustomer = (id) => CUSTOMERS.find((c) => c.id === id);
    const todayISO = () => new Date().toISOString().split("T")[0];
    // Derive timing from the scheduled date.
    // If the scheduled date is today or in the past, it's Immediate.
    // Otherwise, it's Scheduled.
    function getTiming(order) {
      if (!order || !order.scheduledDate) return "Immediate";
      return order.scheduledDate <= todayISO() ? "Immediate" : "Scheduled";
    }

    function getEstimatedDeliveryDate(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return d.toISOString().split("T")[0];
    }
    const formatDate = (iso) =>
      iso
        ? new Date(iso).toLocaleDateString("en-GB", {
          day: "2-digit",
          month: "short",
          year: "numeric",
        })
        : "—";

    function genNum(prefix) {
      const d = new Date();
      const ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
      return `${prefix}-${ymd}-${String(Math.floor(Math.random() * 999) + 1).padStart(3, "0")}`;
    }

    function genTransferNum() {
      return genNum("TRF");
    }



    /* ============ SHIPPING FEE ============ */

    // Stub for the shipping fee. The real algorithm will depend on the
    // delivery address, the size of the order, and the urgency of
    // delivery. For the demo, it's a simple base + per-item formula with
    // an urgency multiplier. Express costs double.
    //
    //   - The `order` argument lets the real algorithm inspect the items.
    //   - The `addressId` argument lets the real algorithm inspect the
    //     delivery address (distance, zone, access, etc.). The stub
    //     ignores it.
    //   - The `urgency` argument is 'Standard' | 'Express'.
    function calculateShippingFee(order, addressId, urgency) {
      if (!order) return 0;

      const base = 1000;
      const perItem = 50;
      const urgencyMultiplier = urgency === "Express" ? 2 : 1;
      const itemCount = (order.items || []).reduce(
        (s, i) => s + i.qty,
        0,
      );

      return (base + perItem * itemCount) * urgencyMultiplier;
    }



    function calcTotals(order) {
      if (!order?.items)
        return {
          subtotal: 0,
          total: 0,
          paid: 0,
          outstanding: 0,
          discount: 0,
          deliveryFee: 0,
        };
      const subtotal = order.items.reduce(
        (s, i) => s + (getProduct(i.productId)?.price || 0) * i.qty,
        0,
      );

      // Calculate discount
      let discount = 0;
      if (order.discountType === "Fixed") {
        discount = Math.min(order.discountValue || 0, subtotal);
      } else if (order.discountType === "Percentage") {
        discount = Math.round(subtotal * ((order.discountValue || 0) / 100));
      }

      // Delivery fee is added after discount. Discounts apply to product
      // lines only, not to shipping.
      const deliveryFee = order.deliveryFee || 0;

      const total = Math.max(0, subtotal - discount + deliveryFee);
      const paid = (order.payments || []).reduce((s, p) => s + p.amount, 0);
      const waivedFees = order.waivedFees || 0;
      const outstanding = Math.max(
        0,
        total - paid - (order.creditApplied || 0) - waivedFees,
      );
      return {
        subtotal,
        total,
        paid,
        outstanding,
        discount,
        deliveryFee,
        waivedFees,
      };
    }





    function paymentStatus(order) {
      const { total, paid } = calcTotals(order);
      if (paid >= total && total > 0) return "paid";
      if (paid > 0) return "partial";
      return "unpaid";
    }
    function stateLabel(order) {
      if (!order) return "Draft";
      const map = {
        draft: "Draft",
        submitted: "Submitted (Unpaid)",
        partial: "Partially Paid",
        confirmed: "Confirmed (Paid)",
        ready: "Ready for Pickup",
        collected: "Collected",
        completed: "Completed",
        cancelled: "Cancelled",
        "out-for-delivery": "Out for Delivery",
        delivered: "Delivered",
      };
      const base = map[order.state] || "Draft";
      // Surface partial fulfilment alongside the order state.
      if (order.fulfilmentStatus === "partial" && order.state === "ready") {
        return "Partially Fulfilled";
      }
      return base;
    }

    function stateBadge(order) {
      if (!order) return "badge-draft";
      const map = {
        draft: "badge-draft",
        submitted: "badge-unpaid",
        partial: "badge-partial",
        confirmed: "badge-paid",
        ready: "badge-ready",
        "out-for-delivery": "badge-ready",
        collected: "badge-paid",
        delivered: "badge-paid",
        completed: "badge-paid",
        cancelled: "badge-cancelled",
      };
      // Partial fulfilment overrides the "ready" badge.
      if (order.fulfilmentStatus === "partial" && order.state === "ready") {
        return "badge-partial";
      }
      return map[order.state] || "badge-draft";
    }

    function logTimeline(event) {
      if (state.order)
        state.order.timeline.push({ time: new Date().toISOString(), event });
    }

    // Append a credit event to a customer's ledger.
    // amount is signed: positive for issuance, negative for consumption.
    function pushCreditEvent(customerId, description, amount) {
      const customer = getCustomer(customerId);
      if (!customer) return;

      customer.creditEvents = customer.creditEvents || [];
      customer.creditEvents.push({
        date: todayISO(),
        description,
        amount,
      });
    }

    // Auto-apply customer credit to an order.
    //   - Applies min(credit, outstanding).
    //   - No deferral, no removal — credit is always consumed.
    //   - Remainder stays on the customer account.
    //   - Logs to the timeline once per application.
    //

    // Never re-applies if the order already has creditApplied set (idempotent
    // until the customer changes; see customerSelect handler).
    function autoApplyCredit(order, customer) {
      if (!order || !customer) return;
      if (order.creditApplied && order.creditApplied > 0) return; // already applied

      const available = customer.credit || 0;
      if (available <= 0) return;

      const t = calcTotals(order);
      const toApply = Math.min(available, t.outstanding);
      if (toApply <= 0) return;

      // Move the credit
      customer.credit = available - toApply;
      order.creditApplied = (order.creditApplied || 0) + toApply;

      // Ensure the customer has an expiry date (set once on first credit issuance)
      if (!customer.creditExpiryDate && customer.credit > 0) {
        const d = new Date();
        d.setDate(d.getDate() + CREDIT_VALIDITY_DAYS);
        customer.creditExpiryDate = d.toISOString().split("T")[0];
      }

      // Mirror the reduced credit back to the master customer list
      const master = getCustomer(customer.id);
      if (master) {
        master.credit = customer.credit;
        master.creditExpiryDate = customer.creditExpiryDate;
      }

      // Ledger entry (customer-facing)
      pushCreditEvent(
        customer.id,
        `Applied to order ${order.orderNumber}`,
        -toApply,
      );

      const remaining = customer.credit;
      logTimeline(
        remaining > 0
          ? `Credit applied: ${money(toApply)}. Remaining credit: ${money(remaining)}.`
          : `Credit applied: ${money(toApply)}. Credit fully used.`,
      );
    }

    function isOverdue(order) {
      if (!order.pickupExpiryDate) return false;
      return new Date(order.pickupExpiryDate) < new Date();
    }

    /* ============ DISPATCH POOL MEMBERSHIP ============ */

    // True if the order should appear on the Dispatch Dashboard.
    //   - Fresh confirmed Delivery orders (nothing fulfilled yet)
    //   - Partially-fulfilled Delivery orders whose handling = Delivery
    function belongsInDispatchPool(order) {
      if (!order) return false;

      // Fresh Delivery orders enter the pool once confirmed.
      // Their fulfillment is Delivery by construction.
      if (
        order.fulfillment === "Delivery" &&
        order.state === "confirmed" &&
        order.fulfilmentStatus === "pending"
      ) {
        return true;
      }

      // Partially-fulfilled orders enter the pool when the operator has
      // routed the outstanding remainder to Delivery — regardless of what
      // the original order's fulfillment was (it may have been Pickup).
      if (
        order.fulfilmentStatus === "partial" &&
        order.fulfilmentHandling === "Delivery" &&
        (order.state === "confirmed" || order.state === "ready")
      ) {
        return true;
      }

      return false;
    }

    // Add the order to the dispatch pool if eligible and not already there.
    // Holds a live reference — no deep copy. Trips snapshot on creation.
    function ensureOrderInDispatchPool(order) {
      if (!belongsInDispatchPool(order)) return;
      if (
        state.dispatchPool.find((o) => o.orderNumber === order.orderNumber)
      ) {
        return;
      }
      state.dispatchPool.push(order);
    }

    function removeOrderFromDispatchPool(orderNumber) {
      state.dispatchPool = state.dispatchPool.filter(
        (o) => o.orderNumber !== orderNumber,
      );
    }



    // Records a physical fulfilment event (pickup or delivery).
    // Called exactly once per real handover (not per partial line).
    function recordFulfilmentEvent(order, event) {
      if (!order.fulfilmentHistory) order.fulfilmentHistory = [];

      const totalOrdered = (order.fulfilmentLines || []).reduce(
        (s, l) => s + l.ordered, 0
      );
      const totalFulfilled = (order.fulfilmentLines || []).reduce(
        (s, l) => s + l.fulfilled, 0
      );

      // Deep-copy the items snapshot so later mutations don't corrupt history
      const items = (event.items || []).map((item) => ({
        productId: item.productId,
        name: item.name,
        qty: item.qty,
        tags: item.tags ? [...item.tags] : [],
        trackingType: item.trackingType,
      }));

      order.fulfilmentHistory.push({
        timestamp: new Date().toISOString(),
        type: event.type,               // 'Pickup' | 'Delivery'
        location: event.location || null, // e.g., "VI Store" or "Main Warehouse"
        handler: event.handler || {},
        items,
        remainingAfter: Math.max(
          0,
          totalOrdered - totalFulfilled - (event.type === "Delivery" ? event.items.reduce((s, i) => s + i.qty, 0) : 0)
        ),
      });

    /* ============ FULFILMENT TRACKING ============ */

    // Initialise fulfilment lines from an order's items.
    // Called once, at order creation. After this, fulfilmentLines is the
    // source of truth for "what's owed".
    function initFulfilmentLines(order) {
      order.fulfilmentLines = (order.items || []).map((item) => ({
        productId: item.productId,
        ordered: item.qty,
        fulfilled: 0,
      }));
      order.fulfilmentStatus = "pending";
      order.fulfilmentHandling = null; // null | 'Pickup' | 'Delivery'
      order.fulfilmentHistory = []; // Rich ledger of all physical handovers

      // Delivery-specific fields. Zero/null for Pickup orders.
      order.deliveryUrgency = null; // null | 'Standard' | 'Express'
      order.deliveryFee = 0;
      order.deliveryFeePaid = false;
      order.waivedFees = 0;
      order.fulfilmentAddressId = null;
      order.fulfilmentUrgency = null;
    }

    // Look up the fulfilment line for a product on an order.
    function getFulfilmentLine(order, productId) {
      return (order.fulfilmentLines || []).find(
        (l) => l.productId === productId,
      );
    }

    // Outstanding quantity for a line.
    function getOutstandingQty(order, productId) {
      const line = getFulfilmentLine(order, productId);
      if (!line) return 0;
      return Math.max(0, line.ordered - line.fulfilled);
    }

    // Total value of goods delivered so far (used by cancellation).
    function calcDeliveredValue(order) {
      return (order.fulfilmentLines || []).reduce((sum, line) => {
        const price = getProduct(line.productId)?.price || 0;
        return sum + price * line.fulfilled;
      }, 0);
    }

    // Outstanding lines (products with unfulfilled quantity).
    // Returns [{ productId, ordered, fulfilled, outstanding }].
    function calcOutstandingLines(order) {
      return (order.fulfilmentLines || [])
        .map((line) => ({
          productId: line.productId,
          ordered: line.ordered,
          fulfilled: line.fulfilled,
          outstanding: Math.max(0, line.ordered - line.fulfilled),
        }))
        .filter((l) => l.outstanding > 0);
    }

    // Recompute fulfilmentStatus from fulfilmentLines.
    //   'pending'  → nothing fulfilled yet
    //   'partial'  → some fulfilled, some outstanding
    //   'complete' → everything fulfilled
    function recomputeFulfilmentStatus(order) {
      if (!order.fulfilmentLines || order.fulfilmentLines.length === 0) {
        order.fulfilmentStatus = "pending";
        return;
      }
      const totalOrdered = order.fulfilmentLines.reduce(
        (s, l) => s + l.ordered,
        0,
      );
      const totalFulfilled = order.fulfilmentLines.reduce(
        (s, l) => s + l.fulfilled,
        0,
      );
      if (totalFulfilled === 0) order.fulfilmentStatus = "pending";
      else if (totalFulfilled >= totalOrdered)
        order.fulfilmentStatus = "complete";
      else order.fulfilmentStatus = "partial";
    }

    /* ============ INIT ============ */
    function initScenario(key) {
      const s = SCENARIOS[key];
      if (!s) return;

      // Deep-copy the customer so scenario changes don't mutate the master list
      const customer = JSON.parse(JSON.stringify(getCustomer(s.customerId)));
      state.customer = customer;

      // Compute the scheduled date from the offset (defaults to today)
      const scheduledDate = (() => {
        if (!s.scheduledOffsetDays) return todayISO();
        const d = new Date();
        d.setDate(d.getDate() + s.scheduledOffsetDays);
        return d.toISOString().split("T")[0];
      })();



      const order = {
        orderNumber: genNum("ORD"),
        invoiceNumber: null,
        customerId: customer.id,
        fulfillment: s.fulfillment,
        pickupLocation: s.pickupLocation || "VI Store",
        scheduledDate,
        deliveryMode: s.deliveryMode || "Company Fleet",
        items: s.items.map((i) => ({ ...i })),
        discount: 0,
        discountType: "None",
        discountValue: 0,
        creditApplied: 0,
        invoiceDate: todayISO(),
        dueDate: todayISO(),
        payments: [],
        state: s.startingState,
        timeline: [
          { time: new Date().toISOString(), event: "Order created" },
        ],
        pickupExpiryDate: null,
        pickedUpBy: null,
        dispatchInfo: null,
        actualDeliveryDate: null,
      };

      // Initialise fulfilment tracking. All lines start unfulfilled.
      // Orders with no shortfall will be marked complete at first handover
      // (or at submit, once Phase 2 lands).
      initFulfilmentLines(order);


      // Delivery orders start with Standard urgency and a computed fee.
      if (order.fulfillment === "Delivery") {
        order.deliveryUrgency = "Standard";
        order.deliveryFee = calculateShippingFee(
          order,
          null,
          order.deliveryUrgency,
        );
      }

      // Auto-apply any existing customer credit to this order.
      // No-op if the customer has no credit.
      autoApplyCredit(order, customer);

      // Scenario-specific historical events (real things that happened before
      // the operator arrived). Demo markers are not logged — the scenario
      // banner at the top of Order Creation already describes the setup.
      if (key === "cancelcredit") {
        const { total } = calcTotals(order);
        order.invoiceNumber = genNum("INV");
        order.state = "confirmed";
        order.payments.push({
          id: "pay-1",
          date: todayISO(),
          amount: total,
          method: "Bank Transfer",
          reference: "TRF-99887766",
          receiptNumber: genNum("RCT"),
          status: "recorded",
        });
        order.timeline.push({
          time: new Date().toISOString(),
          event: "Order submitted and paid",
        });
      }

      state.order = order;
      state.currentScenario = key;
      state.currentPage = "order-creation";
      state.activeModal = null;
      state.successContext = null;
    }

    function attachOrderCreationHandlers() {

          const c = getCustomer(e.target.value);

          // Restore any credit that was applied on behalf of the previous customer
          const prev = state.customer;
          if (prev && prev.id !== c.id && state.order.creditApplied > 0) {
            const prevMaster = getCustomer(prev.id);
            if (prevMaster)
              prevMaster.credit =
                (prevMaster.credit || 0) + state.order.creditApplied;
            state.order.creditApplied = 0;
          }

          // Fresh customer object (deep copy from master)
          state.customer = JSON.parse(JSON.stringify(c));
          state.order.customerId = state.customer.id;

          // Auto-apply credit for the new customer
          autoApplyCredit(state.order, state.customer);

          render();

              o,

    /* ============ SUBMIT ORDER ============ */
    function submitOrder(recordPayment) {
      const o = state.order;
      if (!o.items.length) {
        alert("Add at least one product.");
        return;
      }

      const stockResult = validateOrderStock();

      // Auto-flag partial orders based on stock availability.
      // For Pickup: if there's a shortfall, it's a partial order.
      // For Delivery: the dispatch team handles shortfalls, but we can still
      // flag it as partial for tracking purposes.
      if (stockResult.warning) {
        o.fulfilmentStatus = "partial";
        o._partialAcknowledged = true;
        logTimeline(
          `Partial fulfilment acknowledged at submission — ${calcOutstandingLines(o).length} line(s) outstanding.`,
        );
      }

      // Record the acknowledgement on the order.

      // Continue with submission
      o.invoiceDate = todayISO();

      // Due date = invoice date + standard payment terms.
      const dueDate = new Date();
      dueDate.setDate(dueDate.getDate() + DEFAULT_PAYMENT_TERMS_DAYS);
      o.dueDate = dueDate.toISOString().split("T")[0];

      o.invoiceNumber = genNum("INV");
      logTimeline(
        `Invoice ${o.invoiceNumber} generated (Due: ${formatDate(o.dueDate)})`,
      );

      const t = calcTotals(o);

      // If credit fully covers the order, treat as paid
      if (t.outstanding === 0 && o.creditApplied > 0) {
        if (o.fulfillment === "Delivery") {
          applySoftReservation(o);
        }
        o.state = "confirmed";
        logTimeline("Order submitted (paid via credit)");

        // Fresh confirmed Delivery orders enter the dispatch pool.
        ensureOrderInDispatchPool(o);

        const isWalkin =
          getTiming(o) === "Immediate" && o.fulfillment === "Pickup";

        // Walk-in Immediate: no reservation step happens. Deduct stock now.
        if (isWalkin) {
          deductStockDirectlyForPickup(o);
        }

        state.successContext = {
          title: isWalkin ? "Order Completed" : "Payment Recorded",
          subtitle: `${o.orderNumber} · Covered by credit`,
          documentLabel: "Receipt",
          isWalkin,
        };
        state.currentPage = "success";
        render();
        return;
      }

      if (!recordPayment) {
        o.state = "submitted";
        logTimeline("Order submitted (unpaid)");
        state.successContext = {
          title: "Order Submitted",
          subtitle: `${o.orderNumber} · Invoice generated`,
          documentLabel: "Invoice",
          isWalkin: false,
        };
        state.currentPage = "success";
        render();
      } else {
        state.activeModal = "payment";
        render();
      }
    }

    // ===== STOCK VALIDATION =====
    // Returns: { blocked: bool, warning: bool, message: string }
    function validateOrderStock() {
      const o = state.order;

      // For Pickup (Immediate or Scheduled) → Soft Warning if any item has
      // insufficient stock at the pickup location. Partial fulfilment can
      // route the remainder to another location, so we no longer hard-block.
      if (o.fulfillment === "Pickup") {
        const locationId =
          LOCATIONS.find((l) => l.name === o.pickupLocation)?.id || "loc2";
        const shortfalls = [];

        o.items.forEach((i) => {
          const product = getInvProduct(i.productId);
          const s = getStockSummary(i.productId, locationId);
          if (s.available < i.qty) {
            shortfalls.push(
              `${product.name}: needs ${i.qty}, only ${s.available} at ${o.pickupLocation}`,
            );
          }
        });

        if (shortfalls.length > 0) {
          return {
            blocked: false,
            warning: true,
            message: `Warning — some items have insufficient stock at the pickup location:\n\n${shortfalls.join("\n")}\n\nYou can restock before the pickup date.`,
          };
        }
      }

      // For Delivery → Soft Warning if no single location has enough stock
      if (o.fulfillment === "Delivery") {
        const shortfalls = [];

        o.items.forEach((i) => {
          const product = getInvProduct(i.productId);
          const check = checkStockAvailability(i.productId, i.qty);
          if (!check.ok) {
            if (check.totalAvailable > 0) {
              shortfalls.push(
                `${product.name}: needs ${i.qty}, only ${check.bestAvailable} at any single location. Total across locations: ${check.totalAvailable}`,
              );
            } else {
              shortfalls.push(
                `${product.name}: needs ${i.qty}, out of stock at all locations`,
              );
            }
          }
        });

        if (shortfalls.length > 0) {
          return {
            blocked: false,
            warning: true,
            message: `Warning — some items may not be fulfillable from a single location:\n\n${shortfalls.join("\n")}\n\nYou can restock before dispatch.`,
          };
        }
      }

      return { blocked: false, warning: false, message: "" };
    }

    function openFulfilmentRoutingModal() {
      const o = state.order;
      const cust = state.customer;

      // Seed the draft from any existing choice, or the defaults.
      state.routingDraft = o.fulfilmentHandling || "";

      // Pickup location: existing fulfilmentLocationId, or the order's
      // original pickupLocation mapped to its ID.
      if (o.fulfilmentLocationId) {
        state.routingLocationId = o.fulfilmentLocationId;
      } else {
        const originalLoc = LOCATIONS.find(
          (l) => l.name === o.pickupLocation,
        );
        state.routingLocationId = originalLoc ? originalLoc.id : LOCATIONS[0].id;
      }

      // Address: existing fulfilmentAddressId, or the customer's default.
      if (o.fulfilmentAddressId) {
        state.routingAddressId = o.fulfilmentAddressId;
      } else {
        const addrs = cust.addresses || [];
        const preferred =
          addrs.find((a) => a.isDefault) || addrs[0] || null;
        state.routingAddressId = preferred ? preferred.id : null;
      }

      state.routingUrgency = o.fulfilmentUrgency || "Standard";
      state.routingRecordNow = false;

      // Reset pickup working state
      state.collectionSelections = {};
      state.collectionQuantities = {};
      state.collectionUnitSearch = "";
      state.collectionChangingUnitsFor = null;
      state.deferAllItems = false;

      state.activeModal = "fulfilment-routing";
      render();
    }



    function closeFulfilmentRoutingModal() {
      state.routingDraft = "";
      state.routingLocationId = null;
      state.routingAddressId = null;
      state.routingUrgency = "Standard";
      state.routingRecordNow = false;
      state.activeModal = null;
      render();
    }



    // // Writes the chosen handling onto the order and logs the change.

    function confirmFulfilmentRouting() {
      const o = state.order;
      if (!state.routingDraft) return;

      const previous = o.fulfilmentHandling;
      const next = state.routingDraft;

      if (next === "Delivery") {
        // --- Existing Delivery Logic ---
        o.fulfilmentAddressId = state.routingAddressId;
        o.fulfilmentUrgency = state.routingUrgency;
        const newFee = calculateShippingFee(o, state.routingAddressId, state.routingUrgency);

        if (newFee !== o.deliveryFee) {
          if (o.deliveryFeePaid && o.deliveryFee > 0) {
            const d = new Date();
            d.setDate(d.getDate() + CREDIT_VALIDITY_DAYS);
            state.customer.credit += o.deliveryFee;
            state.customer.creditExpiryDate = d.toISOString().split("T")[0];
            const master = getCustomer(state.customer.id);
            if (master) {
              master.credit = state.customer.credit;
              master.creditExpiryDate = state.customer.creditExpiryDate;
            }
            pushCreditEvent(state.customer.id, `Delivery fee adjusted — order ${o.orderNumber}`, o.deliveryFee);
            logTimeline(`Delivery fee adjusted. Old fee ${money(o.deliveryFee)} credited back. New fee ${money(newFee)}.`);
          }
          o.deliveryFee = newFee;
          o.deliveryFeePaid = false;
        }

        o.fulfilmentHandling = "Delivery";
        o.fulfilmentLocationId = null;

        if (!previous) logTimeline(`Remaining items set to Delivery`);
        else if (previous !== next) logTimeline(`Remaining items changed from ${previous} to Delivery`);

        ensureOrderInDispatchPool(o);

        const recordNow = state.routingRecordNow;
        state.routingDraft = "";
        state.activeModal = null;

        if (recordNow && o.deliveryFee > 0 && !o.deliveryFeePaid) {
          state.activeModal = "payment";
        }
        render();
        return;
      }

      // --- NEW: Pickup Logic ---
      if (next === "Pickup") {
        // 1. Clear any delivery fees (if switching from Delivery to Pickup)
        if (o.deliveryFee > 0) {
          if (o.deliveryFeePaid) {
            state.customer.credit += o.deliveryFee;
            const d = new Date();
            d.setDate(d.getDate() + CREDIT_VALIDITY_DAYS);
            state.customer.creditExpiryDate = d.toISOString().split("T")[0];
            const master = getCustomer(state.customer.id);
            if (master) {
              master.credit = state.customer.credit;
              master.creditExpiryDate = state.customer.creditExpiryDate;
            }
            pushCreditEvent(state.customer.id, `Delivery fee reversed — order ${o.orderNumber} reverted to Pickup`, o.deliveryFee);
            logTimeline(`Remaining items changed to Pickup. Delivery fee of ${money(o.deliveryFee)} credited back.`);
          } else {
            logTimeline(`Remaining items changed to Pickup. Delivery fee of ${money(o.deliveryFee)} removed (was unpaid).`);
          }
          o.deliveryFee = 0;
          o.deliveryFeePaid = false;
        }

        // 2. Set handling and location
        o.fulfilmentHandling = "Pickup";
        o.fulfilmentLocationId = state.routingLocationId;

        if (!previous) logTimeline(`Remaining items set to Pickup`);
        else if (previous !== next) logTimeline(`Remaining items changed from ${previous} to Pickup`);

        // 3. Apply the pickup selections that were captured in the modal
        applyRoutingPickupSelections();

        // 4. Clear working state
        state.routingDraft = "";
        state.routingLocationId = null;
        state.routingAddressId = null;
        state.routingUrgency = "Standard";
        state.routingRecordNow = false;
        state.collectionSelections = {};
        state.collectionQuantities = {};
        state.collectionUnitSearch = "";
        state.collectionChangingUnitsFor = null;
        state.deferAllItems = false;
        state.activeModal = null;

        render();
        return;
      }
    }

    function commitBulkConfirmDelivery() {
      const numbers = state.pendingBulkDeliveryNumbers || [];
      const orders = numbers
        .map((n) => state.inTransitOrders.find((o) => o.orderNumber === n))
        .filter(Boolean);

      if (orders.length === 0) {
        closeBulkConfirmDelivery();
        return;
      }

      const feeOrders = orders.filter(
        (o) => o.deliveryFee > 0 && !o.deliveryFeePaid,
      );

      if (feeOrders.length > 0) {
        const action = state.bulkFeeAction;

        if (action === "pay") {
          const method = state.bulkFeeMethod;
          const sharedRef = (state.bulkFeeReference || "").trim();
          if (method !== "Cash" && !sharedRef) {
            return alert("Enter a reference.");
          }

          feeOrders.forEach((o) => {
            const reference =
              method === "Cash" ? genNum("CASH") : sharedRef;
            o.payments = o.payments || [];
            o.payments.push({
              id: "pay-" + Date.now() + "-" + o.orderNumber,
              date: todayISO(),
              amount: o.deliveryFee,
              method,
              reference,
              receiptNumber: genNum("RCT"),
              status: "recorded",
            });
            o.deliveryFeePaid = true;
            o.timeline.push({
              time: new Date().toISOString(),
              event: `Delivery fee paid: ${money(o.deliveryFee)} via ${method}`,
            });
          });
        } else {
          const reason = (state.bulkFeeWaiveReason || "").trim();
          if (!reason) {
            return alert("Enter a reason for waiving these fees.");
          }
          feeOrders.forEach((o) => {
            o.deliveryFeePaid = true;
            o.waivedFees = (o.waivedFees || 0) + o.deliveryFee;
            o.timeline.push({
              time: new Date().toISOString(),
              event: `Delivery fee of ${money(o.deliveryFee)} waived: ${reason}`,
            });
          });
        }
      }

      orders.forEach((order) => finalizeDelivery(order));

      const deliveredNumbers = new Set(orders.map((o) => o.orderNumber));
      state.inTransitOrders = state.inTransitOrders.filter(
        (o) => !deliveredNumbers.has(o.orderNumber),
      );

      closeBulkConfirmDelivery();
    }

    /* ============ RECORD PAYMENT ============ */
    function recordPayment() {
      const o = state.order,
        cust = state.customer;
      const amount = +document.getElementById("payAmount").value;
      const method = document.getElementById("payMethod").value;
      const date = document.getElementById("payDate").value;
      const ref = document.getElementById("payRef")?.value || genNum("CASH");

      if (!amount || amount <= 0) return alert("Enter valid amount.");
      if (!method) return alert("Select payment method.");

      const t = calcTotals(o);

      // No overpayment allowed. Block and return with a clear error.
      if (amount > t.outstanding) {
        return alert(
          `Amount cannot exceed the outstanding balance of ${money(t.outstanding)}.`,
        );
      }

      o.payments.push({
        id: "pay-" + Date.now(),
        date,
        amount,
        method,
        reference: ref,
        receiptNumber: genNum("RCT"),
        status: "recorded",
      });
      logTimeline(`Payment: ${money(amount)} via ${method}`);

      if (!o.invoiceNumber) o.invoiceNumber = genNum("INV");

      // Soft-reserve stock if this payment pushes the order to paid
      // (Pickup orders reserve stock later, at "Mark as Ready for Pickup".)
      const newT = calcTotals(o);
      const wasNotPaid = o.state !== "confirmed";

      if (
        newT.outstanding <= 0 &&
        wasNotPaid &&
        o.fulfillment === "Delivery"
      ) {
        applySoftReservation(o);
      }

      // Only update the state from payment status if the order is still
      // in its initial payment gate (draft / submitted / partial-payment).
      // For orders past that point — confirmed, ready, out-for-delivery —
      // further payments (e.g. a delivery fee on a partial order) must
      // not rewind the state.
      if (["draft", "submitted", "partial"].includes(o.state)) {
        o.state = newT.outstanding <= 0 ? "confirmed" : "partial";
      }
      logTimeline(`State: ${stateLabel(o)}`);
      logTimeline(`State: ${stateLabel(o)}`);

      // If the order is now fully paid and there was a delivery fee,
      // mark the fee as paid. This flag is used at handling-revert time.
      if (newT.outstanding <= 0 && o.deliveryFee > 0) {
        o.deliveryFeePaid = true;
      }

      // Fresh confirmed Delivery orders enter the dispatch pool.
      if (o.state === "confirmed") {
        ensureOrderInDispatchPool(o);
      }

      state.activeModal = null;

      // Determine which milestone we just hit.
      // The pickup modal is correct whenever the customer is handing over
      // products now. That includes:
      //   - A fresh pickup order (fulfilmentStatus !== "partial")
      //   - A partial order before any routing decision (handling null)
      //   - A partial order routed to Pickup (handling === "Pickup")
      // It is NOT correct when the remainder has been explicitly routed
      // to Delivery. In that case, dispatch handles it.
      const isWalkin =
        o.state === "confirmed" &&
        getTiming(o) === "Immediate" &&
        o.fulfillment === "Pickup" &&
        o.fulfilmentHandling !== "Delivery";

      if (isWalkin) {
        // Walk-in Immediate Pickup: the customer is at the counter.
        // Instead of auto-completing, open the collection modal so the
        // operator confirms which units are being handed over.
        state.collectionSelections = {};
        state.collectionUnitSearch = "";
        state.collectionChangingUnitsFor = null;
        state.deferAllItems = false; // <-- Add it right here

        // Flag that a payment was just recorded in this session
        state.paymentRecordedThisSession = true;
        state.activeModal = "picked-up-by";
        render();
        return;
      } else {
        state.successContext = {
          title: "Payment Recorded",
          subtitle: `${o.orderNumber} · ${money(amount)} received`,
          documentLabel: "Receipt",
          isWalkin: false,
        };
        state.currentPage = "success";
        render();
      }
    }



    /* ============ CANCEL MODAL ============ */
    function renderCancelModal() {
      const o = state.order;
      const cust = state.customer;
      const t = calcTotals(o);

      // Cash paid + credit consumed — the gross return before deductions.
      const cashPaid = t.paid;
      const creditConsumed = o.creditApplied || 0;
      const grossReturn = cashPaid + creditConsumed;

      // For partially-fulfilled orders, deduct the value of goods already
      // delivered. The customer keeps those goods, so they aren't refunded.
      const deliveredValue = calcDeliveredValue(o);
      const netReturn = Math.max(0, grossReturn - deliveredValue);
      const hasDeduction = deliveredValue > 0 && grossReturn > 0;

      // State-specific warning
      // State-specific warning
      let stateWarning = "";

      // Partial fulfilment takes precedence — it's more specific.
      if (o.fulfilmentStatus === "partial" && calcDeliveredValue(o) > 0) {
        const outstanding = calcOutstandingLines(o);
        const totalOutstanding = outstanding.reduce(
          (s, l) => s + l.outstanding,
          0,
        );
        stateWarning = `
          <div style="padding:8px; border:2px dashed #92400e; border-radius:4px; font-size:12px; color:#92400e; margin-top:12px;">
            ⚠ This order has been partially fulfilled — <strong>${totalOutstanding} item(s)</strong> are still outstanding.
            Goods already delivered (${money(calcDeliveredValue(o))}) will not be refunded.
          </div>`;
      } else if (o.state === "ready") {
        stateWarning = `
          <div style="padding:8px; border:2px dashed #991b1b; border-radius:4px; font-size:12px; color:#991b1b; margin-top:12px;">
            ⚠ This order has stock reserved for pickup at <strong>${o.pickupLocation}</strong>.
            Cancelling will release that stock back to inventory.
          </div>`;
      } else if (o.state === "out-for-delivery") {
        const dispatchInfo = o.dispatchInfo || {};
        const tripLabel =
          o.deliveryMode === "Company Fleet"
            ? `${dispatchInfo.driver || "—"} / ${dispatchInfo.vehicle || "—"}`
            : `${dispatchInfo.courier || "—"} (${dispatchInfo.trackingNumber || "—"})`;
        stateWarning = `
          <div style="padding:8px; border:2px dashed #991b1b; border-radius:4px; font-size:12px; color:#991b1b; margin-top:12px;">
            ⚠ This order is out for delivery (${tripLabel}).
            Cancelling will release the reserved stock and free the driver/vehicle.

      } else if (o.state === "partial") {
        stateWarning = `
          <div style="padding:8px; border:2px dashed #92400e; border-radius:4px; font-size:12px; color:#92400e; margin-top:12px;">
            This order has a partial payment. The amount paid will be returned as store credit.
          </div>`;
      }

      // Credit return summary
      let creditReturn = "";
      if (netReturn > 0) {
        const parts = [];
        if (cashPaid > 0) parts.push(`${money(cashPaid)} cash`);
        if (creditConsumed > 0) parts.push(`${money(creditConsumed)} credit`);

        const deductionLine = hasDeduction
          ? `<div style="font-size:11px; color:#92400e; margin-top:4px;">
                 Less: delivered goods (not refunded) — ${money(deliveredValue)}
               </div>`
          : "";

        creditReturn = `
          <div class="credit-card mt-12">
            <div class="credit-card-label">Credit to be created (${parts.join(" + ")})</div>
            <div class="credit-card-value">${money(netReturn)}</div>
            ${deductionLine}
            <div style="font-size:11px; color:#166534; margin-top:4px;">
              Fresh ${CREDIT_VALIDITY_DAYS}-day expiry applied.
            </div>
          </div>`;
      } else if (hasDeduction) {
        // Delivered goods consume the entire return — nothing left to refund.
        creditReturn = `
          <div class="credit-card mt-12" style="border-color:#92400e; background:#fef3c7;">
            <div class="credit-card-label" style="color:#92400e;">Credit to be created</div>
            <div class="credit-card-value" style="color:#92400e;">${money(0)}</div>
            <div style="font-size:11px; color:#92400e; margin-top:4px;">
              The entire payment has been consumed by delivered goods. Nothing is refunded.
            </div>
          </div>`;
      }

      return `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-header">Cancel Order <button class="close-x" onclick="closeModal()">×</button></div>

          <p>Cancel <strong>${o.orderNumber}</strong>?</p>
          ${stateWarning}
          ${creditReturn}

          <select id="cancelReason">
            <option value="">Select reason</option>
            <option>Customer Changed Mind</option>
            <option>Duplicate Order</option>
            <option>Payment Failed</option>
            <option>Out of Stock</option>
            <option>Other</option>
          </select>
        </div>
        <div class="modal-footer">
          <button onclick="closeModal()">Keep Order</button>
          <button class="btn-danger" id="confirmCancelBtn">Confirm Cancellation</button>
        </div>
      </div>
    </div>
  `;

    function attachCancelHandlers() {
      document
        .getElementById("confirmCancelBtn")
        ?.addEventListener("click", () => {
          const reason = document.getElementById("cancelReason").value;
          if (!reason) return alert("Select a reason.");

          const o = state.order,
            cust = state.customer;
          const t = calcTotals(o);

          // -------- 1. Money: gross return minus delivered value --------
          const cashPaid = t.paid;
          const creditConsumed = o.creditApplied || 0;
          const grossReturn = cashPaid + creditConsumed;
          const deliveredValue = calcDeliveredValue(o);
          const netReturn = Math.max(0, grossReturn - deliveredValue);

          if (netReturn > 0) {
            cust.credit += netReturn;

            // Always reset expiry on new credit issuance (fresh 60-day window).
            const d = new Date();
            d.setDate(d.getDate() + CREDIT_VALIDITY_DAYS);
            cust.creditExpiryDate = d.toISOString().split("T")[0];

            // Mirror to master
            const master = getCustomer(cust.id);
            if (master) {
              master.credit = cust.credit;
              master.creditExpiryDate = cust.creditExpiryDate;
            }

            // Ledger entry (customer-facing)
            pushCreditEvent(
              cust.id,
              `Cancelled order ${o.orderNumber}${deliveredValue > 0 ? ` (net of ${money(deliveredValue)} delivered goods)` : ""}`,
              netReturn,
            );

            const parts = [];
            if (cashPaid > 0) parts.push(`${money(cashPaid)} cash`);
            if (creditConsumed > 0)
              parts.push(`${money(creditConsumed)} credit`);
            const deductionNote =
              deliveredValue > 0
                ? ` − ${money(deliveredValue)} delivered goods`
                : "";
            logTimeline(
              `Cancelled (${reason}). Credit ${money(netReturn)} issued (${parts.join(" + ")}${deductionNote}). Expires ${formatDate(cust.creditExpiryDate)}.`,
            );
          } else if (deliveredValue > 0) {
            // Delivered goods consumed the entire return.
            logTimeline(
              `Cancelled (${reason}). No credit issued — delivered goods value (${money(deliveredValue)}) consumed the payment.`,
            );
          } else {
            logTimeline(`Cancelled (${reason}). No payment to return.`);
          }

          // -------- 2. Stock: release reservations per state --------
          if (o.softReservation) {
            releaseSoftReservation(o);
          }
          if (o.state === "ready") {
            releasePickupReservation(o);
          }
          if (o.state === "out-for-delivery") {
            releaseDeliveryReservation(o);
          }

          // -------- 3. Move to Cancelled --------
          o.state = "cancelled";

          // Cancelled orders leave the dispatch pool.
          removeOrderFromDispatchPool(o.orderNumber);
          state.activeModal = null;
          render();
        });
    }

    function updateAddProductStockInfo() {
      const pid = document.getElementById("newProductId").value;
      const qty =
        parseInt(document.getElementById("newProductQty").value, 10) || 0;
      const info = document.getElementById("addProductStockInfo");
      if (!info) return;

      if (!pid) {
        info.innerHTML = "";
        return;
      }

      const o = state.order;
      const product = getInvProduct(pid);

      let status = "";
      let cls = "";

      if (o.fulfillment === "Pickup") {
        // Pickup: check stock at the specific pickup location
        const loc = LOCATIONS.find((l) => l.name === o.pickupLocation);
        const locId = loc?.id;
        const s = getStockSummary(pid, locId);
        const locName = loc?.name || "?";

        if (qty === 0) {
          status = `${s.available} available at ${locName}`;
          cls = "";
        } else if (s.available >= qty) {
          status = `✓ ${s.available} available at ${locName}`;
          cls = "green";
        } else if (s.available > 0) {
          status = `⚠ Only ${s.available} at ${locName}. You requested ${qty}.`;
          cls = "red";
        } else {
          status = `✗ Out of stock at ${locName}.`;
          cls = "red";
        }
      } else {
        // Delivery: check for best single location
        const check = checkStockAvailability(pid, qty);
        const total = check.totalAvailable;
        const best = check.bestAvailable;

        if (qty === 0) {
          status = `Total available across all locations: ${total}`;
          cls = "";
        } else if (check.ok) {
          status = `✓ ${best} available at ${getLocation(check.bestLocation)?.name}`;
          cls = "green";
        } else if (total > 0) {
          status = `⚠ Only ${best} at one location, ${total} across all locations. No single location has ${qty}.`;
          cls = "red";
        } else {
          status = `✗ Out of stock at all locations.`;
          cls = "red";
        }
      }

      info.innerHTML = `
              <div style="font-size:12px; padding:8px; border:1px dashed #999; border-radius:4px; ${cls === "red" ? "color:#991b1b;" : cls === "green" ? "color:#166534;" : ""}">
                ${status}
              </div>
            `;
    }

      const availableHere =

    function toggleCollectionUnit(productId, unitId, maxQty) {
      let selected = state.collectionSelections[productId] || [];
      if (selected.includes(unitId)) {
        selected = selected.filter((id) => id !== unitId);
      } else {
        if (selected.length >= maxQty) {
          alert(`You can select up to ${maxQty} units. Deselect one first.`);
          return;
        }
        selected.push(unitId);
      }
      state.collectionSelections[productId] = selected;
      render();
    }


    function confirmCollectionChangeUnits() {
      const productId = state.collectionChangingUnitsFor;
      const o = state.order;
      const line = calcOutstandingLines(o).find(
        (l) => l.productId === productId,
      );
      if (!line) return;

      const isRoutingPickup =
        state.activeModal === "fulfilment-routing" && state.routingDraft === "Pickup";
      const pickupLoc = isRoutingPickup
        ? state.routingLocationId
        : o.fulfilmentLocationId ||
        LOCATIONS.find((l) => l.name === o.pickupLocation)?.id;
      const product = getInvProduct(productId);
      const availableHere =
        product.trackingType === "Individual"
          ? UNITS.filter(
            (u) =>
              u.productId === productId &&
              u.locationId === pickupLoc &&
              (u.status === "Available" ||
                (u.status === "Reserved" &&
                  u.reservedForOrder === o.orderNumber)),
          ).length
          : (() => {
            const s = getStockSummary(productId, pickupLoc);
            return s.available + (s.reserved || 0);
          })();

      const cap = Math.min(line.outstanding, availableHere);
      const selected = state.collectionSelections[productId] || [];

      if (selected.length > cap) {

      // Under Task 2, any count from 0 to cap is valid — no forced minimum.
      state.collectionChangingUnitsFor = null;

    /* ============ PICKED UP BY MODAL ============ */


    function renderPickedUpByModal() {
      const o = state.order,
        cust = state.customer;
      const isImmediate = getTiming(o) === "Immediate";

      const pickupLoc =
        o.fulfilmentLocationId ||
        LOCATIONS.find((l) => l.name === o.pickupLocation)?.id;

      // What can be handed over right now, per line.
      //   handoverCap = min(outstanding, available at this location)
      // Lines with zero availability are dropped entirely.
      const handoverLines = calcOutstandingLines(o)
        .map((line) => {
          const product = getInvProduct(line.productId);
          if (!product) return null;

          let availableHere = 0;
          if (product.trackingType === "Individual") {
            availableHere = UNITS.filter(
              (u) =>
                u.productId === line.productId &&
                u.locationId === pickupLoc &&
                (u.status === "Available" ||
                  (u.status === "Reserved" &&
                    u.reservedForOrder === o.orderNumber)),
            ).length;
          } else {
            const s = getStockSummary(line.productId, pickupLoc);
            availableHere = s.available + (s.reserved || 0);
          }

          return {
            ...line,
            availableHere,
            handoverCap: Math.min(line.outstanding, availableHere),
          };
        })
        .filter((line) => line && line.handoverCap > 0);

      // ----- Auto-select everything available on first open -----
      // Individual lines: fill the selection array with the reserved or
      // available units at the pickup location.
      // StockQuantity lines: seed the quantity to the cap.
      if (
        Object.keys(state.collectionSelections).length === 0 &&
        Object.keys(state.collectionQuantities).length === 0
      ) {
        handoverLines.forEach((line) => {
          const product = getInvProduct(line.productId);
          if (!product) return;
          if (product.trackingType === "Individual") {
            const cap = line.handoverCap;

            let candidates = UNITS.filter(
              (u) =>
                u.productId === line.productId &&
                u.locationId === pickupLoc &&
                u.status === "Reserved" &&
                u.reservedForOrder === o.orderNumber,
            );
            if (candidates.length === 0) {
              candidates = UNITS.filter(
                (u) =>
                  u.productId === line.productId &&
                  u.locationId === pickupLoc &&
                  u.status === "Available",
              );
            }
            candidates.sort((a, b) => {
              if (a.receivedDate !== b.receivedDate)
                return a.receivedDate < b.receivedDate ? -1 : 1;
              return a.tag < b.tag ? -1 : 1;
            });
            state.collectionSelections[line.productId] = candidates
              .slice(0, cap)
              .map((u) => u.id);
          } else {
            state.collectionQuantities[line.productId] = line.handoverCap;
          }
        });
      }

      // Drill-in view for Change Units
      if (state.collectionChangingUnitsFor) {
        return renderCollectionChangeUnitsView();
      }

      // ----- Compute total selection and satisfaction -----
      let totalSelected = 0;
      handoverLines.forEach((line) => {

      const hasZeroStock = handoverLines.length === 0;

      return `

    // Handles a change to a pickup quantity input (Individual or
    // StockQuantity). Enforces the cap and updates the working state.
    function onPickupQtyChange(productId, rawValue, cap) {
      const o = state.order;
      const product = getInvProduct(productId);
      if (!product) return;

      const n = Math.max(0, Math.min(parseInt(rawValue, 10) || 0, cap));

      if (product.trackingType === "StockQuantity") {
        state.collectionQuantities[productId] = n;
        render();
        return;
      }

      // Individual — trim or fill the current selection to n.
      const pickupLoc = LOCATIONS.find((l) => l.name === o.pickupLocation)?.id;
      let current = state.collectionSelections[productId] || [];

      if (n < current.length) {
        // Trim from the end
        state.collectionSelections[productId] = current.slice(0, n);
      } else if (n > current.length) {
        // Fill from auto-picks not already in the selection
        const already = new Set(current);
        const pool = UNITS.filter(
          (u) =>
            u.productId === productId &&
            u.locationId === pickupLoc &&
            (u.status === "Available" ||
              (u.status === "Reserved" &&
                u.reservedForOrder === o.orderNumber)) &&
            !already.has(u.id),
        ).sort((a, b) => {
          if (a.receivedDate !== b.receivedDate)
            return a.receivedDate < b.receivedDate ? -1 : 1;
          return a.tag < b.tag ? -1 : 1;
        });
        const need = n - current.length;
        state.collectionSelections[productId] = [
          ...current,
          ...pool.slice(0, need).map((u) => u.id),
        ];
      }
      render();
    }


    function onRoutingPickupQtyChange(productId, rawValue, cap) {
      // Reuse the same logic, which already calls render() at the end
      onPickupQtyChange(productId, rawValue, cap);
    }



    function applyRoutingPickupSelections() {
      const o = state.order;
      const cust = state.customer;
      const isImmediate = getTiming(o) === "Immediate";
      const isDeferred = state.deferAllItems || false;

      let name = "", phone = "", orderRefVerified = true, idPresented = false;

      // If not deferred, we need to validate name (defaulting to customer)
      if (!isDeferred) {
        // Use customer name/phone since the routing modal doesn't have input fields for them
        name = cust.name;
        phone = cust.phone;
        orderRefVerified = true; // For routing pickup, we assume verified
        idPresented = false;

        // Guard: at least one unit must be selected
        const totalSelected = calcOutstandingLines(o).reduce(
          (sum, line) => {
            const product = getInvProduct(line.productId);
            if (!product) return sum;
            if (product.trackingType === "Individual") {
              return sum + (state.collectionSelections[line.productId] || []).length;
            }
            return sum + (state.collectionQuantities[line.productId] || 0);
          },
          0,
        );
        if (totalSelected === 0 && !isDeferred) {
          alert("Select at least one unit to pick up, or tick the defer checkbox.");
          return false;
        }
      }

      // -------- 1. Apply stock changes --------
      const pickupLoc = state.routingLocationId;
      const handoverLines = calcOutstandingLines(o).map((line) => {
        const product = getInvProduct(line.productId);
        if (!product) return null;
        let availableHere = 0;
        if (product.trackingType === "Individual") {
          availableHere = UNITS.filter(
            (u) => u.productId === line.productId && u.locationId === pickupLoc &&
              (u.status === "Available" || (u.status === "Reserved" && u.reservedForOrder === o.orderNumber))
          ).length;
        } else {
          const s = getStockSummary(line.productId, pickupLoc);
          availableHere = s.available + (s.reserved || 0);
        }
        return { ...line, handoverCap: Math.min(line.outstanding, availableHere) };
      }).filter((line) => line && line.handoverCap > 0);

      if (!isDeferred) {
        handoverLines.forEach((line) => {
          const product = getInvProduct(line.productId);
          if (!product) return;
          let qty;
          if (product.trackingType === "Individual") {
            qty = (state.collectionSelections[line.productId] || []).length;
          } else {
            qty = state.collectionQuantities[line.productId] ?? line.handoverCap;
            qty = Math.max(0, Math.min(qty, line.handoverCap));
          }
          if (qty === 0) return;

          if (product.trackingType === "Individual") {
            const selectedIds = state.collectionSelections[line.productId] || [];
            // Release originally reserved units not chosen
            UNITS.filter((u) => u.reservedForOrder === o.orderNumber && u.status === "Reserved").forEach((u) => {
              if (!selectedIds.includes(u.id)) {
                u.status = "Available";
                u.reservedForOrder = null;
              }
            });
            // Mark chosen units as Sold
            selectedIds.forEach((uid) => {
              const u = UNITS.find((x) => x.id === uid);
              if (u) {
                u.status = "Sold";
                u.reservedForOrder = null;
                u.softReservedFor = null;
              }
            });
            logMovement(line.productId, pickupLoc, "check_out", selectedIds.length, o.orderNumber);
          } else {
            let remaining = qty;
            STOCK.filter((s) => s.productId === line.productId && (!pickupLoc || s.locationId === pickupLoc)).forEach((row) => {
              if (remaining <= 0) return;
              if (row.reserved > 0) {
                const fromReserved = Math.min(row.reserved, remaining);
                row.reserved -= fromReserved;
                row.onHand -= fromReserved;
                remaining -= fromReserved;
              } else if (row.onHand > 0) {
                const fromOnHand = Math.min(row.onHand, remaining);
                row.onHand -= fromOnHand;
                remaining -= fromOnHand;
              }
            });
            logMovement(line.productId, pickupLoc, "check_out", qty, o.orderNumber);
          }
          const fl = getFulfilmentLine(o, line.productId);
          if (fl) fl.fulfilled += qty;
        });
      }

      recomputeFulfilmentStatus(o);

      // -------- 1b. Record the fulfilment event (before we reset state) --------
      {
        const items = [];
        handoverLines.forEach((line) => {
          const product = getInvProduct(line.productId);
          if (!product) return;
          let qty = 0;
          let tags = [];
          if (product.trackingType === "Individual") {
            const selectedIds = state.collectionSelections[line.productId] || [];
            qty = selectedIds.length;
            tags = selectedIds
              .map((uid) => UNITS.find((u) => u.id === uid)?.tag)
              .filter(Boolean);
          } else {
            qty = state.collectionQuantities[line.productId] ?? 0;
            qty = Math.max(0, Math.min(qty, line.handoverCap));
          }
          if (qty > 0) {
            items.push({
              productId: line.productId,
              name: product.name,
              qty,
              tags,
              trackingType: product.trackingType,
            });
          }
        });

        if (items.length > 0 || isDeferred) {
          recordFulfilmentEvent(o, {
            type: "Pickup",
            location: getLocation(o.fulfilmentLocationId)?.name || o.pickupLocation,
            handler: isDeferred
              ? { name: null, phone: null, idPresented: false, orderRefVerified: false, deferred: true }
              : { name, phone, idPresented, orderRefVerified },
            items,
          });
        }


      }

      // -------- 2. Log the event --------
      if (isDeferred) {
        o.pickedUpBy = null;
        logTimeline("0 items picked up. Deferred by operator.");
      }
      // else {
      //   o.pickedUpBy = { name, phone, orderRefVerified, idPresented };
      //   logTimeline(`Picked up by ${name}`);
      // }



      // -------- 3. Transition state --------
      const isFullyFulfilled = o.fulfilmentStatus === "complete";
      if (isFullyFulfilled) {
        o.state = "completed";
        logTimeline("Order completed.");
      } else {
        o.state = "ready";
        if (isDeferred) {
          const expiry = new Date();
          expiry.setDate(expiry.getDate() + PICKUP_EXPIRY_DAYS);
          o.pickupExpiryDate = expiry.toISOString().split("T")[0];
        }
        logTimeline(`Partial pickup complete. ${calcOutstandingLines(o).length} line(s) still outstanding.`);
      }

      // -------- 4. Show Success Screen --------
      const totalOrdered = (o.fulfilmentLines || []).reduce((s, l) => s + l.ordered, 0);
      const totalFulfilled = (o.fulfilmentLines || []).reduce((s, l) => s + l.fulfilled, 0);
      const totalOutstanding = Math.max(0, totalOrdered - totalFulfilled);
      const isWalkin = getTiming(o) === "Immediate" && o.fulfillment === "Pickup";

      state.successContext = {
        title: isFullyFulfilled
          ? isWalkin ? "Order Completed" : "Order Picked Up"
          : (totalFulfilled === 0 ? "Pickup Deferred" : "Partial Pickup Recorded"),
        subtitle: isFullyFulfilled
          ? isWalkin ? `${o.orderNumber} · Pickup confirmed` : `${o.orderNumber} · Thank you`
          : (totalFulfilled === 0
            ? `${o.orderNumber} · 0 items picked up, ${totalOutstanding} outstanding.`
            : `${o.orderNumber} · ${totalFulfilled} items picked up, ${totalOutstanding} outstanding.`),
        documentLabel: state.paymentRecordedThisSession ? "Receipt" : null,
        isWalkin: false,
      };
      state.paymentRecordedThisSession = false;
      state.currentPage = "success";

      return true;
    }



    function attachPickedUpByHandlers() {
      document
        .getElementById("confirmPickupBtn")
        ?.addEventListener("click", () => {
          const o0 = state.order;
          const isImmediate = getTiming(o0) === "Immediate";

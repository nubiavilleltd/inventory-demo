              : document.getElementById("pickupIdPresented")?.checked === true;

            if (!name) return alert("Enter who is picking up.");
            if (!isImmediate && !orderRefVerified)
              return alert("Confirm that the order reference has been verified.");

            // Guard: at least one unit must be selected across all lines.
            const ord = state.order;
            const totalSelected = calcOutstandingLines(ord).reduce(
              (sum, line) => {
                const product = getInvProduct(line.productId);
                if (!product) return sum;
                if (product.trackingType === "Individual") {
                  return sum + (state.collectionSelections[line.productId] || []).length;
                }
                return sum + (state.collectionQuantities[line.productId] || 0);
              },
              0,
            );
            if (totalSelected === 0) {
              return alert("Select at least one unit to hand over.");
            }
          }


          const o = state.order;

          // -------- 1. Apply the operator's selections to stock --------
          const pickupLoc =
            o.fulfilmentLocationId ||
            LOCATIONS.find((l) => l.name === o.pickupLocation)?.id;

          // Recompute handover lines the same way the modal did.
          const handoverLines = calcOutstandingLines(o)
            .map((line) => {

              let availableHere = 0;
              if (product.trackingType === "Individual") {
                availableHere = UNITS.filter(
                  (u) =>
                    u.productId === line.productId &&
                    u.locationId === pickupLoc &&
                    (u.status === "Available" ||
                      (u.status === "Reserved" &&
                        u.reservedForOrder === o.orderNumber)),
                ).length;
              } else {

                availableHere = s.available + (s.reserved || 0);
              }

              return {
                ...line,
                availableHere,
                handoverCap: Math.min(line.outstanding, availableHere),
              };
            })
            .filter((line) => line && line.handoverCap > 0);

          if (!isDeferred) {
            handoverLines.forEach((line) => {

              }

              // Skip lines with zero handover — nothing to do, nothing to
              // record on the fulfilment line.
              if (qty === 0) return;

              if (product.trackingType === "Individual") {
                const selectedIds =
                  state.collectionSelections[line.productId] || [];
                const originallyReserved = UNITS.filter(
                  (u) =>
                    u.reservedForOrder === o.orderNumber &&
                    u.status === "Reserved",
                );

                // Units originally reserved for this order but NOT chosen now → release to Available
                originallyReserved.forEach((u) => {
                  if (!selectedIds.includes(u.id)) {
                    u.status = "Available";
                    u.reservedForOrder = null;
                  }
                });

                // Chosen units → Sold
                selectedIds.forEach((uid) => {
                  const u = UNITS.find((x) => x.id === uid);
                  if (!u) return;
                  u.status = "Sold";
                  u.reservedForOrder = null;
                  u.softReservedFor = null;
                });

                logMovement(
                  line.productId,
                  pickupLoc,
                  "check_out",
                  selectedIds.length,

              } else {
                // Stock quantity: decrement reserved (if any) and onHand
                let remaining = qty;

                STOCK.filter(
                  (s) =>
                    s.productId === line.productId &&
                    (!pickupLoc || s.locationId === pickupLoc),
                ).forEach((row) => {
                  if (remaining <= 0) return;
                  if (row.reserved > 0) {
                    const fromReserved = Math.min(row.reserved, remaining);
                    row.reserved -= fromReserved;
                    row.onHand -= fromReserved;
                    remaining -= fromReserved;
                  } else if (row.onHand > 0) {
                    const fromOnHand = Math.min(row.onHand, remaining);
                    row.onHand -= fromOnHand;
                    remaining -= fromOnHand;
                  }
                });

                logMovement(
                  line.productId,
                  pickupLoc,
                  "check_out",
                  qty,
                  o.orderNumber,
                );
              }

              // Increment fulfilment by the actual handover quantity.
              const fl = getFulfilmentLine(o, line.productId);
              if (fl) fl.fulfilled += qty;
            });

          }

          // Recompute fulfilment status now that lines have moved.
          recomputeFulfilmentStatus(o);

          // -------- 1b. Record the fulfilment event (before we reset state) --------
          {

            handoverLines.forEach((line) => {
              const product = getInvProduct(line.productId);
              if (!product) return;
              let qty = 0;
              let tags = [];
              if (product.trackingType === "Individual") {
                const selectedIds = state.collectionSelections[line.productId] || [];
                qty = selectedIds.length;
                tags = selectedIds
                  .map((uid) => UNITS.find((u) => u.id === uid)?.tag)
                  .filter(Boolean);
              } else {

                qty = Math.max(0, Math.min(qty, line.handoverCap));
              }
              if (qty > 0) {
                items.push({
                  productId: line.productId,
                  name: product.name,
                  qty,

            if (items.length > 0 || isDeferred) {

                type: "Pickup",
                location: o.fulfilmentLocationId
                  ? getLocation(o.fulfilmentLocationId)?.name
                  : o.pickupLocation,
                handler: isDeferred
                  ? { name: null, phone: null, idPresented: false, orderRefVerified: false, deferred: true }
                  : { name, phone, idPresented, orderRefVerified },
                items,
              });
            }


          }

          // -------- 2. Record the picked-up-by info --------

          if (isDeferred) {
            o.pickedUpBy = null; // Don't record anyone as taking goods
            logTimeline("0 items picked up. Deferred by operator.");
          }

          // else {
          //   o.pickedUpBy = { name, phone, orderRefVerified, idPresented };
          //   const logParts = [`Picked up by ${name}`];
          //   if (!isImmediate) {
          //     logParts.push(
          //       orderRefVerified
          //         ? "Order reference verified"
          //         : "Order reference NOT verified",
          //     );
          //     if (idPresented) logParts.push("Photo ID presented");
          //   }
          //   logTimeline(logParts.join(" · "));
          // }

          // -------- 3. Transition based on remaining fulfilment --------
          const isFullyFulfilled = o.fulfilmentStatus === "complete";

          if (isFullyFulfilled) {
            o.state = "completed";
            logTimeline("Order completed.");
          } else {
            // Some lines remain outstanding.
            // Park the order in "ready" so it stays actionable — the

            o.state = "ready";

            // If they deferred everything, give them a standard 3-day window to come back.
            if (isDeferred) {
              const expiry = new Date();
              expiry.setDate(expiry.getDate() + PICKUP_EXPIRY_DAYS);
              o.pickupExpiryDate = expiry.toISOString().split("T")[0];
            }

            logTimeline(
              `Partial handover complete. ${calcOutstandingLines(o).length} line(s) still outstanding.`,
            );
          }

          // -------- 4. Clear working state and show success screen --------
          state.collectionSelections = {};
          state.collectionQuantities = {};
          state.collectionUnitSearch = "";
          state.collectionChangingUnitsFor = null;
          state.activeModal = null;

          // Compute totals for the success message.
          const totalOrdered = (o.fulfilmentLines || []).reduce(
            (s, l) => s + l.ordered,
            0,
          );
          const totalFulfilled = (o.fulfilmentLines || []).reduce(
            (s, l) => s + l.fulfilled,
            0,
          );
          const totalOutstanding = Math.max(
            0,
            totalOrdered - totalFulfilled,
          );

          const isWalkin =
            getTiming(o) === "Immediate" && o.fulfillment === "Pickup";
          state.successContext = {
            title: isFullyFulfilled
              ? isWalkin
                ? "Order Completed"
                : "Order Picked Up"
              : (totalFulfilled === 0 ? "Pickup Deferred" : "Partial Pickup Recorded"),
            subtitle: isFullyFulfilled
              ? isWalkin
                ? `${o.orderNumber} · Pickup confirmed`
                : `${o.orderNumber} · Thank you`
              : (totalFulfilled === 0
                ? `${o.orderNumber} · 0 items picked up, ${totalOutstanding} outstanding.`
                : `${o.orderNumber} · ${totalFulfilled} items picked up, ${totalOutstanding} outstanding.`),
            // Only show the receipt if a payment was just made in this session
            documentLabel: state.paymentRecordedThisSession ? "Receipt" : null,
            isWalkin: false,
          };

          // Reset the flag so subsequent handovers don't show it
          state.paymentRecordedThisSession = false;

          state.currentPage = "success";
          render();
        });
    }





    function renderTagsDetailModal() {
      const o = state.order;
      const idx = state.tagsDetailIndex;
      const productId = state.tagsDetailProductId;
      if (!o || idx === null || !o.fulfilmentHistory) return "";

      const history = o.fulfilmentHistory;
      const sorted = history.slice().reverse();
      const entry = sorted[idx];
      if (!entry) return "";

      const item = entry.items.find((i) => i.productId === productId);
      if (!item) return "";

      const dateStr = new Date(entry.timestamp).toLocaleString("en-GB", {
        day: "2-digit", month: "short", year: "numeric",
        hour: "2-digit", minute: "2-digit",
      });

      const handlerName = entry.type === "Delivery"
        ? (entry.handler.driver || entry.handler.courier || "—")
        : (entry.handler.name || "—");

      return `
        <div class="modal-overlay" onclick="if(event.target===this)closeTagsDetail()">
          <div class="modal">
            <div class="modal-header">Tags Handed Over <button class="close-x" onclick="closeTagsDetail()">×</button></div>
            <div class="modal-body">
              <div style="padding:8px; border:1px dashed #999; border-radius:4px; font-size:12px; margin-bottom:12px;">
                <div><strong>${item.name}</strong> · Qty: <strong>${item.qty}</strong></div>
                <div style="font-size:11px; color:#555; margin-top:2px;">${dateStr} · ${entry.type} · ${handlerName}</div>
              </div>
              <div style="padding:6px 0;">
                ${item.tags.map((tag, i) => `
                  <div style="padding:4px 8px; border-bottom:1px dashed #eee; font-size:12px;">
                    <span style="color:#888; margin-right:8px;">${String(i + 1).padStart(2, "0")}.</span>
                    ${tag}
                  </div>
                `).join("")}
              </div>
            </div>
            <div class="modal-footer">
              <button onclick="closeTagsDetail()">Close</button>
            </div>
          </div>
        </div>
      `;
    }

    function openTagsDetail(orderNumber, index, productId) {
      state.tagsDetailOrderNumber = orderNumber;
      state.tagsDetailIndex = index;
      state.tagsDetailProductId = productId;
      state.activeModal = "tags-detail";
      render();
    }

    function closeTagsDetail() {
      state.tagsDetailOrderNumber = null;
      state.tagsDetailIndex = null;
      state.tagsDetailProductId = null;
      state.activeModal = null;
      render();
    }

    /* ============ EXTEND EXPIRY MODAL ============ */
    function renderExtendExpiryModal() {
      const o = state.order;
      const defaultDate = new Date();
      defaultDate.setDate(defaultDate.getDate() + 3);

      return `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-header">Extend Pickup Expiry <button class="close-x" onclick="closeModal()">×</button></div>
        <div class="modal-body">
          <p style="font-size:13px; color:#555;">
            Current Expiry: <strong>${formatDate(o.pickupExpiryDate)}</strong>
          </p>
          <label class="mt-12">New Expiry Date *</label>
          <input type="date" id="newExpiryDate" value="${defaultDate.toISOString().split("T")[0]}">

          <label class="mt-12">Reason (Optional)</label>
          <input type="text" id="extendReason" placeholder="e.g. Customer traveling">
        </div>
        <div class="modal-footer">
          <button onclick="closeModal()">Cancel</button>
          <button class="btn-primary" id="confirmExtendBtn">Save New Expiry</button>
        </div>
      </div>
    </div>
  `;

    function attachExtendExpiryHandlers() {
      document
        .getElementById("confirmExtendBtn")
        ?.addEventListener("click", () => {
          const newDate = document.getElementById("newExpiryDate").value;
          const reason = document.getElementById("extendReason").value.trim();

          if (!newDate) return alert("Select a new expiry date.");

          const o = state.order;
          const oldDate = o.pickupExpiryDate;
          o.pickupExpiryDate = newDate;
          logTimeline(
            `Expiry extended from ${formatDate(oldDate)} to ${formatDate(newDate)}${reason ? " — " + reason : ""}`,

    /* ============================================================
DISPATCH WIZARD (3-STEP)
============================================================ */

    function renderDispatchWizard() {
      const o = state.order;
      const w = state.dispatchWizard;

      // If we're in Change Units mode, render that instead
      if (w.changingUnitsFor) {
        return renderChangeUnitsView();
      }

      switch (w.step) {
        case 1:
          return renderDispatchStep1();
        case 2:
          return renderDispatchStep2();
        case 3:
          return renderDispatchStep3();
      }
      return "";
    }

    /* ---------- Step Indicator ---------- */
    function renderStepIndicator(current) {
      return `
              <div style="display:flex; gap:8px; align-items:center; margin-bottom:12px; font-size:12px;">
                ${[1, 2, 3]
          .map(
            (n) => `
                  <div style="display:flex; align-items:center; gap:4px;">
                    <span style="width:18px; height:18px; border-radius:50%; border:2px solid #1a1a1a; display:inline-flex; align-items:center; justify-content:center; font-weight:bold; background:${n <= current ? "#dbeafe" : "#fff"};">${n}</span>
                    <span style="color:${n === current ? "#1a1a1a" : "#888"};">${["Delivery", "Inventory", "Review"][n - 1]}</span>
                    ${n < 3 ? '<span style="color:#888;">→</span>' : ""}
                  </div>
                `,
          )
          .join("")}
              </div>
            `;
    }

    /* ---------- Step 1: Delivery Assignment ---------- */
    function renderDispatchStep1() {
      const o = state.order;
      const w = state.dispatchWizard;
      const isTripContext = state.dispatchContext === "trip";
      const trip = isTripContext ? state.trip : null;
      const orderCount = isTripContext ? trip?.orders.length || 0 : 1;

      // Courier is available only when the batch size is exactly 1.
      const courierAvailable = orderCount < 2;

      const drivers = DRIVERS.filter((d) => d.status === "Available");
      const vehicles = VEHICLES.filter((v) => v.status === "Available");

      const mode = w.deliveryMode; // '' | 'Company Fleet' | 'Courier'

      return `
    <div class="modal-overlay" onclick="if(event.target===this)closeDispatchWizard()">
      <div class="modal">
        <div class="modal-header">Dispatch Order <button class="close-x" onclick="closeDispatchWizard()">×</button></div>
        <div class="modal-body">
          ${renderStepIndicator(1)}

          <p style="font-size:13px; color:#555;">
            <strong>${isTripContext ? `Trip of ${orderCount} orders` : o.orderNumber}</strong>
          </p>

                   <label class="mt-12">Delivery Mode *</label>
          <div style="display:flex; gap:12px; flex-wrap:wrap;">
            <label style="display:flex; align-items:center; gap:6px; padding:8px 14px; border:2px solid #1a1a1a; border-radius:4px; cursor:pointer; font-size:13px; background:${mode === "Company Fleet" ? "#dbeafe" : "#fff"}; font-weight:${mode === "Company Fleet" ? "bold" : "normal"};">
              <input type="radio" name="dispatchMode" value="Company Fleet"
                style="width:auto; margin:0;"
                ${mode === "Company Fleet" ? "checked" : ""}
                onchange="onDispatchModeChange('Company Fleet')">
              Company Fleet
            </label>

            <label style="display:flex; align-items:center; gap:6px; padding:8px 14px; border:2px solid #1a1a1a; border-radius:4px; cursor:pointer; font-size:13px; background:${mode === "Courier" ? "#dbeafe" : "#fff"}; font-weight:${mode === "Courier" ? "bold" : "normal"}; ${!courierAvailable ? "opacity:0.4; cursor:not-allowed; background:#f3f4f6;" : ""}">
              <input type="radio" name="dispatchMode" value="Courier"
                style="width:auto; margin:0;"
                ${mode === "Courier" ? "checked" : ""}
                ${!courierAvailable ? "disabled" : ""}
                onchange="onDispatchModeChange('Courier')">
              Courier
            </label>
          </div>

          ${!courierAvailable
          ? `
            <div style="font-size:11px; color:#92400e; margin-top:6px; padding:6px 8px; border:1px dashed #92400e; border-radius:4px;">
              💡 Courier is one parcel per trip. Remove orders until only one remains to enable Courier.
            </div>
          `
          : ""
        }

          ${mode === "Company Fleet"
          ? `
                      <label class="mt-12">Driver *</label>
            <select id="dispatchDriver" onchange="onWizardDriverChange(this.value);">
              <option value="">Select driver</option>
              ${drivers.map((d) => `<option value="${d.name}" ${w.driver === d.name ? "selected" : ""}>${d.name} (${d.phone})</option>`).join("")}
            </select>
            ${drivers.length === 0 ? '<div style="color:#991b1b; font-size:12px; margin-top:4px;">⚠ No drivers available.</div>' : ""}

            <label class="mt-12">Vehicle *</label>
            <select id="dispatchVehicle" onchange="onWizardVehicleChange(this.value);">
              <option value="">Select vehicle</option>
              ${vehicles.map((v) => `<option value="${v.plate}" ${w.vehicle === v.plate ? "selected" : ""}>${v.plate} — ${v.type} (${v.capacity} capacity)</option>`).join("")}
            </select>
            ${vehicles.length === 0 ? '<div style="color:#991b1b; font-size:12px; margin-top:4px;">⚠ No vehicles available.</div>' : ""}
          `
          : mode === "Courier"
            ? `
            <label class="mt-12">Courier Service *</label>
            <select id="dispatchCourier" onchange="state.dispatchWizard.courier=this.value;">
              <option value="">Select courier</option>
              ${COURIERS.map((cr) => `<option value="${cr}" ${w.courier === cr ? "selected" : ""}>${cr}</option>`).join("")}
            </select>

            <label class="mt-12">Tracking Number *</label>
            <input type="text" id="dispatchTracking" value="${w.trackingNumber}"
              placeholder="e.g. GIG-12345678"
              oninput="state.dispatchWizard.trackingNumber=this.value;">
          `
            : ""
        }

          <label class="mt-12">Dispatch Date *</label>
          <input type="date" id="dispatchDate" value="${w.dispatchDate || todayISO()}"
            onchange="state.dispatchWizard.dispatchDate=this.value;">

          <label class="mt-12">Notes (Optional)</label>
          <input type="text" id="dispatchNotes" value="${w.dispatchNotes}"
            placeholder="e.g. Call before arriving"
            oninput="state.dispatchWizard.dispatchNotes=this.value;">
        </div>
        <div class="modal-footer">
          <button onclick="closeDispatchWizard()">Cancel</button>
          <button class="btn-primary" onclick="dispatchWizardNext()">Next: Inventory →</button>
        </div>
      </div>
    </div>
  `;
    }

    function onDispatchModeChange(value) {
      // Guard: reject Courier when the trip has 2+ orders.
      if (
        value === "Courier" &&
        state.dispatchContext === "trip" &&
        state.trip &&
        state.trip.orders.length >= 2
      ) {
        return;
      }
      state.dispatchWizard.deliveryMode = value;
      // Clear mode-specific fields when switching
      if (value !== "Company Fleet") {
        state.dispatchWizard.driver = "";
        state.dispatchWizard.vehicle = "";
      }
      if (value !== "Courier") {
        state.dispatchWizard.courier = "";
        state.dispatchWizard.trackingNumber = "";
      }
      render();
    }

    /* ---------- Step 2: Assign Inventory ---------- */
    function renderDispatchStep2() {
      const o = state.order;
      const w = state.dispatchWizard;
      const loc = getLocation(w.dispatchLocationId);

      let progressDone = 0;
      let progressTotal = o.items.length;

      return `
    <div class="modal-overlay" onclick="if(event.target===this)closeDispatchWizard()">
      <div class="modal">
        <div class="modal-header">Dispatch Order <button class="close-x" onclick="closeDispatchWizard()">×</button></div>
        <div class="modal-body">
          ${renderStepIndicator(2)}

          <p style="font-size:13px; color:#555;">
            <strong>${o.orderNumber}</strong> · ${o.deliveryMode}
          </p>

          ${LOCATIONS.length > 1
          ? `
            <label class="mt-12">Dispatch Location *</label>
            <select id="dispatchLocation" onchange="onDispatchLocationChange(this.value)">
              ${LOCATIONS.map((l) => `<option value="${l.id}" ${w.dispatchLocationId === l.id ? "selected" : ""}>${l.name}</option>`).join("")}
            </select>
          `
          : `
            <div style="font-size:12px; color:#555; margin-top:12px;">
              Dispatching from <strong>${LOCATIONS[0].name}</strong>.
            </div>
          `
        }



                  <div class="mt-12">
            ${calcOutstandingLines(o)
          .map((line) => {
            const p = getInvProduct(line.productId);
            if (!p) return "";
            const qty = line.outstanding;
            const isIndividual = p.trackingType === "Individual";
            const selectedUnits = w.unitSelections[line.productId] || [];
            const isReady = isIndividual
              ? selectedUnits.length === qty
              : true;
            if (isReady) progressDone++;

            if (isIndividual) {
              return `
                      <div class="card" style="margin-bottom:8px; padding:10px;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                          <div>
                            <strong>${p.name}</strong> · ×${qty}
                            <span style="font-size:11px; color:#888;">[Individual Item]</span>
                          </div>
                        </div>
                          <div style="margin-top:6px; font-size:12px;">
                          ${selectedUnits.length === qty
                  ? `<span class="green">✓ ${selectedUnits.length} units auto-selected (oldest first)</span>`
                  : `<span class="red">⚠ ${selectedUnits.length} of ${qty} selected — only ${getStockSummary(line.productId, w.dispatchLocationId).available} available at ${getLocation(w.dispatchLocationId)?.name}</span>`
                }
                        </div>
                        <div style="margin-top:6px;">
                          <button onclick="openChangeUnits('${line.productId}')" style="font-size:12px;">Change Units</button>
                        </div>
                      </div>
                    `;
            } else {
              // Stock quantity — check available at the location
              const s = getStockSummary(
                line.productId,
                w.dispatchLocationId,
              );
              const enough = s.available >= qty;
              if (enough) progressDone++;
              return `
                      <div class="card" style="margin-bottom:8px; padding:10px;">
                        <div>
                          <strong>${p.name}</strong> · ×${qty}
                          <span style="font-size:11px; color:#888;">[Stock Quantity]</span>
                        </div>
                        <div style="margin-top:6px; font-size:12px;" class="${enough ? "green" : "red"}">
                          ${enough
                  ? `✓ ${qty} units will be reserved from ${loc?.name}`
                  : `⚠ Only ${s.available} available at ${loc?.name}. Need ${qty}.`
                }
                        </div>
                      </div>
                    `;
            }
          })
          .join("")}
          </div>

          

          <div style="margin-top:12px; padding:8px; background:#f8f8f8; border-radius:4px; font-size:12px;">
            Progress: ${progressDone} of ${progressTotal} items assigned
          </div>
        </div>
        <div class="modal-footer">
          <button onclick="dispatchWizardBack()">← Back</button>
          <button class="btn-primary" onclick="dispatchWizardNext()" ${progressDone < progressTotal ? "disabled" : ""}>Next: Review →</button>
        </div>
      </div>
    </div>
  `;
    }

    /* ---------- Step 2b: Change Units (body swap) ---------- */
    function renderChangeUnitsView() {
      const o = state.order;
      const w = state.dispatchWizard;
      const productId = w.changingUnitsFor;
      const product = getInvProduct(productId);
      const line = calcOutstandingLines(o).find(
        (l) => l.productId === productId,
      );
      if (!product || !line) return "";

      const qty = line.outstanding;
      const selected = w.unitSelections[productId] || [];

      // Get all units for this product at the dispatch location
      const unitsAtLocation = UNITS.filter(
        (u) =>
          u.productId === productId &&
          u.locationId === w.dispatchLocationId &&
          u.status === "Available" &&
          (!u.softReservedFor || u.softReservedFor === o.orderNumber),
      ).sort((a, b) => {
        if (a.receivedDate !== b.receivedDate)
          return a.receivedDate < b.receivedDate ? -1 : 1;
        return a.tag < b.tag ? -1 : 1;
      });

      // Filter by search term
      const search = (w.unitSearch || "").toLowerCase();
      const filteredUnits = unitsAtLocation.filter(
        (u) => !search || u.tag.toLowerCase().includes(search),
      );

      return `
    <div class="modal-overlay" onclick="if(event.target===this)closeDispatchWizard()">
      <div class="modal">
        <div class="modal-header">Change Units <button class="close-x" onclick="closeDispatchWizard()">×</button></div>
        <div class="modal-body">
          ${renderStepIndicator(2)}

                   <p style="font-size:13px; margin-top:8px;">
            <strong>${product.name}</strong> · Select exactly ${qty} units from ${getLocation(w.dispatchLocationId)?.name}
          </p>

          <p style="font-size:12px; color:#666; margin-top:4px;">
            ${unitsAtLocation.length} unit${unitsAtLocation.length === 1 ? "" : "s"} available at this location.
          </p>

          <input type="text" id="unitSearch"
            placeholder="🔍 Search by tag..."
            value="${w.unitSearch || ""}"
            style="margin-top:8px;"
            oninput="state.dispatchWizard.unitSearch=this.value; render();">

          <div style="max-height:320px; overflow-y:auto; border:2px solid #1a1a1a; border-radius:4px; padding:8px; margin-top:8px;">
            ${filteredUnits.length === 0
          ? `<div class="empty-state">${unitsAtLocation.length === 0 ? "No units available." : "No units match your search."}</div>`
          : filteredUnits
            .map((u) => {
              const checked = selected.includes(u.id);
              return `
                    <label style="display:flex; gap:8px; align-items:center; padding:6px 4px; border-bottom:1px dashed #ddd; font-size:12px; cursor:pointer;">
                      <input type="checkbox" ${checked ? "checked" : ""} style="width:auto;"
                              onchange="toggleUnitSelection('${productId}', '${u.id}', ${qty})">
                      <span style="flex:1;">${u.tag}</span>
                      <span style="font-size:11px; color:#888;">${u.condition || "New"}</span>
                      <span style="font-size:11px; color:#888;">${formatDate(u.receivedDate)}</span>
                    </label>
                  `;
            })
            .join("")
        }
          </div>

          <div style="margin-top:8px; font-size:12px;">
                   ${selected.length === qty
          ? `<span class="green">✓ ${selected.length} of ${qty} selected</span>`
          : `<span class="red">Select exactly ${qty}. Currently: ${selected.length}</span>`
        }
          </div>
        </div>
        <div class="modal-footer">
          <button onclick="closeChangeUnits()">← Back</button>
                    <button class="btn-primary" onclick="confirmChangeUnits()" ${selected.length !== qty ? "disabled" : ""}>Done</button>
        </div>
      </div>
    </div>
  `;
    }
    /* ---------- Step 3: Review & Confirm ---------- */
    function renderDispatchStep3() {
      const o = state.order;
      const w = state.dispatchWizard;
      const loc = getLocation(w.dispatchLocationId);

      return `
    <div class="modal-overlay" onclick="if(event.target===this)closeDispatchWizard()">
      <div class="modal">
        <div class="modal-header">Dispatch Order <button class="close-x" onclick="closeDispatchWizard()">×</button></div>
        <div class="modal-body">
          ${renderStepIndicator(3)}

          <p style="font-size:13px; color:#555;">
            <strong>${o.orderNumber}</strong> · ${o.deliveryMode}
          </p>

          <div class="card" style="margin-top:12px; padding:10px;">
            <div style="font-weight:bold; margin-bottom:6px;">Delivery</div>
            ${o.deliveryMode === "Company Fleet"
          ? `
              <div style="font-size:12px;">Driver: <strong>${w.driver}</strong></div>
              <div style="font-size:12px;">Vehicle: <strong>${w.vehicle}</strong></div>
            `
          : `
              <div style="font-size:12px;">Courier: <strong>${w.courier}</strong></div>
              <div style="font-size:12px;">Tracking: <strong>${w.trackingNumber}</strong></div>
            `
        }
            <div style="font-size:12px;">Dispatch Date: <strong>${formatDate(w.dispatchDate)}</strong></div>
            ${w.dispatchNotes ? `<div style="font-size:12px;">Notes: <em>${w.dispatchNotes}</em></div>` : ""}
          </div>

          <div class="card" style="margin-top:8px; padding:10px;">
            <div style="font-weight:bold; margin-bottom:6px;">Inventory (from ${loc?.name})</div>
                      ${calcOutstandingLines(o)
          .map((line) => {
            const p = getInvProduct(line.productId);
            if (!p) return "";
            const qty = line.outstanding;
            if (p.trackingType === "Individual") {
              const units = (
                w.unitSelections[line.productId] || []
              ).map((id) => UNITS.find((u) => u.id === id));
              return `
                      <div style="margin-bottom:8px;">
                        <div style="font-size:12px;"><strong>${p.name}</strong> (${qty} units)</div>
                        ${units.map((u) => `<div style="font-size:11px; color:#555; margin-left:12px;">${u.tag}</div>`).join("")}
                      </div>
                    `;
            } else {
              return `
                      <div style="margin-bottom:8px;">
                        <div style="font-size:12px;"><strong>${p.name}</strong> (${qty} units)</div>
                        <div style="font-size:11px; color:#555; margin-left:12px;">Stock quantity from ${loc?.name}</div>
                      </div>
                    `;
            }
          })
          .join("")}
          </div>

          <div style="margin-top:12px; padding:8px; background:#f0f0f0; border-radius:4px; font-size:12px;">
            ⚠ This will reserve stock and mark the order as <strong>Out for Delivery</strong>.
          </div>
        </div>
        <div class="modal-footer">
          <button onclick="dispatchWizardBack()">← Back</button>
          <button class="btn-primary" onclick="confirmDispatch()">Confirm & Dispatch</button>
        </div>
      </div>
    </div>
  `;
    }

    /* ============================================================
DISPATCH WIZARD HANDLERS
============================================================ */

    function closeDispatchWizard() {
      state.activeModal = null;
      state.dispatchWizard.changingUnitsFor = null;
      state.dispatchReturnTo = "order-details";
      render();
    }

    function dispatchWizardNext() {
      const w = state.dispatchWizard;
      const o = state.order;

      if (w.step === 1) {
        // Validate Step 1
        if (!w.deliveryMode) return alert("Select a delivery mode.");

        const isTripContext = state.dispatchContext === "trip";
        const orderCount = isTripContext ? state.trip?.orders.length || 0 : 1;

        if (w.deliveryMode === "Company Fleet") {
          if (!w.driver) return alert("Select a driver.");
          if (!w.vehicle) return alert("Select a vehicle.");
        } else if (w.deliveryMode === "Courier") {
          if (orderCount >= 2) {
            return alert(
              "Courier cannot be used for a trip with more than one order. Switch to Company Fleet, or dispatch the orders individually.",
            );
          }
          if (!w.courier) return alert("Select a courier.");
          if (!w.trackingNumber || !w.trackingNumber.trim())
            return alert("Enter tracking number.");
        } else {
          return alert("Select a delivery mode.");
        }

        if (!w.dispatchDate) return alert("Select dispatch date.");

        w.step = 2;
        render();
      } else if (w.step === 2) {
        // Validate Step 2 — all outstanding items assigned
        for (const line of calcOutstandingLines(o)) {
          const p = getInvProduct(line.productId);
          if (!p) continue;
          const qty = line.outstanding;

          if (p.trackingType === "Individual") {
            const selected = w.unitSelections[line.productId] || [];
            if (selected.length !== qty) {
              return alert(`Select exactly ${qty} units for ${p.name}.`);
            }
          } else {
            const s = getStockSummary(line.productId, w.dispatchLocationId);
            if (s.available < qty) {
              return alert(
                `Not enough stock for ${p.name} at ${getLocation(w.dispatchLocationId)?.name}. Available: ${s.available}, Need: ${qty}.`,
              );
            }
          }
        }

        w.step = 3;
        render();
      }
    }

      if (w.step > 1) w.step--;
      if (w.changingUnitsFor) w.changingUnitsFor = null;

      if (selected.includes(unitId)) {

    function confirmDispatch() {
      const o = state.order;
      const w = state.dispatchWizard;

      // 1. Persist the mode on the order and build dispatchInfo
      const dispatchDate = w.dispatchDate || todayISO();
      o.deliveryMode = w.deliveryMode;
      logTimeline(`Dispatch mode: ${w.deliveryMode}`);

      if (w.deliveryMode === "Company Fleet") {
        o.dispatchInfo = {
          driver: w.driver,
          vehicle: w.vehicle,
          dispatchDate,
          notes: w.dispatchNotes || "",
        };
        logTimeline(
          `Dispatched via Fleet — Driver: ${w.driver}, Vehicle: ${w.vehicle}`,
        );
      } else {
        o.dispatchInfo = {
          courier: w.courier,
          trackingNumber: w.trackingNumber,
          dispatchDate,
          notes: w.dispatchNotes || "",
        };
        logTimeline(
          `Dispatched via ${w.courier} — Tracking: ${w.trackingNumber}`,
        );
      }

      // 2. Flip selected units to Reserved — outstanding quantities only
      calcOutstandingLines(o).forEach((line) => {
        const p = getInvProduct(line.productId);
        if (!p) return;
        const qty = line.outstanding;

        if (p.trackingType === "Individual") {
          const selectedUnitIds = w.unitSelections[line.productId] || [];
          selectedUnitIds.forEach((uid) => {
            const unit = UNITS.find((u) => u.id === uid);
            if (unit) {
              unit.status = "Reserved";
              unit.softReservedFor = null;
              unit.reservedForOrder = o.orderNumber;
            }
          });
          logMovement(
            line.productId,
            w.dispatchLocationId,
            "reservation",
            qty,
            o.orderNumber,
          );
        } else {
          // Stock quantity: increment reserved on the stock row
          let row = STOCK.find(
            (s) =>
              s.productId === line.productId &&
              s.locationId === w.dispatchLocationId,
          );
          if (row) {
            row.reserved = (row.reserved || 0) + qty;
          }
          logMovement(
            line.productId,
            w.dispatchLocationId,
            "reservation",
            qty,
            o.orderNumber,
          );
        }
      });


      // 3. Clear soft reservation record on the order (it's now hard-reserved)
      o.softReservation = null;

      // 3b. Record the fulfilment event (physical handover to driver/courier)
      {
        const items = [];
        calcOutstandingLines(o).forEach((line) => {
          const product = getInvProduct(line.productId);
          if (!product) return;
          const tags = [];
          if (product.trackingType === "Individual") {
            const selectedIds = w.unitSelections[line.productId] || [];
            selectedIds.forEach((uid) => {
              const u = UNITS.find((x) => x.id === uid);
              if (u) tags.push(u.tag);
            });
          }
          items.push({
            productId: line.productId,
            name: product.name,
            qty: line.outstanding,
            tags,
            trackingType: product.trackingType,
          });
        });

        recordFulfilmentEvent(o, {
          type: "Delivery",
          handler: w.deliveryMode === "Company Fleet"
            ? { driver: w.driver, vehicle: w.vehicle }
            : { courier: w.courier, trackingNumber: w.trackingNumber },
          items,
        });
      }

      // 4. Move order to Out for Delivery
      o.state = "out-for-delivery";
      logTimeline("Order status: Out for Delivery");

      // 5. Close wizard and return to the appropriate view
      state.activeModal = null;
      state.dispatchWizard = {
        step: 1,
        deliveryMode: "",
        driver: "",
        vehicle: "",
        courier: "",
        trackingNumber: "",
        dispatchDate: null,
        dispatchNotes: "",
        dispatchLocationId: null,
        changingUnitsFor: null,
        unitSelections: {},
      };

      const returnTo = state.dispatchReturnTo || "order-details";
      state.dispatchReturnTo = "order-details";

      // The order has moved to out-for-delivery. Regardless of which
      // path opened the wizard, it must leave the dispatch pool and
      // enter in-transit. The returnTo only controls where the UI
      // navigates to afterwards.
      const dispatchedNumber = state.order.orderNumber;

      // Clear any checkbox selection carried over.
      state.order._selected = false;

      // Remove from pool
      state.dispatchPool = state.dispatchPool.filter(
        (o) => o.orderNumber !== dispatchedNumber,
      );

      // Add to in-transit if not already there
      if (
        !state.inTransitOrders.find(
          (x) => x.orderNumber === dispatchedNumber,
        )
      ) {
        state.inTransitOrders.push(state.order);
      }

      if (returnTo === "dashboard") {
        // Ensure the Dispatch tab shows the Dashboard
        state.activeTab = "dispatch";
        state.dispatchView = "dashboard";
      } else {
        state.currentPage = "order-details";
      }
      render();
    }

      const product = getInvProduct(batch.productId);
      const isIndividual = product.trackingType === "Individual";
      const unitLabel = product.unitOfMeasure || "unit";

      let totalOnHand = 0;
      let totalReserved = 0;
      let locationBreakdownHtml = "";
      let hasStock = false;

      if (isIndividual) {
        // For Individual Items, count physical units that are still here.
        // EXCLUDE Sold, Removed, and Lost units.
        const liveUnits = UNITS.filter((u) =>
          u.batchId === batch.id &&
          ["Available", "Reserved", "In Transit"].includes(u.status)
        );
        hasStock = liveUnits.length > 0;

        if (hasStock) {
          // Group by location
          const byLoc = {};
          liveUnits.forEach((u) => {
            const locId = u.locationId || "loc2";
            byLoc[locId] = byLoc[locId] || { count: 0, reserved: 0 };
            byLoc[locId].count++;
            if (u.status === "Reserved") byLoc[locId].reserved++;
          });

          Object.keys(byLoc).forEach((locId) => {
            const data = byLoc[locId];
            totalOnHand += data.count;
            totalReserved += data.reserved;
            locationBreakdownHtml += `
              <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px dashed #eee; font-size:13px;">

              </div>
            `;
          });
        }

        // For Stock Quantity, look at the STOCK array
        const stockRows = STOCK.filter((s) => s.batchId === batch.id && s.onHand > 0);
        hasStock = stockRows.length > 0;

        if (hasStock) {
          stockRows.forEach((row) => {
            totalOnHand += row.onHand;
            totalReserved += (row.reserved || 0);
            locationBreakdownHtml += `
              <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px dashed #eee; font-size:13px;">
                <div style="flex:1;"><strong>${getLocation(row.locationId)?.name || "—"}</strong></div>

              </div>

          });

      }

      const totalAvailable = totalOnHand - totalReserved;

      // Filter movements for this specific batch
      const batchMovements = MOVEMENTS.filter((m) => m.batchId === batch.id).sort(

    // ----- Transfer Stock Helpers -----

    // Get available stock at a location for a product.
    // For Individual: counts units with status === "Available" and no soft-reservation.
    // For StockQuantity: returns onHand - reserved.
    function getTransferableStock(productId, locationId) {
      const product = getInvProduct(productId);
      if (!product) return 0;

      if (product.trackingType === "Individual") {
        return UNITS.filter(
          (u) =>
            u.productId === productId &&
            u.locationId === locationId &&
            u.status === "Available" &&
            !u.softReservedFor
        ).length;
      } else {
        const row = STOCK.find(
          (s) => s.productId === productId && s.locationId === locationId
        );
        if (!row) return 0;
        return Math.max(0, row.onHand - (row.reserved || 0));
      }
    }

    // Get the oldest N Available units at a location (FIFO).
    // Excludes soft-reserved units.
    function getTransferCandidates(productId, locationId, qty) {
      return UNITS.filter(
        (u) =>
          u.productId === productId &&
          u.locationId === locationId &&
          u.status === "Available" &&
          !u.softReservedFor
      )
        .sort((a, b) => {
          if (a.receivedDate !== b.receivedDate)
            return a.receivedDate < b.receivedDate ? -1 : 1;
          return a.tag < b.tag ? -1 : 1;
        })
        .slice(0, qty)
        .map((u) => u.id);
    }

    // Execute the transfer. Assumes validation already happened.
    // Handles both Individual units and StockQuantity rows.
    // Logs two movements (transfer_out at FROM, transfer_in at TO).

    function executeTransfer(productId, fromId, toId, qty, selectedUnitIds, notes, batchId) {
      const product = getInvProduct(productId);
      if (!product) return;

      if (product.trackingType === "Individual") {
        // 1. Verify all selected units are at the source location and Available
        const units = selectedUnitIds
          .map((uid) => UNITS.find((u) => u.id === uid))
          .filter(
            (u) =>
              u &&
              u.productId === productId &&
              u.locationId === fromId &&
              u.status === "Available"
          );
        if (units.length !== qty) {
          alert("Some selected units are no longer available at the source location.");
          return;
        }

        // 2. Mark them In Transit
        const now = new Date().toISOString();
        units.forEach((u) => {
          u.status = "In Transit";
          u.inTransitTransferId = null; // filled below
        });

        // 3. Create the transfer record
        const transferId = "tr-" + Date.now();
        units.forEach((u) => (u.inTransitTransferId = transferId));

        TRANSFERS.push({
          id: transferId,
          transferNumber: genTransferNum(),
          productId,
          batchId: units[0]?.batchId || null,
          qty,
          unitIds: units.map((u) => u.id),
          fromLocationId: fromId,
          toLocationId: toId,
          status: "In Transit",
          sentBy: "You",
          sentAt: now,
          receivedBy: null,
          receivedAt: null,
          notes: notes || "",
        });

        logMovement(
          productId,
          fromId,
          "transfer_out",
          qty,
          `${getLocation(fromId)?.name || "—"} → ${getLocation(toId)?.name || "—"} (In Transit)${notes ? " · " + notes : ""}`,
          null,
          units[0]?.batchId || null
        );
        return;
      }

      // Stock Quantity — batch-aware
      if (!batchId) {
        alert("Select a batch to transfer.");
        return;
      }

      const fromRow = STOCK.find(
        (s) =>
          s.productId === productId &&
          s.locationId === fromId &&
          s.batchId === batchId
      );
      if (!fromRow) {
        alert("Batch not found at this location.");
        return;
      }
      if (fromRow.onHand < qty) {
        alert(`Only ${fromRow.onHand} available in this batch.`);
        return;
      }

      // 1. Decrement the source batch (goods have left)
      fromRow.onHand -= qty;

      // 2. Create the transfer record (destination NOT credited yet)
      const now = new Date().toISOString();
      TRANSFERS.push({
        id: "tr-" + Date.now(),
        transferNumber: genTransferNum(),
        productId,
        batchId,
        qty,
        unitIds: null, // Stock Quantity
        fromLocationId: fromId,
        toLocationId: toId,
        status: "In Transit",
        sentBy: "You",
        sentAt: now,
        receivedBy: null,
        receivedAt: null,
        notes: notes || "",
      });

      logMovement(
        productId,
        fromId,
        "transfer_out",
        qty,
        `${getLocation(fromId)?.name || "—"} → ${getLocation(toId)?.name || "—"} (In Transit)${notes ? " · " + notes : ""}`,
        null,
        batchId
      );
    }

      const suggestedBatchNumber = (() => {

        const nextIndex = usedLetters.length > 0 ? Math.max(...usedLetters) + 1 : 0;

          if (BATCHES.some((b) => b.batchNumber === batchNumber)) {

          // 1. Create the batch record
          const newBatchId = "b" + (BATCHES.length + 1);

            initialQty: qty,

          // 2. Create units (Individual) or stock rows (StockQuantity) tied to this batch
          if (product.trackingType === "Individual") {
            const prefix = product.tagPrefix || product.sku.split("-")[0];
            const ymd = receivedDate.replace(/-/g, "");
            const existing = UNITS.filter((u) =>

    /* ============================================================
   COMBOBOX
   A text input with a dropdown list. Typing filters the list.
   Free text is accepted as a custom value (used by Category
   and Unit of Measure in product setup).
   ============================================================ */

    // Render a combobox.
    //   id          — the input's DOM id (also used as the state key)
    //   options     — array of strings (suggestions)
    //   value       — current value (string)
    //   placeholder — placeholder text for the input
    function renderCombobox(id, options, value, placeholder) {
      const isOpen = state.openCombobox === id;
      const typed = value || "";
      const query = typed.toLowerCase();
      // Filter: show options that contain the typed text (or all if nothing typed)
      const filtered = options.filter(
        (o) => !query || o.toLowerCase().includes(query),
      );
      // Has the operator typed something that doesn't exactly match an option?
      const exactMatch = options.some((o) => o.toLowerCase() === query);
      const showCreate = typed.length > 0 && !exactMatch;

      return `
        <div class="combobox" data-combobox="${id}">
          <div class="combobox-input" onclick="openCombobox('${id}')">
            <input type="text"
              id="${id}"
              value="${value || ""}"
              placeholder="${placeholder}"
              autocomplete="off"
              onfocus="openCombobox('${id}')"
              oninput="onComboboxInput('${id}')"
              onkeydown="onComboboxKeydown(event, '${id}')"
              onblur="onComboboxBlur(event, '${id}')">
            <div class="combobox-caret" onclick="toggleCombobox('${id}', event)">▼</div>
          </div>
          ${isOpen
          ? `
            <div class="combobox-panel">
              ${filtered.length === 0 && !showCreate
            ? `<div class="combobox-empty">No matches. Type a value to use it.</div>`
            : ""
          }
              ${filtered
            .map(
              (o, idx) => `
                <div class="combobox-item ${state.comboboxActive === idx ? "active" : ""}"
                  onmousedown="selectComboboxValue('${id}', ${JSON.stringify(o).replace(/"/g, "&quot;")})">
                  ${o}
                </div>
              `,
            )
            .join("")}
              ${showCreate
            ? `
                <div class="combobox-item create-new"
                  onmousedown="selectComboboxValue('${id}', ${JSON.stringify(typed).replace(/"/g, "&quot;")})">
                  Use "${typed}"
                </div>
              `
            : ""
          }
            </div>
          `
          : ""
        }
        </div>
      `;
    }

    function openCombobox(id) {
      state.openCombobox = id;
      state.comboboxActive = -1;
      render();
    }

    function toggleCombobox(id, event) {
      event.stopPropagation();
      if (state.openCombobox === id) {
        state.openCombobox = null;
      } else {
        state.openCombobox = id;
      }
      state.comboboxActive = -1;
      render();
    }

    function onComboboxInput(id) {
      // Input value already lives in the DOM. We just need to re-render so the
      // filtered panel updates, but we must preserve focus and value.
      const input = document.getElementById(id);
      const value = input?.value || "";
      const selStart = input?.selectionStart;
      const selEnd = input?.selectionEnd;

      state.openCombobox = id;
      state.comboboxActive = -1;
      render();

      // Restore focus and caret position
      setTimeout(() => {
        const newInput = document.getElementById(id);
        if (newInput) {
          newInput.focus();
          try {
            newInput.setSelectionRange(selStart, selEnd);
          } catch (e) { }
        }
      }, 0);
    }

    function onComboboxKeydown(event, id) {
      const options = optionsForCombobox(id);
      const typed = event.target.value || "";
      const query = typed.toLowerCase();
      const filtered = options.filter(
        (o) => !query || o.toLowerCase().includes(query),
      );
      const exactMatch = options.some((o) => o.toLowerCase() === query);
      const showCreate = typed.length > 0 && !exactMatch;

      const totalItems = filtered.length + (showCreate ? 1 : 0);

      if (event.key === "ArrowDown") {
        event.preventDefault();
        state.openCombobox = id;
        state.comboboxActive = Math.min(
          state.comboboxActive + 1,
          totalItems - 1,
        );
        render();
        refocusCombobox(id);
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        state.comboboxActive = Math.max(state.comboboxActive - 1, 0);
        render();
        refocusCombobox(id);
      } else if (event.key === "Enter") {
        if (state.comboboxActive >= 0 && state.comboboxActive < totalItems) {
          event.preventDefault();
          const value =
            state.comboboxActive < filtered.length
              ? filtered[state.comboboxActive]
              : typed;
          selectComboboxValue(id, value);
        }
      } else if (event.key === "Escape") {
        state.openCombobox = null;
        state.comboboxActive = -1;
        render();
        refocusCombobox(id);
      }
    }

    function onComboboxBlur(event, id) {
      // Small delay so an mousedown on a panel item can fire first.
      setTimeout(() => {
        // If focus has moved somewhere else and the panel is still open, close it.
        if (state.openCombobox === id) {
          state.openCombobox = null;
          state.comboboxActive = -1;
          render();
        }
      }, 150);
    }

    function refocusCombobox(id) {
      setTimeout(() => {
        const input = document.getElementById(id);
        if (input) {
          input.focus();
          // Put caret at end
          const len = input.value.length;
          try {
            input.setSelectionRange(len, len);
          } catch (e) { }
        }
      }, 0);
    }

    // Map combobox ids to their option lists.
    function optionsForCombobox(id) {
      if (id === "npCategory") return PRODUCT_CATEGORIES;
      if (id === "npUnit") return PRODUCT_UNITS;
      return [];
    }

    function selectComboboxValue(id, value) {
      const input = document.getElementById(id);
      if (input) input.value = value;

      // Remove the panel directly instead of a full re-render.
      // A full re-render destroys the DOM node mid-click, which causes the
      // browser to drop the click and the selection never appears to take.
      const wrap = input?.closest(".combobox");
      const panel = wrap?.querySelector(".combobox-panel");
      if (panel) panel.remove();

      state.openCombobox = null;
      state.comboboxActive = -1;
      // No render() — DOM and state are consistent as-is.
      // The input's value will be read fresh next time we need it
      // (e.g. on save or on the next combobox interaction).
    }

    // On-hand computation scoped to the Adjust Stock modal.
    // Excludes Sold and Removed units (they are not physically on the shelf).
    // Does NOT touch getStockSummary — the product detail page and inventory
    // list must keep their existing aggregate semantics unchanged.
    function getAdjustableStock(productId, locationId) {
      const product = getInvProduct(productId);
      if (!product) return { onHand: 0, available: 0, reserved: 0 };

      if (product.trackingType === "Individual") {
        const units = UNITS.filter(
          (u) =>
            u.productId === productId &&
            (!locationId || u.locationId === locationId) &&
            u.status !== "Removed" &&
            u.status !== "Sold",
        );
        const softReserved = units.filter(
          (u) => u.status === "Available" && u.softReservedFor,
        );
        return {
          onHand: units.length,
          available: units.filter(
            (u) => u.status === "Available" && !u.softReservedFor,
          ).length,
          reserved:
            units.filter((u) => u.status === "Reserved").length +
            softReserved.length,
        };
      } else {
        const row = STOCK.find(
          (s) => s.productId === productId && s.locationId === locationId,
        );
        const onHand = row ? row.onHand : 0;
        const reserved = row ? row.reserved : 0;
        return { onHand, available: onHand - reserved, reserved };
      }
    }


    function openTransferStockModal(productId) {
      state.inventoryProductId = productId;
      const product = getInvProduct(productId);
      if (!product) return;

      // Pick a sensible default FROM: first location with stock, else first location.
      const locsWithStock = LOCATIONS.filter(
        (l) => getTransferableStock(productId, l.id) > 0
      );
      const fromLoc = locsWithStock[0] || LOCATIONS[0];

      // Pick a default TO: any location that isn't FROM.
      const toLoc = LOCATIONS.find((l) => l.id !== fromLoc.id);

      state.transferFromId = fromLoc.id;
      state.transferToId = toLoc ? toLoc.id : LOCATIONS[0].id;
      state.transferQty = "";
      state.transferSelectedUnits = [];
      state.transferUnitSearch = "";
      state.transferNotes = "";

      // For Stock Quantity, seed the batch selection (FIFO default)
      if (product.trackingType === "StockQuantity") {
        const batches = getBatchesAtLocation(productId, fromLoc.id);
        // Seed with the oldest batch (batches are sorted by receivedDate? let's do FIFO explicitly)
        const sortedBatches = batches.slice().sort((a, b) => {
          if (a.receivedDate !== b.receivedDate)
            return a.receivedDate < b.receivedDate ? -1 : 1;
          return a.batchId < b.batchId ? -1 : 1;
        });
        state.transferBatchId = sortedBatches.length > 0 ? sortedBatches[0].batchId : null;
      } else {
        state.transferBatchId = null;
      }

      // Pre-seed the units for individual items (FIFO)
      if (product.trackingType === "Individual") {
        const available = getTransferableStock(productId, fromLoc.id);
        if (available > 0) {
          state.transferQty = String(Math.min(1, available));
          state.transferSelectedUnits = getTransferCandidates(
            productId,
            fromLoc.id,
            1
          );
        }
      }

      state.activeModal = "transfer-stock";
      render();
    }

    // Pluralize a unit-of-measure label for inline display.
    // Deliberately naive — only the irregulars actually present in
    // PRODUCT_UNITS (Box, Piece) are mapped. Anything else takes a simple "s".
    // TODO: replace with a proper lookup if PRODUCT_UNITS grows irregulars.
    function pluralizeUnit(label, n) {
      const lower = (label || "unit").toLowerCase();
      if (n === 1) return lower;
      const irregular = { box: "boxes", piece: "pieces" };
      return irregular[lower] || lower + "s";
    }


    function updateAdjustPreview() {
      const preview = document.getElementById("adjustPreview");
      if (!preview) return;

      const productId = state.inventoryProductId || PRODUCTS_INV[0].id;
      const product = getInvProduct(productId);
      const locationId = state.adjustLocationId || "loc2";
      const unitLabel = product.unitOfMeasure || "unit";
      const isStockQty = product.trackingType === "StockQuantity";

      // For Stock Quantity, use the selected batch's stock row.
      // For Individual, use the aggregate (which is correct).
      let s;
      if (isStockQty && state.adjustBatchId) {
        const row = STOCK.find(
          (r) =>
            r.productId === productId &&
            r.locationId === locationId &&
            r.batchId === state.adjustBatchId
        );
        if (!row) {
          preview.innerHTML = `<div style="color:#991b1b; font-size:12px;">Batch not found at this location.</div>`;
          return;
        }
        s = {
          onHand: row.onHand,
          reserved: row.reserved || 0,
          available: Math.max(0, row.onHand - (row.reserved || 0)),
        };
      } else {
        s = getAdjustableStock(productId, locationId);
      }

      const reason = state.adjustReason;
      const qty = parseInt(state.adjustQty, 10) || 0;

      if (!reason || qty <= 0) {
        preview.innerHTML = "";
        return;
      }

      let newBalance = 0;
      let delta = 0;

      if (reason === "stock_count") {
        newBalance = qty;
        delta = qty - s.onHand;
      } else {
        newBalance = s.onHand - qty;
        delta = -qty;
      }

      // Validation 1: counted value higher than system (stock_count only)
      if (reason === "stock_count" && qty > s.onHand) {
        preview.innerHTML = `
          <div style="padding:10px; border:2px dashed #991b1b; border-radius:4px; background:#fee2e2; font-size:12px; color:#991b1b;">
            <div style="font-weight:bold; margin-bottom:4px;">
              ⚠ Counted value is higher than the system balance (${s.onHand}).
            </div>
            <div>To record an increase, use Check In Stock instead.</div>
          </div>
        `;
        return;
      }

      // Validation 2: reservation conflict (scoped to batch for Stock Quantity)
      const reserved = s.reserved || 0;
      if (newBalance < reserved) {
        preview.innerHTML = `
          <div style="padding:10px; border:2px dashed #991b1b; border-radius:4px; background:#fee2e2; font-size:12px; color:#991b1b;">
            <div style="font-weight:bold; margin-bottom:6px;">
              ${reason === "stock_count" ? "⚠ Cannot record this count." : `⚠ Cannot remove ${qty}.`}
            </div>
            <div>
              ${reason === "stock_count"
            ? `You counted ${qty}, but ${reserved} ${pluralizeUnit(unitLabel, reserved)} are reserved from this batch. Recording this count would leave those orders without stock.`
            : `Only ${s.available} ${pluralizeUnit(unitLabel, s.available)} are free. ${reserved} are reserved from this batch.`}
            </div>
          </div>
        `;
        return;
      }

      // All good — show the before/after preview.
      const isNoOp = delta === 0;
      const batchLabel = isStockQty && state.adjustBatchId
        ? ` (${getBatch(state.adjustBatchId)?.batchNumber || "batch"})`
        : "";

      preview.innerHTML = `
        <div style="padding:10px; border:1px dashed #999; border-radius:4px; font-size:13px;">
          New balance${batchLabel}:&nbsp;&nbsp;<strong>${s.onHand}</strong> → <strong>${newBalance}</strong>
          <span style="color:#888; margin-left:8px;">(${delta >= 0 ? "+" : ""}${delta})</span>
          ${isNoOp
          ? `<div style="font-size:11px; color:#666; margin-top:6px;">
                   No change to record — the count matches the current balance.
                 </div>`
          : ""}
        </div>
      `;
    }

    // Returns the list of orders holding reservations for a product.
    // For Stock Quantity products, this is scoped to a specific batch if
    // a batchId is provided. For Individual items, batchId is ignored
    // because individual units are already tied to specific batches.
    function getReservationsForProductLocation(productId, locationId, batchId) {
      const results = [];

      const holdsReservation = (o) =>
        o.state === "out-for-delivery" ||
        o.state === "ready" ||
        (o.state === "confirmed" && o.fulfillment === "Delivery");

      const hasReservationAtLocation = (orderNumber) => {
        const product = getInvProduct(productId);
        if (!product) return false;

        if (product.trackingType === "Individual") {
          return UNITS.some(
            (u) =>
              u.productId === productId &&
              u.locationId === locationId &&
              (u.reservedForOrder === orderNumber ||
                (u.status === "Available" &&
                  u.softReservedFor === orderNumber)),
          );
        } else {
          // Stock Quantity: must match the specific batch if provided
          const row = STOCK.find(
            (s) =>
              s.productId === productId &&
              s.locationId === locationId &&
              (!batchId || s.batchId === batchId)
          );
          return !!(row && row.reserved > 0);
        }
      };

      const addIfMatches = (o) => {
        if (!o || !holdsReservation(o)) return;
        if (!o.items.some((item) => item.productId === productId)) return;
        if (!hasReservationAtLocation(o.orderNumber)) return;

        results.push({
          orderNumber: o.orderNumber,
          customerId: o.customerId,
        });
      };

      if (state.order) addIfMatches(state.order);
      state.inTransitOrders.forEach(addIfMatches);
      state.dispatchPool.forEach(addIfMatches);

      const seen = new Set();
      return results.filter((r) => {
        if (seen.has(r.orderNumber)) return false;
        seen.add(r.orderNumber);
        return true;
      });
    }



    function confirmAdjust() {
      const productId = state.inventoryProductId;
      const product = getInvProduct(productId);
      const locationId = state.adjustLocationId || "loc2";
      const notes = document.getElementById("adjustNotes").value.trim();

      const reason = state.adjustReason;
      const qty = parseInt(state.adjustQty, 10) || 0;

      if (!reason) return alert("Choose a reason.");
      if (!qty || qty <= 0) return alert("Enter a valid quantity.");

      const isStockQty = product.trackingType === "StockQuantity";

      // Resolve the scope — either the selected batch or the full aggregate
      let s;
      let batchRow = null;
      if (isStockQty) {
        if (!state.adjustBatchId) return alert("Select a batch first.");
        batchRow = STOCK.find(
          (r) =>
            r.productId === productId &&
            r.locationId === locationId &&
            r.batchId === state.adjustBatchId
        );
        if (!batchRow) return alert("Batch not found at this location.");
        s = {
          onHand: batchRow.onHand,
          reserved: batchRow.reserved || 0,
          available: Math.max(0, batchRow.onHand - (batchRow.reserved || 0)),
        };
      } else {
        s = getAdjustableStock(productId, locationId);
      }

      if (reason === "stock_count" && qty > s.onHand) {
        return alert(
          "Counted value is higher than the system balance. Use Check In Stock to increase stock.",
        );
      }

      let reduceQty = 0;
      if (reason === "stock_count") {
        reduceQty = s.onHand - qty;
      } else {
        reduceQty = qty;
      }

      // Guard: nothing to record
      if (reduceQty === 0) {
        state.activeModal = null;
        state.adjustReason = "";
        state.adjustQty = "";
        state.adjustReasonOpen = false;
        state.adjustLocationId = null;
        state.adjustBatchId = null;
        render();
        return;
      }

      // Re-check reservation conflict
      const newBalance = s.onHand - reduceQty;
      if (newBalance < (s.reserved || 0)) {
        return alert(
          "This adjustment would break reservations on this batch. Resolve those orders first.",
        );
      }

      const movementType = {
        stock_count: "stock_count_correction",
        damage: "damage",
        loss: "loss",
        return_to_supplier: "return_to_supplier",
      }[reason];

      if (product.trackingType === "Individual") {
        const candidates = UNITS.filter(
          (u) =>
            u.productId === productId &&
            u.locationId === locationId &&
            u.status === "Available" &&
            !u.softReservedFor,
        ).sort((a, b) => {
          if (a.receivedDate !== b.receivedDate)
            return a.receivedDate < b.receivedDate ? -1 : 1;
          return a.tag < b.tag ? -1 : 1;
        });

        if (candidates.length < reduceQty) {
          return alert(
            `Only ${candidates.length} ${product.unitOfMeasure}(s) can be removed.`,
          );
        }

        const removalDate = todayISO();
        const ref = genNum("ADJ");
        candidates.slice(0, reduceQty).forEach((u) => {
          u.status = "Removed";
          u.removedDate = removalDate;
          u.removedReason = reasonMetaLabel(reason);
          u.removalReference = ref;
        });

        logMovement(
          productId,
          locationId,
          movementType,
          reduceQty,
          ref + (notes ? " · " + notes : ""),
        );
      } else {
        // Stock Quantity: mutate the specific selected batch
        batchRow.onHand -= reduceQty;
        const batch = getBatch(state.adjustBatchId);
        const batchLabel = batch ? `${batch.batchNumber} (${batch.supplier})` : "batch";
        logMovement(
          productId,
          locationId,
          movementType,
          reduceQty,
          `${batchLabel}${notes ? " · " + notes : ""}`,
          null,
          state.adjustBatchId
        );
      }

      // Reset and close
      state.activeModal = null;
      state.adjustReason = "";
      state.adjustQty = "";
      state.adjustReasonOpen = false;
      state.adjustLocationId = null;
      state.adjustBatchId = null;
      render();
    }


    function reasonMetaLabel(reason) {
      return (
        {
          stock_count: "Stock count correction",
          damage: "Damage",
          loss: "Loss / theft",
          return_to_supplier: "Return to supplier",
        }[reason] || reason
      );
    }

    function commitReceiveTransfer() {
      const transfer = TRANSFERS.find((t) => t.id === state.receivingTransferId);
      if (!transfer) return;

      const product = getInvProduct(transfer.productId);
      if (!product) return;

      const isStockQty = product.trackingType === "StockQuantity";

      if (isStockQty) {
        const qtyReceived = parseInt(state.receiveQty, 10) || 0;
        if (qtyReceived < 0) return alert("Quantity cannot be negative.");
        if (qtyReceived > transfer.qty) return alert(`Cannot receive more than the sent quantity (${transfer.qty}).`);

        // If the operator is receiving less than expected, force a confirmation.
        if (qtyReceived < transfer.qty) {
          const shortage = transfer.qty - qtyReceived;
          const ok = confirm(
            `You are receiving ${qtyReceived} of ${transfer.qty} ${product.unitOfMeasure || "unit"}(s).\n\n` +
            `${shortage} ${product.unitOfMeasure || "unit"}(s) will be logged as lost in transit (variance).\n\n` +
            `Continue?`
          );
          if (!ok) return;
        }

        // Find or create the destination stock row for this batch
        let toRow = STOCK.find(
          (s) =>
            s.productId === transfer.productId &&
            s.locationId === transfer.toLocationId &&
            s.batchId === transfer.batchId
        );
        if (toRow) {
          toRow.onHand += qtyReceived;
        } else {
          STOCK.push({
            productId: transfer.productId,
            locationId: transfer.toLocationId,
            batchId: transfer.batchId,
            onHand: qtyReceived,
            reserved: 0,
          });
        }

        const shortage = transfer.qty - qtyReceived;
        const batch = getBatch(transfer.batchId);
        const batchLabel = batch ? `${batch.batchNumber} (${batch.supplier})` : "batch";

        logMovement(
          transfer.productId,
          transfer.toLocationId,
          "transfer_in",
          qtyReceived,
          `${transfer.transferNumber} · ${batchLabel}${shortage > 0 ? ` · SHORTAGE: ${shortage}` : ""}`,
          null,
          transfer.batchId
        );

        if (shortage > 0) {
          logMovement(
            transfer.productId,
            transfer.fromLocationId,
            "loss",
            shortage,
            `${transfer.transferNumber} · ${batchLabel} · Shortage during transit`
          );
        }

        transfer.status = "Received";
        transfer.receivedAt = new Date().toISOString();
        transfer.receivedBy = "You";
        transfer.qtyReceived = qtyReceived;
      } else {
        // Individual items
        const unitsToReceive = state.receiveSelectedUnits || [];
        if (unitsToReceive.length === 0) return alert("Select at least one unit.");

        // If the operator is receiving fewer than expected, force a confirmation.
        if (unitsToReceive.length < transfer.qty) {
          const shortage = transfer.qty - unitsToReceive.length;
          const ok = confirm(
            `You are receiving ${unitsToReceive.length} of ${transfer.qty} unit(s).\n\n` +
            `${shortage} unit(s) will be marked as lost in transit (variance).\n\n` +
            `Continue?`
          );
          if (!ok) return;
        }

        const units = unitsToReceive
          .map((uid) => UNITS.find((u) => u.id === uid))
          .filter(Boolean);

        units.forEach((u) => {
          u.status = "Available";
          u.locationId = transfer.toLocationId;
          u.inTransitTransferId = null;
        });

        // Any units in the transfer but NOT selected are marked as lost in transit
        const missingUnitIds = transfer.unitIds.filter(
          (id) => !unitsToReceive.includes(id)
        );
        missingUnitIds.forEach((uid) => {
          const u = UNITS.find((u) => u.id === uid);
          if (u) {
            u.status = "Removed";
            u.removedReason = "Lost in transit";
            u.removedDate = todayISO();
            u.removalReference = transfer.transferNumber;
            u.inTransitTransferId = null;
          }
        });

        logMovement(
          transfer.productId,
          transfer.toLocationId,
          "transfer_in",
          unitsToReceive.length,
          transfer.transferNumber + (missingUnitIds.length > 0 ? ` · ${missingUnitIds.length} lost in transit` : ""),
          null,
          transfer.batchId
        );

        if (missingUnitIds.length > 0) {
          logMovement(
            transfer.productId,
            transfer.fromLocationId,
            "loss",
            missingUnitIds.length,
            `${transfer.transferNumber} · Units lost in transit`
          );
        }

        transfer.status = "Received";
        transfer.receivedAt = new Date().toISOString();
        transfer.receivedBy = "You";
        transfer.qtyReceived = unitsToReceive.length;
      }

      closeReceiveTransferModal();
    }

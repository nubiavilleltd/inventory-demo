      // Individual item units — each with tag, status, condition, location, received date
      const UNITS = [
        // MacBook Pro (p1) at Main Warehouse (loc2)

      // Stock levels for stock-quantity products per location
      const STOCK = [

        { productId: "p2", locationId: "loc3", onHand: 500, reserved: 0 },
        { productId: "p4", locationId: "loc2", onHand: 12, reserved: 0 },

      ];

      // Stock movement log
      const MOVEMENTS = [];

      // Helper: get a product from the inventory catalogue
      // (we keep the old getProduct for order-related code, but this is for inventory)
      const getInvProduct = (id) => PRODUCTS_INV.find((p) => p.id === id);
      const getLocation = (id) => LOCATIONS.find((l) => l.id === id);

      // Compute stock for any product (Individual or StockQuantity)
      function getStockSummary(productId, locationId) {
        const product = getInvProduct(productId);
        if (!product) return { total: 0, available: 0, reserved: 0, sold: 0 };

        if (product.trackingType === "Individual") {
          const allUnits = UNITS.filter(
            (u) =>
              u.productId === productId &&
              (!locationId || u.locationId === locationId),
          );
          const liveUnits = allUnits.filter((u) => u.status !== "Removed");
          const softReservedUnits = liveUnits.filter(
            (u) => u.status === "Available" && u.softReservedFor,
          );
          return {
            total: liveUnits.length,
            available: liveUnits.filter(
              (u) => u.status === "Available" && !u.softReservedFor,
            ).length,
            reserved:
              liveUnits.filter((u) => u.status === "Reserved").length +
              softReservedUnits.length,
            sold: liveUnits.filter((u) => u.status === "Sold").length,
            removed: allUnits.filter((u) => u.status === "Removed").length,
          };
        } else {
          const rows = STOCK.filter(
            (s) =>
              s.productId === productId &&
              (!locationId || s.locationId === locationId),
          );
          const onHand = rows.reduce((a, r) => a + r.onHand, 0);
          const reserved = rows.reduce((a, r) => a + r.reserved, 0);
          return {
            total: onHand,
            available: onHand - reserved,
            reserved,
            sold: 0, // sold for stock quantity is derived elsewhere
          };
        }
      }

        const product = getInvProduct(productId);
        if (!product) return "Not Stocked";
        const s = getStockSummary(productId, locationId);
        if (s.total === 0) return "Not Stocked";
        if (s.available === 0) return "Out of Stock";
        if (s.available <= (product.minimumStock || 0)) return "Low Stock";
        return "OK";
      }

      // Check if any location has enough stock for a given quantity
      // Returns: { ok: boolean, bestLocation: id, bestAvailable: number, totalAvailable: number }
      function checkStockAvailability(productId, qty) {
        const product = getInvProduct(productId);
        if (!product)
          return {
            ok: false,
            bestLocation: null,
            bestAvailable: 0,
            totalAvailable: 0,
          };

        let bestLocation = null;
        let bestAvailable = 0;
        let totalAvailable = 0;

        LOCATIONS.forEach((loc) => {
          const s = getStockSummary(productId, loc.id);
          totalAvailable += s.available;
          if (s.available > bestAvailable) {
            bestAvailable = s.available;
            bestLocation = loc.id;
          }
        });

        return {
          ok: bestAvailable >= qty,
          bestLocation,
          bestAvailable,
          totalAvailable,
        };
      }

          "Low Stock": "badge-partial",
          "Out of Stock": "badge-cancelled",

      /* ============ HELPERS ============ */

      const money = (n) => "₦" + (n || 0).toLocaleString("en-NG");
      const getProduct = (id) => PRODUCTS_INV.find((p) => p.id === id);
      const getCustomer = (id) => CUSTOMERS.find((c) => c.id === id);
      const todayISO = () => new Date().toISOString().split("T")[0];

      function genNum(prefix) {
        const d = new Date();
        const ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
        return `${prefix}-${ymd}-${String(Math.floor(Math.random() * 999) + 1).padStart(3, "0")}`;
      }

      function calcTotals(order) {
        if (!order?.items)
          return { subtotal: 0, total: 0, paid: 0, outstanding: 0 };
        const subtotal = order.items.reduce(
          (s, i) => s + (getProduct(i.productId)?.price || 0) * i.qty,
          0,
        );

        // Calculate discount
        let discount = 0;
        if (order.discountType === "Fixed") {
          discount = Math.min(order.discountValue || 0, subtotal);
        } else if (order.discountType === "Percentage") {
          discount = Math.round(subtotal * ((order.discountValue || 0) / 100));
        }

        const total = Math.max(0, subtotal - discount);
        const paid = (order.payments || []).reduce((s, p) => s + p.amount, 0);
        const outstanding = Math.max(
          0,
          total - paid - (order.creditApplied || 0),
        );
        return { subtotal, total, paid, outstanding, discount };
      }

      function paymentStatus(order) {
        const { total, paid } = calcTotals(order);
        if (paid >= total && total > 0) return "paid";
        if (paid > 0) return "partial";
        return "unpaid";
      }

      function stateLabel(order) {

          delivered: "Delivered",
        };
        return map[order.state] || "Draft";
      }

      function stateBadge(order) {
        if (!order) return "badge-draft";

      function logTimeline(event) {
        if (state.order)
          state.order.timeline.push({ time: new Date().toISOString(), event });

      // Auto-apply customer credit to an order.
      //   - Applies min(credit, outstanding).
      //   - No deferral, no removal — credit is always consumed.
      //   - Remainder stays on the customer account.
      //   - Logs to the timeline once per application.
      //

      // Never re-applies if the order already has creditApplied set (idempotent
      // until the customer changes; see customerSelect handler).
      function autoApplyCredit(order, customer) {
        if (!order || !customer) return;
        if (order.creditApplied && order.creditApplied > 0) return; // already applied

        const available = customer.credit || 0;
        if (available <= 0) return;

        const t = calcTotals(order);
        const toApply = Math.min(available, t.outstanding);
        if (toApply <= 0) return;

        // Move the credit
        customer.credit = available - toApply;
        order.creditApplied = (order.creditApplied || 0) + toApply;

        // Ensure the customer has an expiry date (set once on first credit issuance)
        if (!customer.creditExpiryDate && customer.credit > 0) {
          const d = new Date();
          d.setDate(d.getDate() + CREDIT_VALIDITY_DAYS);
          customer.creditExpiryDate = d.toISOString().split("T")[0];
        }

        // Mirror the reduced credit back to the master customer list
        const master = getCustomer(customer.id);
        if (master) {
          master.credit = customer.credit;
          master.creditExpiryDate = customer.creditExpiryDate;
        }

        const remaining = customer.credit;
        logTimeline(
          remaining > 0
            ? `Credit applied: ${money(toApply)}. Remaining credit: ${money(remaining)}.`
            : `Credit applied: ${money(toApply)}. Credit fully used.`,
        );
      }

      function isOverdue(order) {
        if (!order.pickupExpiryDate) return false;
        return new Date(order.pickupExpiryDate) < new Date();
      }

      /* ============ INIT ============ */
      function initScenario(key) {
        const s = SCENARIOS[key];
        if (!s) return;

        // Deep-copy the customer so scenario changes don't mutate the master list
        const customer = JSON.parse(JSON.stringify(getCustomer(s.customerId)));
        state.customer = customer;

        // Compute the scheduled date from the offset (defaults to today)
        const scheduledDate = (() => {
          if (!s.scheduledOffsetDays) return todayISO();
          const d = new Date();
          d.setDate(d.getDate() + s.scheduledOffsetDays);
          return d.toISOString().split("T")[0];
        })();

        // Derive timing:
        //   Pickup  → today = Immediate, future = Scheduled
        //   Delivery → always Scheduled
        const derivedTiming =
          s.fulfillment === "Delivery"
            ? "Scheduled"
            : scheduledDate === todayISO()
              ? "Immediate"
              : "Scheduled";

        const order = {
          orderNumber: genNum("ORD"),
          invoiceNumber: null,
          customerId: customer.id,
          fulfillment: s.fulfillment,
          timing: derivedTiming,
          pickupLocation: s.pickupLocation || "VI Store",
          scheduledDate,
          deliveryMode: s.deliveryMode || "Company Fleet",
          items: s.items.map((i) => ({ ...i })),

      /* ============ SUCCESS PAGE ============ */

          documentType: t.outstanding > 0 ? "Invoice" : "Receipt",

        c.innerHTML = `
    <div class="card success-screen">
      <div class="success-icon">✅</div>
      <div class="success-title">${ctx.title}</div>
      <div style="color:#555; margin-bottom:16px;">${ctx.subtitle}</div>

      </div>

      <div style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center;">
        <button class="btn-primary" data-success-channel="print">Print ${doc}</button>
        <button class="btn-primary" data-success-channel="email">Email ${doc}</button>
        <button class="btn-primary" data-success-channel="print+email">Print + Email</button>
        <button data-success-channel="none">No ${doc}</button>
      </div>
    </div>

        document.querySelectorAll("[data-success-channel]").forEach((btn) => {
          btn.addEventListener("click", () =>
            handleSuccessAction(btn.dataset.successChannel),
          );
        });
      }

      function handleSuccessAction(channel) {
        const o = state.order;
        const ctx = state.successContext || {};
        const doc =
          ctx.documentType ||
          (calcTotals(o).outstanding > 0 ? "Invoice" : "Receipt");

        // Log the document delivery
        const channelLabel =
          {
            print: `Print ${doc}`,
            email: `Email ${doc}`,
            "print+email": `Print + Email ${doc}`,
            none: `No ${doc}`,
          }[channel] || channel;
        logTimeline(`Document: ${channelLabel}`);

        // Return to Order Details. Order state and stock were already finalised
        // when the milestone action ran — this screen is purely about delivery.
        state.successContext = null;
        state.currentPage = "order-details";
        render();
      }

      /* ============ HANDLERS: ORDER CREATION ============ */
      function attachOrderCreationHandlers() {
        const o = state.order;
        document
          .getElementById("customerSelect")
          ?.addEventListener("change", (e) => {
            const c = getCustomer(e.target.value);
            if (!c) return;

            // Restore any credit that was applied on behalf of the previous customer
            const prev = state.customer;
            if (prev && prev.id !== c.id && state.order.creditApplied > 0) {
              const prevMaster = getCustomer(prev.id);
              if (prevMaster)
                prevMaster.credit =
                  (prevMaster.credit || 0) + state.order.creditApplied;
              state.order.creditApplied = 0;
            }

            // Fresh customer object (deep copy from master)
            state.customer = JSON.parse(JSON.stringify(c));
            state.order.customerId = state.customer.id;

            // Auto-apply credit for the new customer
            autoApplyCredit(state.order, state.customer);

            render();
          });
        document.querySelectorAll("[data-fulfillment]").forEach((b) =>
          b.addEventListener("click", () => {
            o.fulfillment = b.dataset.fulfillment;

            // Recompute timing on fulfillment change:
            //   Delivery → Scheduled (always)
            //   Pickup   → derive from scheduledDate
            if (o.fulfillment === "Delivery") {
              o.timing = "Scheduled";
            } else {
              o.timing =
                o.scheduledDate === todayISO() ? "Immediate" : "Scheduled";
            }
            render();
          }),
        );
        // Timing is derived from the Scheduled Date (see scheduledDateInput handler below).
        document.querySelectorAll("[data-qty]").forEach((inp) =>
          inp.addEventListener("change", (e) => {
            o.items[+e.target.dataset.qty].qty = Math.max(
              1,
              +e.target.value || 1,
            );
            render();
          }),
        );
        document.querySelectorAll("[data-remove]").forEach((b) =>
          b.addEventListener("click", () => {
            o.items.splice(+b.dataset.remove, 1);
            render();
          }),
        );
        document
          .getElementById("addProductBtn")
          ?.addEventListener("click", () => {
            state.activeModal = "add-product";
            render();
          });
        document
          .getElementById("saveDraftBtn")
          ?.addEventListener("click", () => alert("Saved as draft."));

        // ===== EDIT FLOW =====
        document
          .getElementById("cancelEditBtn")
          ?.addEventListener("click", () => {
            state.isEditing = false;
            state.currentPage = "order-details";
            render();
          });

        document
          .getElementById("saveChangesBtn")
          ?.addEventListener("click", () => {
            const o = state.order;

            // Re-validate stock (same rules as new order)
            const stockResult = validateOrderStock();
            if (stockResult.blocked) {
              alert(stockResult.message);
              return;
            }
            if (stockResult.warning) {
              if (!confirm(stockResult.message + "\n\nProceed anyway?")) return;
            }

            if (o.state === "submitted") {
              // Void the old invoice and generate a new one
              o.invoiceHistory = o.invoiceHistory || [];
              if (o.invoiceNumber) {
                o.invoiceHistory.push({
                  number: o.invoiceNumber,
                  status: "voided",
                  voidedAt: new Date().toISOString(),
                  reason: "Order edited",
                });
              }
              const oldNumber = o.invoiceNumber;
              o.invoiceNumber = genNum("INV");
              logTimeline(
                `Order edited. Invoice ${oldNumber} voided. New invoice ${o.invoiceNumber} issued.`,
              );
            } else {
              logTimeline("Draft updated.");
            }

            state.isEditing = false;
            state.currentPage = "order-details";
            render();
          });
        document
          .getElementById("submitOrderBtn")
          ?.addEventListener("click", () => submitOrder(false));
        document
          .getElementById("submitPayBtn")
          ?.addEventListener("click", () => submitOrder(true));
        document
          .getElementById("markCollectedBtn")
          ?.addEventListener("click", () => {
            state.currentPage = "success";
            render();
          });
        document
          .getElementById("viewDetailsBtn")
          ?.addEventListener("click", () => {
            state.currentPage = "order-details";
            render();
          });
        document
          .getElementById("createCustomerBtn")
          ?.addEventListener("click", () => {
            state.activeModal = "create-customer";
            render();
          });
        document
          .getElementById("deliveryModeSelect")
          ?.addEventListener("change", (e) => {
            state.order.deliveryMode = e.target.value;
            render();
          });

        // Delivery address selector
        document
          .getElementById("deliveryAddressSelect")
          ?.addEventListener("change", (e) => {
            state.order.deliveryAddressId = e.target.value;
          });

        // Add new address
        document
          .getElementById("addAddressBtn")
          ?.addEventListener("click", () => {
            state.activeModal = "add-address";
            render();
          });

        // Pickup Location
        document
          .getElementById("pickupLocationSelect")
          ?.addEventListener("change", (e) => {
            state.order.pickupLocation = e.target.value;
            logTimeline(`Pickup location set to ${e.target.value}`);
            render(); // ← re-render so stock badges update
          });
        // Scheduled Date — drives the derived timing
        document
          .getElementById("scheduledDateInput")
          ?.addEventListener("change", (e) => {
            state.order.scheduledDate = e.target.value;

            // Derive timing:
            //   Pickup  → today = Immediate, future = Scheduled
            //   Delivery → always Scheduled
            if (state.order.fulfillment === "Delivery") {
              state.order.timing = "Scheduled";
            } else {
              state.order.timing =
                state.order.scheduledDate === todayISO()
                  ? "Immediate"
                  : "Scheduled";
            }
            render();
          });

        // Due Date
        document
          .getElementById("dueDateInput")
          ?.addEventListener("change", (e) => {
            state.order.dueDate = e.target.value;
            render();
          });
        // Edit current address
        document
          .getElementById("editAddressBtn")
          ?.addEventListener("click", () => {
            const selectedId = document.getElementById(
              "deliveryAddressSelect",
            )?.value;
            if (!selectedId) return;
            state.editingAddressId = selectedId;
            state.activeModal = "edit-address";
            render();
          });
        // (applyCreditBtn and undo-credit handlers removed — credit is auto-applied and non-removable.)

        // Discount handlers
        document
          .getElementById("discountTypeSelect")
          ?.addEventListener("change", (e) => {
            state.order.discountType = e.target.value;
            if (e.target.value === "None") {
              state.order.discountValue = 0;
            }
            render();
          });
        document
          .getElementById("discountValueInput")
          ?.addEventListener("input", (e) => {
            state.order.discountValue = +e.target.value || 0;
            render();
          });
      }
      /* ============ HANDLERS: ORDER DETAILS ============ */
      function attachOrderDetailsHandlers() {
        document
          .getElementById("recordPaymentBtn")
          ?.addEventListener("click", () => {
            state.activeModal = "payment";
            render();
          });
        // Edit Order
        document
          .getElementById("editOrderBtn")
          ?.addEventListener("click", () => {
            state.isEditing = true;
            state.currentPage = "order-creation";
            render();
          });

        // Mark Ready for Pickup
        document
          .getElementById("markReadyBtn")
          ?.addEventListener("click", () => {
            const o = state.order;

            // Reserve stock at the pickup location
            reserveStockForPickup(o);

            o.state = "ready";

            // Set pickup expiry: today + 3 days

      /* ============ SUBMIT ORDER ============ */
      function submitOrder(recordPayment) {
        const o = state.order;
        if (!o.items.length) {
          alert("Add at least one product.");
          return;
        }

        // ===== STOCK CHECK =====
        const stockResult = validateOrderStock();
        if (stockResult.blocked) {
          alert(stockResult.message);
          return;
        }
        if (stockResult.warning) {
          const proceed = confirm(stockResult.message + "\n\nProceed anyway?");
          if (!proceed) return;
        }

        // Continue with submission
        o.invoiceDate = todayISO();

        // Due date = invoice date + standard payment terms.
        const dueDate = new Date();
        dueDate.setDate(dueDate.getDate() + DEFAULT_PAYMENT_TERMS_DAYS);
        o.dueDate = dueDate.toISOString().split("T")[0];

        o.invoiceNumber = genNum("INV");
        logTimeline(
          `Invoice ${o.invoiceNumber} generated (Due: ${formatDate(o.dueDate)})`,
        );

        const t = calcTotals(o);

        // If credit fully covers the order, treat as paid
        if (t.outstanding === 0 && o.creditApplied > 0) {
          if (o.fulfillment === "Delivery") {
            applySoftReservation(o);
          }
          o.state = "confirmed";
          logTimeline("Order submitted (paid via credit)");

          const isWalkin =
            o.timing === "Immediate" && o.fulfillment === "Pickup";

          // Walk-in Immediate: no reservation step happens. Deduct stock now.
          if (isWalkin) {
            deductStockDirectlyForPickup(o);
          }

          state.successContext = {
            title: isWalkin ? "Order Completed" : "Payment Recorded",
            subtitle: `${o.orderNumber} · Covered by credit`,
            documentType: "Receipt",
            isWalkin,
          };
          state.currentPage = "success";
          render();
          return;
        }

        if (!recordPayment) {
          o.state = "submitted";
          logTimeline("Order submitted (unpaid)");
          state.successContext = {
            title: "Order Submitted",
            subtitle: `${o.orderNumber} · Invoice generated`,
            documentType: "Invoice",
            isWalkin: false,
          };
          state.currentPage = "success";
          render();
        } else {
          state.activeModal = "payment";
          render();
        }
      }

      // ===== STOCK VALIDATION =====
      // Returns: { blocked: bool, warning: bool, message: string }
      function validateOrderStock() {
        const o = state.order;

        // For Pickup Immediate → Hard Block if any item has insufficient stock at the pickup location
        if (o.fulfillment === "Pickup" && o.timing === "Immediate") {
          const locationId =
            LOCATIONS.find((l) => l.name === o.pickupLocation)?.id || "loc2";
          const shortfalls = [];

          o.items.forEach((i) => {
            const product = getInvProduct(i.productId);
            const s = getStockSummary(i.productId, locationId);
            if (s.available < i.qty) {
              shortfalls.push(
                `${product.name}: needs ${i.qty}, only ${s.available} available at ${o.pickupLocation}`,
              );
            }
          });

          if (shortfalls.length > 0) {
            return {
              blocked: true,
              warning: false,
              message: `Cannot submit this order — insufficient stock for immediate pickup:\n\n${shortfalls.join("\n")}`,
            };
          }
        }

        // For Pickup Scheduled → Soft Warning if any item has insufficient stock at the pickup location
        if (o.fulfillment === "Pickup" && o.timing === "Scheduled") {
          const locationId =
            LOCATIONS.find((l) => l.name === o.pickupLocation)?.id || "loc2";
          const shortfalls = [];

          o.items.forEach((i) => {
            const product = getInvProduct(i.productId);
            const s = getStockSummary(i.productId, locationId);
            if (s.available < i.qty) {
              shortfalls.push(
                `${product.name}: needs ${i.qty}, only ${s.available} at ${o.pickupLocation}`,
              );
            }
          });

          if (shortfalls.length > 0) {
            return {
              blocked: false,
              warning: true,
              message: `Warning — some items have insufficient stock at the pickup location:\n\n${shortfalls.join("\n")}\n\nYou can restock before the pickup date.`,
            };
          }
        }

        // For Delivery → Soft Warning if no single location has enough stock
        if (o.fulfillment === "Delivery") {
          const shortfalls = [];

          o.items.forEach((i) => {
            const product = getInvProduct(i.productId);
            const check = checkStockAvailability(i.productId, i.qty);
            if (!check.ok) {
              if (check.totalAvailable > 0) {
                shortfalls.push(
                  `${product.name}: needs ${i.qty}, only ${check.bestAvailable} at any single location. Total across locations: ${check.totalAvailable}`,
                );
              } else {
                shortfalls.push(
                  `${product.name}: needs ${i.qty}, out of stock at all locations`,
                );
              }
            }
          });

          if (shortfalls.length > 0) {
            return {
              blocked: false,
              warning: true,
              message: `Warning — some items may not be fulfillable from a single location:\n\n${shortfalls.join("\n")}\n\nYou can restock before dispatch.`,
            };
          }
        }

        return { blocked: false, warning: false, message: "" };
      }

      /* ============ RECORD PAYMENT ============ */
      function recordPayment() {
        const o = state.order,
          cust = state.customer;
        const amount = +document.getElementById("payAmount").value;
        const method = document.getElementById("payMethod").value;
        const date = document.getElementById("payDate").value;
        const ref = document.getElementById("payRef")?.value || genNum("CASH");

        if (!amount || amount <= 0) return alert("Enter valid amount.");
        if (!method) return alert("Select payment method.");

        const t = calcTotals(o);
        let creditCreated = 0,
          appliedAmount = amount;
        if (amount > t.outstanding) {
          creditCreated = amount - t.outstanding;
          appliedAmount = t.outstanding;
        }

        o.payments.push({
          id: "pay-" + Date.now(),
          date,
          amount: appliedAmount,
          method,
          reference: ref,
          receiptNumber: genNum("RCT"),
          status: "recorded",
        });
        logTimeline(`Payment: ${money(appliedAmount)} via ${method}`);

        if (creditCreated > 0) {
        cust.credit += creditCreated;
        const d = new Date();
        d.setDate(d.getDate() + CREDIT_VALIDITY_DAYS);
        cust.creditExpiryDate = d.toISOString().split('T')[0];
        const master = getCustomer(cust.id);
        if (master) {
          master.credit = cust.credit;
          master.creditExpiryDate = cust.creditExpiryDate;
        }
        logTimeline(`Overpayment ${money(creditCreated)} → Credit. Expires ${formatDate(cust.creditExpiryDate)}.`);
      }
        if (!o.invoiceNumber) o.invoiceNumber = genNum("INV");

        // Soft-reserve stock if this payment pushes the order to paid
        // (Pickup orders reserve stock later, at "Mark as Ready for Pickup".)
        const newT = calcTotals(o);
        const wasNotPaid = o.state !== "confirmed";

        if (
          newT.outstanding <= 0 &&
          wasNotPaid &&
          o.fulfillment === "Delivery"
        ) {
          applySoftReservation(o);
        }

        o.state = newT.outstanding <= 0 ? "confirmed" : "partial";
        logTimeline(`State: ${stateLabel(o)}`);

        state.activeModal = null;

        // Determine which milestone we just hit
        const isWalkin =
          o.state === "confirmed" &&
          o.timing === "Immediate" &&
          o.fulfillment === "Pickup";

        if (isWalkin) {
          // Walk-in Immediate Pickup: the customer is at the counter.
          // Instead of auto-completing, open the collection modal so the
          // operator confirms which units are being handed over.
          state.collectionSelections = {};
          state.collectionUnitSearch = '';
          state.collectionChangingUnitsFor = null;
          state.activeModal = 'picked-up-by';
          render();
          return;
        } else {
          state.successContext = {
            title: 'Payment Recorded',
            subtitle: `${o.orderNumber} · ${money(appliedAmount)} received`,
            documentType: 'Receipt',
            isWalkin: false,
          };
          state.currentPage = 'success';
          render();
        }
      }

      /* ============ CANCEL MODAL ============ */
         function renderCancelModal() {
      const o = state.order;
      const cust = state.customer;
      const t = calcTotals(o);

      // Cash paid + credit consumed — the total that will be returned as credit.
      const cashPaid = t.paid;
      const creditConsumed = o.creditApplied || 0;
      const totalReturned = cashPaid + creditConsumed;

      // State-specific warning
      let stateWarning = '';
      if (o.state === 'ready') {
        stateWarning = `
          <div style="padding:8px; border:2px dashed #991b1b; border-radius:4px; font-size:12px; color:#991b1b; margin-top:12px;">
            ⚠ This order has stock reserved for pickup at <strong>${o.pickupLocation}</strong>.
            Cancelling will release that stock back to inventory.
          </div>`;
      } else if (o.state === 'out-for-delivery') {
        const dispatchInfo = o.dispatchInfo || {};
        const tripLabel = o.deliveryMode === 'Company Fleet'
          ? `${dispatchInfo.driver || '—'} / ${dispatchInfo.vehicle || '—'}`
          : `${dispatchInfo.courier || '—'} (${dispatchInfo.trackingNumber || '—'})`;
        stateWarning = `
          <div style="padding:8px; border:2px dashed #991b1b; border-radius:4px; font-size:12px; color:#991b1b; margin-top:12px;">
            ⚠ This order is out for delivery (${tripLabel}).
            Cancelling will release the reserved stock and free the driver/vehicle.
            The customer should be told the delivery has been called off.
          </div>`;
      } else if (o.state === 'partial') {
        stateWarning = `
          <div style="padding:8px; border:2px dashed #92400e; border-radius:4px; font-size:12px; color:#92400e; margin-top:12px;">
            This order has a partial payment. The amount paid will be returned as store credit.
          </div>`;
      }

      // Credit return summary
      let creditReturn = '';
      if (totalReturned > 0) {
        const parts = [];
        if (cashPaid > 0) parts.push(`${money(cashPaid)} cash`);
        if (creditConsumed > 0) parts.push(`${money(creditConsumed)} credit`);
        creditReturn = `
          <div class="credit-card mt-12">
            <div class="credit-card-label">Credit to be created (${parts.join(' + ')})</div>
            <div class="credit-card-value">${money(totalReturned)}</div>
            <div style="font-size:11px; color:#166534; margin-top:4px;">
              Fresh ${CREDIT_VALIDITY_DAYS}-day expiry applied.
            </div>

      }

      return `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-header">Cancel Order <button class="close-x" onclick="closeModal()">×</button></div>
        <div class="modal-body">
          <p>Cancel <strong>${o.orderNumber}</strong>?</p>
          ${stateWarning}
          ${creditReturn}

            <option value="">Select reason</option>

          <button class="btn-danger" id="confirmCancelBtn">Confirm Cancellation</button>
        </div>

    </div>
  `;
    }


        function attachCancelHandlers() {
      document.getElementById('confirmCancelBtn')?.addEventListener('click', () => {
        const reason = document.getElementById('cancelReason').value;
        if (!reason) return alert('Select a reason.');

        const o = state.order, cust = state.customer;
        const t = calcTotals(o);

        // -------- 1. Money: cash paid + credit consumed → fresh credit --------
        const cashPaid = t.paid;
        const creditConsumed = o.creditApplied || 0;
        const totalReturned = cashPaid + creditConsumed;

        if (totalReturned > 0) {
          cust.credit += totalReturned;

          // Always reset expiry on new credit issuance (fresh 60-day window).
          const d = new Date();
          d.setDate(d.getDate() + CREDIT_VALIDITY_DAYS);
          cust.creditExpiryDate = d.toISOString().split('T')[0];

          // Mirror to master
          const master = getCustomer(cust.id);
          if (master) {
            master.credit = cust.credit;
            master.creditExpiryDate = cust.creditExpiryDate;
          }

          const parts = [];
          if (cashPaid > 0) parts.push(`${money(cashPaid)} cash`);
          if (creditConsumed > 0) parts.push(`${money(creditConsumed)} credit`);
          logTimeline(`Cancelled (${reason}). Credit ${money(totalReturned)} issued (${parts.join(' + ')}). Expires ${formatDate(cust.creditExpiryDate)}.`);
        } else {
          logTimeline(`Cancelled (${reason}). No payment to return.`);
        }

        // -------- 2. Stock: release reservations per state --------
        if (o.softReservation) {
          releaseSoftReservation(o);
        }
        if (o.state === 'ready') {
          releasePickupReservation(o);
        }
        if (o.state === 'out-for-delivery') {
          releaseDeliveryReservation(o);
        }

        // -------- 3. Move to Cancelled --------
        o.state = 'cancelled';
        state.activeModal = null;
        render();
      });
    }

      function updateAddProductStockInfo() {

          return;

        if (o.fulfillment === "Pickup") {
          // Pickup: check stock at the specific pickup location

          const locName = loc?.name || "?";

            status = `⚠ Only ${s.available} at ${locName}. You requested ${qty}.`;

            cls = "green";
          } else if (total > 0) {
            status = `⚠ Only ${best} at one location, ${total} across all locations. No single location has ${qty}.`;
            cls = "red";
          } else {
            status = `✗ Out of stock at all locations.`;
            cls = "red";
          }

        function openCollectionChangeUnits(productId) {

    function toggleCollectionUnit(productId, unitId, maxQty) {
      let selected = state.collectionSelections[productId] || [];
      if (selected.includes(unitId)) {
        selected = selected.filter(id => id !== unitId);
      } else {
        if (selected.length >= maxQty) {
          alert(`You can select up to ${maxQty} units. Deselect one first.`);
          return;
        }
        selected.push(unitId);
      }
      state.collectionSelections[productId] = selected;
      render();
    }

    function confirmCollectionChangeUnits() {
      const productId = state.collectionChangingUnitsFor;
      const item = state.order.items.find(i => i.productId === productId);
      const selected = state.collectionSelections[productId] || [];
      if (selected.length !== item.qty) {
        return alert(`Select exactly ${item.qty} units.`);
      }
      state.collectionChangingUnitsFor = null;
      render();
    }

      const pickupLoc = LOCATIONS.find(l => l.name === o.pickupLocation)?.id;

      if (Object.keys(state.collectionSelections).length === 0) {
        o.items.forEach(item => {
          const product = getInvProduct(item.productId);
          if (!product) return;
          if (product.trackingType === 'Individual') {
            // Reserved units for this order first (Scheduled Pickup path)
            let candidates = UNITS.filter(u =>
              u.productId === item.productId &&
              u.locationId === pickupLoc &&
              u.status === 'Reserved' &&
              u.reservedForOrder === o.orderNumber
            );
            // Fallback: Available units (Immediate Pickup path — no reservation yet)
            if (candidates.length === 0) {
              candidates = UNITS.filter(u =>
                u.productId === item.productId &&
                u.locationId === pickupLoc &&
                u.status === 'Available'
              ).slice(0, item.qty);
            }
            state.collectionSelections[item.productId] = candidates.slice(0, item.qty).map(u => u.id);
          }
        });
      }

            // If we're in Change Units drill-in mode, render that instead
      if (state.collectionChangingUnitsFor) {
        return renderCollectionChangeUnitsView();

      let allSatisfied = true;
      const shortfalls = [];

      o.items.forEach(item => {

        if (!product) return;

        if (product.trackingType === 'Individual') {
          const selected = state.collectionSelections[item.productId] || [];
          if (selected.length !== item.qty) {
            allSatisfied = false;
            const atLoc = UNITS.filter(u =>
              u.productId === item.productId &&

            ).length;
            shortfalls.push(`${product.name}: ${selected.length} of ${item.qty} selected (${atLoc} available at ${o.pickupLocation})`);
          }
        } else {
          const s = getStockSummary(item.productId, pickupLoc);
          const availableHere = s.available + (s.reserved || 0);

          function attachPickedUpByHandlers() {
                document.getElementById('confirmPickupBtn')?.addEventListener('click', () => {
        const o0 = state.order;
        const isImmediate = (o0.timing === 'Immediate');
        const name = document.getElementById('pickupName').value.trim();
        const phone = document.getElementById('pickupPhone').value.trim();
        const orderRefVerified = isImmediate ? true : document.getElementById('pickupOrderRefVerified')?.checked === true;
        const idPresented = isImmediate ? false : document.getElementById('pickupIdPresented')?.checked === true;

        if (!name) return alert('Enter who is picking up.');
        if (!isImmediate && !orderRefVerified) return alert('Confirm that the order reference has been verified.');

        const o = state.order;

        // -------- 1. Apply the operator's selections to stock --------
        const pickupLoc = LOCATIONS.find(l => l.name === o.pickupLocation)?.id;

        o.items.forEach(item => {
          const product = getInvProduct(item.productId);
          if (!product) return;

          if (product.trackingType === 'Individual') {
            const selectedIds = state.collectionSelections[item.productId] || [];
            const originallyReserved = UNITS.filter(u =>
              u.reservedForOrder === o.orderNumber && u.status === 'Reserved'
            );

            // Units originally reserved for this order but NOT chosen now → release to Available
            originallyReserved.forEach(u => {
              if (!selectedIds.includes(u.id)) {
                u.status = 'Available';
                u.reservedForOrder = null;
              }
            });

            // Chosen units → Sold
            selectedIds.forEach(uid => {
              const u = UNITS.find(x => x.id === uid);
              if (!u) return;
              u.status = 'Sold';
              u.reservedForOrder = null;
              u.softReservedFor = null;
            });

            logMovement(item.productId, pickupLoc, 'check_out', selectedIds.length, o.orderNumber);
          } else {
            // Stock quantity: decrement reserved (if any) and onHand
            let remaining = item.qty;

            STOCK
              .filter(s => s.productId === item.productId && (!pickupLoc || s.locationId === pickupLoc))
              .forEach(row => {
                if (remaining <= 0) return;
                // Prefer decrementing reserved first (Scheduled Pickup path)
                if (row.reserved > 0) {
                  const fromReserved = Math.min(row.reserved, remaining);
                  row.reserved -= fromReserved;
                  row.onHand -= fromReserved;
                  remaining -= fromReserved;
                } else if (row.onHand > 0) {
                  const fromOnHand = Math.min(row.onHand, remaining);
                  row.onHand -= fromOnHand;
                  remaining -= fromOnHand;
                }
              });

            logMovement(item.productId, pickupLoc, 'check_out', item.qty, o.orderNumber);
          }
        });

        // -------- 2. Record the picked-up-by info --------
                // -------- 2. Record the picked-up-by info --------
        o.pickedUpBy = { name, phone, orderRefVerified, idPresented };
        o.state = 'collected';

        // Log with verification detail
        const logParts = [`Collected by ${name}`];
        if (!isImmediate) {
          logParts.push(orderRefVerified ? 'Order reference verified' : 'Order reference NOT verified');
          if (idPresented) logParts.push('Photo ID presented');
        }
        logTimeline(logParts.join(' · '));

        // -------- 3. Complete the order --------
        o.state = 'completed';
        logTimeline('Order completed.');

        // -------- 4. Clear working state and show success screen --------
        state.collectionSelections = {};
        state.collectionUnitSearch = '';
        state.collectionChangingUnitsFor = null;
        state.activeModal = null;

        const isWalkin = (o.timing === 'Immediate' && o.fulfillment === 'Pickup');
        state.successContext = {
          title: isWalkin ? 'Order Completed' : 'Order Collected',
          subtitle: isWalkin
            ? `${o.orderNumber} · Handover confirmed`
            : `${o.orderNumber} · Thank you`,
          documentType: 'Receipt',
          isWalkin: false, // stock has already been deducted during collection
        };
        state.currentPage = 'success';
        render();

        const product = getInvProduct(productId);
        const item = o.items.find((i) => i.productId === productId);

        const selected = w.unitSelections[productId] || [];

        // Get all units for this product at the dispatch location
        const unitsAtLocation = UNITS.filter(

            u.productId === productId &&
            u.locationId === w.dispatchLocationId &&
            u.status === "Available" &&
            (!u.softReservedFor || u.softReservedFor === o.orderNumber),
        ).sort((a, b) => {
          if (a.receivedDate !== b.receivedDate)
            return a.receivedDate < b.receivedDate ? -1 : 1;
          return a.tag < b.tag ? -1 : 1;

        // Filter by search term

      /* ============================================================
DISPATCH WIZARD HANDLERS
============================================================ */

    function closeDispatchWizard() {
        state.activeModal = null;
        state.dispatchWizard.changingUnitsFor = null;
        state.dispatchReturnTo = "order-details";
        render();
      }

      function dispatchWizardNext() {
        const w = state.dispatchWizard;
        const o = state.order;

        if (w.step === 1) {
          // Validate Step 1
          if (o.deliveryMode === "Company Fleet") {
            if (!w.driver) return alert("Select a driver.");
            if (!w.vehicle) return alert("Select a vehicle.");
          } else {
            if (!w.courier) return alert("Select a courier.");
            if (!w.trackingNumber || !w.trackingNumber.trim())
              return alert("Enter tracking number.");
          }
          if (!w.dispatchDate) return alert("Select dispatch date.");

          w.step = 2;
          render();
        } else if (w.step === 2) {
          // Validate Step 2 — all items assigned
          for (const item of o.items) {
            const p = getInvProduct(item.productId);
            if (!p) continue;

            if (p.trackingType === "Individual") {
              const selected = w.unitSelections[item.productId] || [];
              if (selected.length !== item.qty) {
                return alert(`Select exactly ${item.qty} units for ${p.name}.`);
              }
            } else {
              const s = getStockSummary(item.productId, w.dispatchLocationId);
              if (s.available < item.qty) {
                return alert(
                  `Not enough stock for ${p.name} at ${getLocation(w.dispatchLocationId)?.name}. Available: ${s.available}, Need: ${item.qty}.`,
                );
              }
            }
          }

          w.step = 3;
          render();
        }
      }

      function dispatchWizardBack() {
        const w = state.dispatchWizard;
        if (w.step > 1) w.step--;
        if (w.changingUnitsFor) w.changingUnitsFor = null;
        render();
      }

      function onDispatchLocationChange(locationId) {
        // Warn operator if the location change will reset their auto-picks
        const w = state.dispatchWizard;
        const hasCustomPicks = Object.values(w.unitSelections).some(
          (arr) => arr && arr.length > 0,
        );
        if (hasCustomPicks) {
          if (
            !confirm(
              "Changing the location will reset your unit selections. Continue?",
            )
          ) {
            render(); // re-render to restore dropdown value
            return;
          }
        }
        resetAutoPicksForLocation(locationId);
        render();
      }

      function openChangeUnits(productId) {
        state.dispatchWizard.changingUnitsFor = productId;
        state.dispatchWizard.unitSearch = "";
        render();
      }

      function closeChangeUnits() {
        state.dispatchWizard.changingUnitsFor = null;
        render();
      }

      function toggleUnitSelection(productId, unitId, maxQty) {
        const w = state.dispatchWizard;
        let selected = w.unitSelections[productId] || [];
        if (selected.includes(unitId)) {
          selected = selected.filter((id) => id !== unitId);
        } else {
          if (selected.length >= maxQty) {
            alert(`You can select up to ${maxQty} units. Deselect one first.`);
            render();
            return;
          }
          selected.push(unitId);
        }
        w.unitSelections[productId] = selected;
        render();
      }

      function confirmChangeUnits() {
        const productId = state.dispatchWizard.changingUnitsFor;
        const item = state.order.items.find((i) => i.productId === productId);
        const selected = state.dispatchWizard.unitSelections[productId] || [];
        if (selected.length !== item.qty) {
          return alert(`Select exactly ${item.qty} units.`);
        }
        state.dispatchWizard.changingUnitsFor = null;
        render();
      }

      function attachDispatchWizardHandlers() {
        // Handlers are inlined via onchange/onclick attributes, so nothing to wire up here.
      }

      function confirmDispatch() {
        const o = state.order;
        const w = state.dispatchWizard;

        // 1. Build dispatchInfo
        const dispatchDate = w.dispatchDate || todayISO();
        if (o.deliveryMode === "Company Fleet") {
          o.dispatchInfo = {
            driver: w.driver,
            vehicle: w.vehicle,
            dispatchDate,
            notes: w.dispatchNotes || "",
          };
          logTimeline(
            `Dispatched via Fleet — Driver: ${w.driver}, Vehicle: ${w.vehicle}`,
          );
        } else {
          o.dispatchInfo = {
            courier: w.courier,
            trackingNumber: w.trackingNumber,
            dispatchDate,
            notes: w.dispatchNotes || "",
          };
          logTimeline(
            `Dispatched via ${w.courier} — Tracking: ${w.trackingNumber}`,
          );
        }

        // 2. Flip selected units to Reserved
        o.items.forEach((item) => {
          const p = getInvProduct(item.productId);
          if (!p) return;

          if (p.trackingType === "Individual") {
            const selectedUnitIds = w.unitSelections[item.productId] || [];
            selectedUnitIds.forEach((uid) => {
              const unit = UNITS.find((u) => u.id === uid);
              if (unit) {
                unit.status = "Reserved";
                unit.softReservedFor = null; // clear soft-reservation marker
                unit.reservedForOrder = o.orderNumber;
              }
            });
            logMovement(
              item.productId,
              w.dispatchLocationId,
              "reservation",
              item.qty,
              o.orderNumber,
            );
          } else {
            // Stock quantity: increment reserved on the stock row
            let row = STOCK.find(
              (s) =>
                s.productId === item.productId &&
                s.locationId === w.dispatchLocationId,
            );
            if (row) {
              row.reserved = (row.reserved || 0) + item.qty;
            }
            logMovement(
              item.productId,
              w.dispatchLocationId,
              "reservation",
              item.qty,
              o.orderNumber,
            );
          }
        });

        // 3. Clear soft reservation record on the order (it's now hard-reserved)
        o.softReservation = null;

        // 4. Move order to Out for Delivery
        o.state = "out-for-delivery";
        logTimeline("Order status: Out for Delivery");

        // 5. Close wizard and return to the appropriate view
        state.activeModal = null;
        state.dispatchWizard = {
          step: 1,
          driver: "",
          vehicle: "",
          courier: "",
          trackingNumber: "",
          dispatchDate: null,
          dispatchNotes: "",
          dispatchLocationId: null,
          changingUnitsFor: null,
          unitSelections: {},
        };

        const returnTo = state.dispatchReturnTo || "order-details";
        state.dispatchReturnTo = "order-details";

        if (returnTo === "dashboard") {
          const dispatchedNumber = state.order.orderNumber;

          // Clear any checkbox selection carried over.
          state.order._selected = false;

          // Remove from pool
          state.dispatchPool = state.dispatchPool.filter(
            (o) => o.orderNumber !== dispatchedNumber,
          );

          // Add to in-transit if not already there
          if (
            !state.inTransitOrders.find(
              (x) => x.orderNumber === dispatchedNumber,
            )
          ) {
            state.inTransitOrders.push(state.order);
          }

          // Ensure the Dispatch tab shows the Dashboard
          state.activeTab = "dispatch";
          state.dispatchView = "dashboard";
        } else {
          state.currentPage = "order-details";
        }
        render();
      }

INVENTORY LIST PAGE

      function renderInventoryList(c) {

          if (status === "Low Stock") lowStock++;
          else if (status === "Out of Stock") outOfStock++;
          else if (status === "Not Stocked") notStocked++;
        });
        const movements24h = MOVEMENTS.length;

        // Apply filters
        const f = state.inventoryFilter;

      function renderReceivePreview(productId) {
        const product = getInvProduct(productId);
        if (!product) return;
        const locationId =
          document.getElementById("receiveLocation")?.value || "loc2";
        const s = getStockSummary(productId, locationId);
        const unitLabel = product.unitOfMeasure || "unit";

        document.getElementById("receiveUnitLabel").textContent =
          `Unit: ${unitLabel}`;
        document.getElementById("receivePreview").innerHTML = `
              <div style="font-size:12px; color:#555; padding:8px; border:1px dashed #999; border-radius:4px;">
                Current stock at ${getLocation(locationId)?.name}: <strong>${s.total}</strong> ${unitLabel}(s)
                (Available: ${s.available})
              </div>
            `;
      }

      function attachReceiveStockHandlers() {
        // Populate preview on open
        renderReceivePreview(document.getElementById("receiveProductId").value);

        document
          .getElementById("receiveLocation")
          ?.addEventListener("change", () => {
            renderReceivePreview(
              document.getElementById("receiveProductId").value,
            );
          });

        // Update condition visibility based on product tracking type
        document
          .getElementById("receiveProduct")
          ?.addEventListener("change", () => {
            const pid = document.getElementById("receiveProductId").value;
            const prod = getInvProduct(pid);
            const wrap = document.getElementById("conditionWrap");
            if (wrap)
              wrap.style.display =
                prod?.trackingType === "Individual" ? "block" : "none";
          });

        document
          .getElementById("confirmReceiveBtn")
          ?.addEventListener("click", () => {
            const productId = document.getElementById("receiveProductId").value;
            const locationId = document.getElementById("receiveLocation").value;
            const qty = parseInt(
              document.getElementById("receiveQty").value,
              10,
            );
            const receivedDate = document.getElementById("receiveDate").value;
            const notes = document.getElementById("receiveNotes").value.trim();
            const condition =
              document.getElementById("receiveCondition")?.value || "New";

            if (!productId) return alert("Select a product.");
            if (!locationId) return alert("Select a location.");
            if (!qty || qty <= 0) return alert("Enter a valid quantity.");

            const product = getInvProduct(productId);

            if (product.trackingType === "Individual") {
              // Create individual units with auto-generated tags
              const prefix = product.tagPrefix || product.sku.split("-")[0];
              const ymd = receivedDate.replace(/-/g, "");
              const existing = UNITS.filter((u) =>
                u.tag.startsWith(prefix + "-" + ymd),
              );
              let nextSeq = existing.length + 1;

              for (let i = 0; i < qty; i++) {
                const seqStr = String(nextSeq + i).padStart(3, "0");
                UNITS.push({
                  id: "u-" + Date.now() + "-" + i,
                  productId,
                  tag: `${prefix}-${ymd}-${seqStr}`,
                  status: "Available",
                  condition: condition,
                  locationId,
                  receivedDate,
                });
              }
              logMovement(
                productId,
                locationId,
                "check_in",
                qty,
                notes || null,
              );
            } else {
              // Stock quantity — find or create row
              let row = STOCK.find(
                (s) => s.productId === productId && s.locationId === locationId,
              );
              if (row) {
                row.onHand += qty;
              } else {
                STOCK.push({ productId, locationId, onHand: qty, reserved: 0 });
              }
              logMovement(
                productId,
                locationId,
                "check_in",
                qty,
                notes || null,
              );
            }

            state.activeModal = null;
            render();
          });
      }

      

            /* ============================================================
       COMBOBOX
       A text input with a dropdown list. Typing filters the list.
       Free text is accepted as a custom value (used by Category
       and Unit of Measure in product setup).
       ============================================================ */

    // Render a combobox.
    //   id          — the input's DOM id (also used as the state key)
    //   options     — array of strings (suggestions)
    //   value       — current value (string)
    //   placeholder — placeholder text for the input
    function renderCombobox(id, options, value, placeholder) {
      const isOpen = state.openCombobox === id;
      const typed = value || '';
      const query = typed.toLowerCase();
      // Filter: show options that contain the typed text (or all if nothing typed)
      const filtered = options.filter(o =>
        !query || o.toLowerCase().includes(query)
      );
      // Has the operator typed something that doesn't exactly match an option?
      const exactMatch = options.some(o => o.toLowerCase() === query);
      const showCreate = typed.length > 0 && !exactMatch;

      return `
        <div class="combobox" data-combobox="${id}">
          <div class="combobox-input" onclick="openCombobox('${id}')">
            <input type="text"
              id="${id}"
              value="${value || ''}"
              placeholder="${placeholder}"
              autocomplete="off"
              onfocus="openCombobox('${id}')"
              oninput="onComboboxInput('${id}')"
              onkeydown="onComboboxKeydown(event, '${id}')"
              onblur="onComboboxBlur(event, '${id}')">
            <div class="combobox-caret" onclick="toggleCombobox('${id}', event)">▼</div>
          </div>
          ${isOpen ? `
            <div class="combobox-panel">
              ${filtered.length === 0 && !showCreate
                ? `<div class="combobox-empty">No matches. Type a value to use it.</div>`
                : ''}
              ${filtered.map((o, idx) => `
                <div class="combobox-item ${state.comboboxActive === idx ? 'active' : ''}"
                  onmousedown="selectComboboxValue('${id}', ${JSON.stringify(o).replace(/"/g, '&quot;')})">
                  ${o}
                </div>
              `).join('')}
              ${showCreate ? `
                <div class="combobox-item create-new"
                  onmousedown="selectComboboxValue('${id}', ${JSON.stringify(typed).replace(/"/g, '&quot;')})">
                  Use "${typed}"
                </div>
              ` : ''}
            </div>
          ` : ''}
        </div>
      `;
    }

    function openCombobox(id) {
      state.openCombobox = id;
      state.comboboxActive = -1;
      render();
    }

    function toggleCombobox(id, event) {
      event.stopPropagation();
      if (state.openCombobox === id) {
        state.openCombobox = null;
      } else {
        state.openCombobox = id;
      }
      state.comboboxActive = -1;
      render();
    }

    function onComboboxInput(id) {
      // Input value already lives in the DOM. We just need to re-render so the
      // filtered panel updates, but we must preserve focus and value.
      const input = document.getElementById(id);
      const value = input?.value || '';
      const selStart = input?.selectionStart;
      const selEnd = input?.selectionEnd;

      state.openCombobox = id;
      state.comboboxActive = -1;
      render();

      // Restore focus and caret position
      setTimeout(() => {
        const newInput = document.getElementById(id);
        if (newInput) {
          newInput.focus();
          try { newInput.setSelectionRange(selStart, selEnd); } catch (e) {}
        }
      }, 0);
    }

    function onComboboxKeydown(event, id) {
      const options = optionsForCombobox(id);
      const typed = event.target.value || '';
      const query = typed.toLowerCase();
      const filtered = options.filter(o => !query || o.toLowerCase().includes(query));
      const exactMatch = options.some(o => o.toLowerCase() === query);
      const showCreate = typed.length > 0 && !exactMatch;

      const totalItems = filtered.length + (showCreate ? 1 : 0);

      if (event.key === 'ArrowDown') {
        event.preventDefault();
        state.openCombobox = id;
        state.comboboxActive = Math.min(state.comboboxActive + 1, totalItems - 1);
        render();
        refocusCombobox(id);
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        state.comboboxActive = Math.max(state.comboboxActive - 1, 0);
        render();
        refocusCombobox(id);
      } else if (event.key === 'Enter') {
        if (state.comboboxActive >= 0 && state.comboboxActive < totalItems) {
          event.preventDefault();
          const value = (state.comboboxActive < filtered.length)
            ? filtered[state.comboboxActive]
            : typed;
          selectComboboxValue(id, value);
        }
      } else if (event.key === 'Escape') {
        state.openCombobox = null;
        state.comboboxActive = -1;
        render();
        refocusCombobox(id);
      }
    }

       function selectComboboxValue(id, value) {
      const input = document.getElementById(id);
      if (input) input.value = value;

      // Remove the panel directly instead of a full re-render.
      // A full re-render destroys the DOM node mid-click, which causes the
      // browser to drop the click and the selection never appears to take.
      const wrap = input?.closest('.combobox');
      const panel = wrap?.querySelector('.combobox-panel');
      if (panel) panel.remove();

      state.openCombobox = null;
      state.comboboxActive = -1;
      // No render() — DOM and state are consistent as-is.
      // The input's value will be read fresh next time we need it
      // (e.g. on save or on the next combobox interaction).
    }

      function attachAdjustStockHandlers() {
        // Reason dropdown: show "Other" text field when needed
        const reasonSelect = document.getElementById("adjReason");
        reasonSelect?.addEventListener("change", () => {
          const wrap = document.getElementById("adjOtherReasonWrap");
          wrap.style.display =
            reasonSelect.value === "Other" ? "block" : "none";
        });

        document
          .getElementById("confirmAdjustBtn")
          ?.addEventListener("click", () => {
            const productId = state.inventoryProductId;
            const product = getInvProduct(productId);
            const locationId = document.getElementById("adjLocation").value;
            const type = document.getElementById("adjType").value;
            const qty = parseInt(document.getElementById("adjQty").value, 10);
            let reason = document.getElementById("adjReason").value;
            const otherReason =
              document.getElementById("adjOtherReason")?.value.trim() || "";
            const notes = document.getElementById("adjNotes").value.trim();

            if (!qty || qty <= 0) return alert("Enter a valid quantity.");
            if (!reason) return alert("Select a reason.");
            if (reason === "Other" && !otherReason)
              return alert("Enter the reason.");
            if (reason === "Other") reason = otherReason;

            // Validation: cannot remove more than available
            const s = getStockSummary(productId, locationId);
            if (type === "remove" && qty > s.available) {
              return alert(
                `Cannot remove ${qty} ${product.unitOfMeasure}(s) at this location.\n\n` +
                  `On hand: ${s.total}\n` +
                  `Reserved: ${s.reserved}\n` +
                  `Available: ${s.available}\n\n` +
                  `You can only remove up to ${s.available} (the unreserved amount).`,
              );
            }
            if (product.trackingType === "Individual") {
              if (type === "add") {
                // Add new units (adjustment-style) with generated tags
                const prefix = product.tagPrefix || product.sku.split("-")[0];
                const ymd = todayISO().replace(/-/g, "");
                const existing = UNITS.filter((u) =>
                  u.tag.startsWith(prefix + "-" + ymd),
                );
                let nextSeq = existing.length + 1;
                for (let i = 0; i < qty; i++) {
                  UNITS.push({
                    id: "u-" + Date.now() + "-" + i,
                    productId,
                    tag: `${prefix}-${ymd}-${String(nextSeq + i).padStart(3, "0")}`,
                    status: "Available",
                    locationId,
                    receivedDate: todayISO(),
                  });
                }
              } else {
                // Remove: mark units as 'Removed' with reason and date
                const candidates = UNITS.filter(
                  (u) =>
                    u.productId === productId &&
                    u.locationId === locationId &&
                    u.status === "Available",
                ).slice(0, qty);
                if (candidates.length < qty) {
                  return alert(
                    `Only ${candidates.length} available to remove.`,
                  );
                }
                const removalDate = todayISO();
                const ref = genNum("ADJ");
                candidates.forEach((u) => {
                  u.status = "Removed";
                  u.removedDate = removalDate;
                  u.removedReason = reason;
                  u.removalReference = ref;
                });
                logMovement(
                  productId,
                  locationId,
                  "adjustment_remove",
                  qty,
                  ref + " · " + reason,
                );
                state.activeModal = null;
                render();
                return;
              }
              // Non-individual items use the movement log below
              logMovement(
                productId,
                locationId,
                type === "add" ? "adjustment_add" : "adjustment_remove",
                qty,
                reason,
              );
            } else {
              // Stock quantity
              let row = STOCK.find(
                (st) =>
                  st.productId === productId && st.locationId === locationId,
              );
              if (!row) {
                if (type === "remove")
                  return alert("No stock at this location.");
                row = { productId, locationId, onHand: 0, reserved: 0 };
                STOCK.push(row);
              }
              if (type === "remove") row.onHand -= qty;
              else row.onHand += qty;
              logMovement(
                productId,
                locationId,
                type === "add" ? "adjustment_add" : "adjustment_remove",
                qty,
                reason,
              );
            }

            state.activeModal = null;
            render();
          });
      }

      /* ============================================================
